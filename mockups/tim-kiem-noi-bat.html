<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toàn văn sáu bài chính sách TikTok Shop</title>
<style>
  :root {
    --ink: #1c1b19;
    --muted: #5e5a54;
    --line: #e3dfd6;
    --sidebar: #f3f1ec;
    --paper: #fffcf8;
    --mark: #f3d36a;
    --select: #e5eee4;
    --accent: #2f4a38;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
  }
  .layout {
    display: flex;
    align-items: stretch;
    height: 100%;
    min-height: 0;
  }
  .sidebar {
    width: 320px;
    flex: 0 0 320px;
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
  }
  .search-wrap { padding: 16px 14px 12px; border-bottom: 1px solid var(--line); }
  .search-wrap label {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .search-wrap input {
    width: 100%;
    font: inherit;
    font-size: 15px;
    padding: 8px 10px;
    border: 1px solid #ccc6ba;
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }
  .search-wrap input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #tree {
    overflow: auto;
    padding: 8px 8px 28px;
    flex: 1;
    min-height: 0;
  }
  #tree ul { list-style: none; margin: 0; padding: 0; }
  #tree ul ul { padding-left: 14px; }
  #tree .row {
    display: flex;
    align-items: flex-start;
  }
  #tree .row.lv1 { margin-top: 14px; }
  #tree > ul > li:first-child > .row.lv1 { margin-top: 4px; }
  #tree button.label {
    display: block;
    flex: 1 1 auto;
    width: auto;
    min-width: 0;
    text-align: left;
    background: transparent;
    border: 0;
    border-left: 2px solid transparent;
    color: inherit;
    cursor: pointer;
    border-radius: 0;
    line-height: 1.35;
  }
  #tree button.label:hover { background: rgba(0, 0, 0, 0.04); }
  #tree button.label:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #tree button.label[aria-current="true"] {
    background: var(--select);
    border-left-color: var(--accent);
  }
  #tree button.toggle,
  #tree .toggle-gap {
    flex: 0 0 26px;
    width: 26px;
    height: 26px;
    margin-top: 2px;
  }
  #tree button.toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  #tree button.toggle:hover { background: rgba(0, 0, 0, 0.06); }
  #tree button.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #tree button.toggle .chev {
    display: block;
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
  }
  #tree button.toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  #tree button.label.lv1 {
    padding: 6px 8px 6px 2px;
    font-size: 15px;
    font-weight: 650;
  }
  #tree button.label.lv2 {
    padding: 4px 8px 4px 2px;
    font-size: 13.5px;
    font-weight: 600;
  }
  #tree button.label.lv3 {
    padding: 3px 8px 3px 2px;
    font-size: 13px;
    font-weight: 500;
    color: #3a3834;
  }
  #tree button.label.lv4,
  #tree button.label.lv5,
  #tree button.label.lv6 {
    padding: 3px 8px 3px 2px;
    font-size: 12.5px;
    font-weight: 450;
    color: #5c5852;
  }
  #tree button.hit {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    width: calc(100% - 26px);
    margin: 0 0 6px 26px;
    padding: 0 8px 0 2px;
    border: 0;
    background: transparent;
    text-align: left;
    color: var(--muted);
    font: inherit;
    font-size: 12.5px;
    font-weight: 450;
    line-height: 1.35;
    cursor: pointer;
  }
  #tree button.hit:hover { background: rgba(0, 0, 0, 0.04); }
  #tree button.hit:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  mark {
    background: var(--mark);
    color: var(--ink);
    padding: 0.04em 0.16em;
    border-radius: 2px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .empty { margin: 16px 10px; color: var(--muted); font-size: 14px; }
  .main {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    height: 100%;
    overflow: auto;
    overflow-anchor: none;
    scrollbar-gutter: stable;
    padding: 0 48px;
    background: var(--paper);
  }
  #reading { max-width: 40rem; }
  .full-note {
    margin: 0;
    padding: 14px 0 12px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.45;
  }
  #top-spacer, #bottom-spacer { width: 100%; }
  .block { display: flow-root; overflow-wrap: break-word; }
  .block.hd { padding-top: 6px; }
  .article-gap { height: 1.35rem; }
  h1 { margin: 0 0 0.8rem; font-size: 1.7rem; line-height: 1.25; font-weight: 650; }
  h2 { margin: 0 0 0.6rem; font-size: 1.28rem; line-height: 1.3; font-weight: 650; }
  h3 { margin: 0 0 0.45rem; font-size: 1.1rem; line-height: 1.35; font-weight: 650; }
  h4, h5, h6 { margin: 0 0 0.35rem; font-size: 1rem; line-height: 1.4; font-weight: 650; }
  p { margin: 0 0 0.9rem; }
  ul, ol { margin: 0 0 1rem; padding-left: 1.3rem; }
  li { margin: 0.25rem 0; }
  li ul, li ol { margin-top: 0.25rem; margin-bottom: 0.25rem; }
  a { color: var(--accent); }
  .shot {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 0.35rem 0 0.75rem;
    color: var(--muted);
    font-size: 0.92rem;
  }
  .table-scroll { overflow-x: auto; margin: 0 0 1.1rem; }
  table { border-collapse: collapse; width: 100%; font-size: 0.92rem; line-height: 1.45; }
  th, td { border: 1px solid #ddd8ce; padding: 6px 8px; vertical-align: top; text-align: left; }
  th { background: #f6f4ef; font-weight: 650; }
  tr.band td { background: #f6f4ef; font-weight: 650; }
  blockquote {
    margin: 0.4rem 0 1rem;
    padding: 0 0 0 0.9rem;
    border-left: 3px solid #cfc8bb;
  }
  hr { border: 0; border-top: 1px solid var(--line); margin: 0.8rem 0 1rem; }
  #measurer {
    position: fixed;
    left: -10000px;
    top: 0;
    visibility: hidden;
    pointer-events: none;
  }
  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: auto;
      flex: 0 1 auto;
      max-height: 42vh;
      height: auto;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .main { padding: 0 18px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="search-wrap">
      <label for="q">Tìm trong sáu bài</label>
      <input id="q" type="search" placeholder="Tìm ngưỡng, hồ sơ, mục…" autocomplete="off">
    </div>
    <nav id="tree" aria-label="Mục lục"></nav>
  </aside>
  <main class="main" id="scroller">
    <article id="reading">
      <p class="full-note" id="full-note">Đây là toàn văn. Chỗ tô sáng chỉ giúp đọc, không thuộc chính sách.</p>
      <div id="top-spacer"></div>
      <div id="window"></div>
      <div id="bottom-spacer"></div>
    </article>
  </main>
</div>
<div id="measurer" aria-hidden="true"></div>
<script>
const BASE = {
  "à":"a","á":"a","ả":"a","ã":"a","ạ":"a",
  "ă":"a","ằ":"a","ắ":"a","ẳ":"a","ẵ":"a","ặ":"a",
  "â":"a","ầ":"a","ấ":"a","ẩ":"a","ẫ":"a","ậ":"a",
  "è":"e","é":"e","ẻ":"e","ẽ":"e","ẹ":"e",
  "ê":"e","ề":"e","ế":"e","ể":"e","ễ":"e","ệ":"e",
  "ì":"i","í":"i","ỉ":"i","ĩ":"i","ị":"i",
  "ò":"o","ó":"o","ỏ":"o","õ":"o","ọ":"o",
  "ô":"o","ồ":"o","ố":"o","ổ":"o","ỗ":"o","ộ":"o",
  "ơ":"o","ờ":"o","ớ":"o","ở":"o","ỡ":"o","ợ":"o",
  "ù":"u","ú":"u","ủ":"u","ũ":"u","ụ":"u",
  "ư":"u","ừ":"u","ứ":"u","ử":"u","ữ":"u","ự":"u",
  "ỳ":"y","ý":"y","ỷ":"y","ỹ":"y","ỵ":"y",
  "đ":"d"
};
function fold(s) {
  let out = "";
  for (const ch of s.toLowerCase()) out += BASE[ch] || ch;
  return out;
}
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, "&quot;");
}
function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const f = fold(text);
  let html = "";
  let i = 0;
  while (i < text.length) {
    const idx = f.indexOf(q, i);
    if (idx < 0) { html += escapeHtml(text.slice(i)); break; }
    html += escapeHtml(text.slice(i, idx));
    html += "<mark>" + escapeHtml(text.slice(idx, idx + q.length)) + "</mark>";
    i = idx + q.length;
  }
  return html;
}
function searchPlain(src) {
  return String(src)
    .replace(/<\/?mark>/gi, "")
    .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
    .replace(/\[([^\]]*)\]\([^)]*\)/g, function (_m, label) { return label; })
    .replace(/<br\s*\/?>/gi, " ")
    .replace(/\\\*/g, "*")
    .replace(/[*`]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}
function safeUrl(url) {
  const t = String(url || "").trim();
  if (/^https?:\/\//i.test(t)) return t;
  return "";
}
function mediaName(url) {
  const id = String(url || "").match(/\/([A-Fa-f0-9]{16,})~/);
  const ext = String(url || "").match(/\.(png|gif|jpe?g|webp|mp4|webm)(?:\?|$)/i);
  if (!id || !ext) return "";
  const e = ext[1].toLowerCase() === "jpeg" ? "jpg" : ext[1].toLowerCase();
  return id[1] + "." + e;
}
function shotHtml(url) {
  const remote = safeUrl(url);
  const name = mediaName(url);
  // ponytail: files are media/<id>.<ext> next to mockups/. A URL without /<id>~ stays remote.
  const local = name ? "../media/" + name : "";
  const src = local || remote;
  if (!src) return '<span class="shot">Nguồn có ảnh chụp màn hình.</span>';
  const fallback = local && remote ? ' data-remote="' + escapeAttr(remote) + '"' : "";
  return '<img class="shot" alt="" src="' + escapeAttr(src) + '"' + fallback + ">";
}
function renderInline(src) {
  const lines = String(src).split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) out.push(renderInlineLine(lines[i]));
  return out.join("<br>");
}
function renderInlineLine(src) {
  const tokens = [];
  let s = src;
  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function (_m, _alt, url) {
    tokens.push({ t: "img", url: url });
    return "\uE000" + (tokens.length - 1) + "\uE001";
  });
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_m, label, url) {
    tokens.push({ t: "a", label: label, url: url });
    return "\uE000" + (tokens.length - 1) + "\uE001";
  });
  s = s.replace(/<br\s*\/?>/gi, function () {
    tokens.push({ t: "br" });
    return "\uE000" + (tokens.length - 1) + "\uE001";
  });
  s = s.replace(/\\\*/g, function () {
    tokens.push({ t: "star" });
    return "\uE000" + (tokens.length - 1) + "\uE001";
  });
  s = s.replace(/<\/?mark>/gi, function (m) {
    tokens.push({ t: m.charAt(1) === "/" ? "mend" : "mstart" });
    return "\uE000" + (tokens.length - 1) + "\uE001";
  });
  s = escapeHtml(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, function (_m, inner) { return "<strong>" + inner + "</strong>"; });
  s = s.replace(/\*([^*]+)\*/g, function (_m, inner) { return "<em>" + inner + "</em>"; });
  s = s.replace(/\uE000(\d+)\uE001/g, function (_m, n) {
    const tok = tokens[Number(n)];
    if (tok.t === "img") return shotHtml(tok.url);
    if (tok.t === "br") return "<br>";
    if (tok.t === "star") return "*";
    if (tok.t === "mstart") return "<mark>";
    if (tok.t === "mend") return "<" + "/mark>";
    const label = renderInlineLine(tok.label);
    const href = safeUrl(tok.url);
    if (!href) return label;
    return '<a href="' + escapeAttr(href) + '" target="_blank" rel="noopener noreferrer">' + label + "</a>";
  });
  return s;
}
function isHeading(line) { return /^(#{1,6})\s+\S/.test(line); }
function isHr(line) { return /^\s*-{3,}\s*$/.test(line); }
function isQuote(line) { return /^>\s?/.test(line); }
function isTableLine(line) { return /^\s*\|/.test(line); }
function isImageLine(line) { return /^\s*!\[[^\]]*\]\([^)]+\)\s*$/.test(line); }
function isListLine(line) { return /^(\s*)([-*]|\d+\.)\s+\S/.test(line); }
function isListAttach(line) { return /^\s+\S/.test(line); }
function isStructural(line) {
  return isHeading(line) || isHr(line) || isQuote(line) || isTableLine(line) || isImageLine(line) || isListLine(line);
}
function splitRow(line) {
  let s = line.trim();
  if (s.charAt(0) === "|") s = s.slice(1);
  if (s.charAt(s.length - 1) === "|") s = s.slice(0, -1);
  return s.split("|").map(function (c) { return c.trim(); });
}
function isSep(line) {
  const cells = splitRow(line);
  return cells.length > 0 && cells.every(function (c) { return /^:?-{3,}:?$/.test(c.replace(/\s/g, "")); });
}
function isBand(cells) {
  if (cells.length < 2 || !searchPlain(cells[0] || "")) return false;
  for (let i = 1; i < cells.length; i++) if (searchPlain(cells[i] || "")) return false;
  return true;
}
function renderTable(lines) {
  const parsed = [];
  let sepAt = -1;
  for (let i = 0; i < lines.length; i++) {
    if (isSep(lines[i])) {
      if (sepAt < 0) sepAt = parsed.length;
      continue;
    }
    parsed.push(splitRow(lines[i]));
  }
  const headCount = sepAt < 0 ? 0 : sepAt;
  let html = '<div class="table-scroll"><table>';
  if (headCount) {
    html += "<thead>";
    for (let r = 0; r < headCount; r++) html += rowHtml(parsed[r], "th", false);
    html += "</thead>";
  }
  if (headCount < parsed.length) {
    html += "<tbody>";
    for (let r = headCount; r < parsed.length; r++) html += rowHtml(parsed[r], "td", isBand(parsed[r]));
    html += "</tbody>";
  }
  html += "</table></div>";
  const plains = [];
  for (let r = 0; r < parsed.length; r++) {
    for (let c = 0; c < parsed[r].length; c++) {
      const t = searchPlain(parsed[r][c]);
      if (t) plains.push(t);
    }
  }
  return { html: html, plain: plains.join(" ") };
}
function rowHtml(cells, tag, band) {
  let html = band ? '<tr class="band">' : "<tr>";
  for (let i = 0; i < cells.length; i++) html += "<" + tag + ">" + renderInline(cells[i]) + "</" + tag + ">";
  html += "</tr>";
  return html;
}
function takeList(lines, start) {
  const buf = [];
  let i = start;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) {
      let j = i + 1;
      while (j < lines.length && !lines[j].trim()) j++;
      if (j < lines.length && (isListLine(lines[j]) || isListAttach(lines[j]))) {
        i = j;
        continue;
      }
      break;
    }
    if (isListLine(line) || (buf.length && isListAttach(line))) {
      buf.push(line);
      i++;
      continue;
    }
    break;
  }
  return { buf: buf, next: i };
}
function parseItems(lines) {
  const root = { children: [] };
  const stack = [{ indent: -1, node: root }];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const marker = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line);
    if (marker) {
      const indent = marker[1].length;
      const kind = marker[2] === "-" || marker[2] === "*" ? "ul" : "ol";
      const num = kind === "ol" ? parseInt(marker[2], 10) : 0;
      const node = { kind: kind, num: num, text: marker[3], children: [] };
      while (stack.length > 1 && indent <= stack[stack.length - 1].indent) stack.pop();
      stack[stack.length - 1].node.children.push(node);
      stack.push({ indent: indent, node: node });
    } else if (stack.length > 1) {
      stack[stack.length - 1].node.text += "\n" + line.trim();
    }
  }
  return root.children;
}
function itemsPlain(items) {
  const parts = [];
  for (let i = 0; i < items.length; i++) {
    const t = searchPlain(items[i].text);
    if (t) parts.push(t);
    if (items[i].children.length) {
      const c = itemsPlain(items[i].children);
      if (c) parts.push(c);
    }
  }
  return parts.join(" ");
}
function renderItems(items) {
  let html = "";
  let i = 0;
  while (i < items.length) {
    const kind = items[i].kind;
    let j = i + 1;
    while (j < items.length && items[j].kind === kind) j++;
    html += kind === "ol" ? "<ol>" : "<ul>";
    for (let k = i; k < j; k++) {
      html += kind === "ol" && items[k].num ? '<li value="' + items[k].num + '">' : "<li>";
      html += renderInline(items[k].text);
      if (items[k].children.length) html += renderItems(items[k].children);
      html += "</li>";
    }
    html += kind === "ol" ? "</ol>" : "</ul>";
    i = j;
  }
  return html;
}
function estimate(block) {
  if (block.type === "gap") return 22;
  if (block.type === "hr") return 24;
  if (block.type === "img") return 240;
  if (block.type === "h") return block.lv === 1 ? 56 : 42;
  if (block.type === "table") return 160;
  const n = (block.plain || "").length;
  return Math.max(28, Math.min(900, 24 + Math.ceil(n / 60) * 26));
}
function parseDocument(md, register) {
  const lines = String(md).replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (isHeading(line)) {
      const mark = /^(#{1,6})\s+/.exec(line);
      const lv = mark[1].length;
      const text = line.slice(mark[0].length).trim();
      const record = register !== false;
      const id = record ? "h" + (headingSeq++) : "";
      const node = record ? { id: id, lv: lv, label: searchPlain(text), direct: "", blockIndex: 0, children: [] } : null;
      if (record) headings.push(node);
      out.push({
        type: "h",
        lv: lv,
        headingId: id,
        node: node,
        html: "<h" + lv + ">" + renderInline(text) + "</h" + lv + ">",
        plain: searchPlain(text)
      });
      i++;
      continue;
    }
    if (isHr(line)) {
      out.push({ type: "hr", html: "<hr>", plain: "" });
      i++;
      continue;
    }
    if (isQuote(line)) {
      const buf = [];
      while (i < lines.length && isQuote(lines[i])) {
        buf.push(lines[i].replace(/^>\s?/, ""));
        i++;
      }
      const text = buf.join(" ");
      out.push({ type: "quote", html: "<blockquote><p>" + renderInline(text) + "</p></blockquote>", plain: searchPlain(text) });
      continue;
    }
    if (isTableLine(line)) {
      const buf = [];
      while (i < lines.length && isTableLine(lines[i])) { buf.push(lines[i]); i++; }
      const table = renderTable(buf);
      out.push({ type: "table", html: table.html, plain: table.plain });
      continue;
    }
    if (isImageLine(line)) {
      const src = /!\[[^\]]*\]\(([^)]+)\)/.exec(line);
      out.push({ type: "img", html: "<p>" + shotHtml(src && src[1]) + "</p>", plain: "" });
      i++;
      continue;
    }
    if (isListLine(line)) {
      const taken = takeList(lines, i);
      const items = parseItems(taken.buf);
      out.push({ type: "list", html: renderItems(items), plain: itemsPlain(items) });
      i = taken.next;
      continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !isStructural(lines[i])) {
      buf.push(lines[i].trim());
      i++;
    }
    const text = buf.join(" ");
    out.push({ type: "p", html: "<p>" + renderInline(text) + "</p>", plain: searchPlain(text) });
  }
  return out;
}

const OVERSCAN = 480;
let blocks = [];
let headings = [];
let tree = [];
let byId = new Map();
let total = 0;
let headingSeq = 0;
let selectedId = null;
let scroller, reading, noteEl, topSpacer, bottomSpacer, windowEl, measurer;
let mountedStart = -1;
let mountedEnd = -1;
const live = new Map();
const pool = [];

function matchSnippet(direct, q) {

const SOURCES = ["# Chính sách đánh giá hiệu suất của người bán trên TikTok Shop\n\n- Ngày trên bài nguồn: 22/09/2026\n- knowledge_id: 8623594494494465\n- Nguồn: https://seller-vn.tiktok.com/university/essay?knowledge_id=8623594494494465&role=1&course_type=1&from=search&identity=1&lang=vi-VN\n\nBản toàn văn. Thẻ mark chỉ để nhìn nhanh, không thuộc nội dung chính sách.\n\n## 1. Tổng quan\n\n- Đây là **Chính sách** **đánh giá hiệu suất của người bán** (sau đây gọi là \"**Chính sách này**\"). Chính sách này trình bày chi tiết hành động thực thi mà TikTok Shop (sau đây gọi là \"**Nền tảng**\") sẽ áp dụng đối với những Người bán vi phạm Điều khoản và Chính sách của Nền tảng, cũng như cách thức Người bán có thể kháng nghị hành động thực thi đó.\n- Nền tảng có thể áp dụng hành động thực thi theo quy định trong Chính sách này, bất kỳ Chính sách nào khác của Nền tảng và **Điều khoản sử dụng của người bán**.\n- Chính sách này chỉ áp dụng với **Người bán**.\n- Chính sách này chưa bao quát tất cả các trường hợp. Người bán hoàn toàn chịu trách nhiệm đảm bảo rằng họ không tham gia vào bất kỳ hành vi nào mà Chính sách này nghiêm cấm. Đồng thời, họ phải tuân thủ các luật lệ và quy định hiện hành, cũng như tất cả các Điều khoản và Chính sách của Nền tảng.\n- Người bán có thể cần tìm kiếm tư vấn pháp lý độc lập nếu họ có thắc mắc về luật pháp và quy định liên quan đến hoạt động của mình.\n- Chính sách của chúng tôi được cập nhật định kỳ. Thông thường, chúng tôi sẽ thông báo trước cho bạn về tất cả những thay đổi đối với Chính sách này. Vui lòng đọc **Điều khoản sử dụng của người bán** để nắm được thông tin chi tiết về cách thức chúng tôi có thể thực hiện các thay đổi đối với điều khoản và chính sách của mình. Người bán có trách nhiệm thường xuyên xem trang này để đảm bảo rằng họ tuân thủ Chính sách của chúng tôi.\n\n## 2. Trừ điểm tình trạng tài khoản AHR\n\nĐiểm tình trạng tài khoản (AHR) bị trừ theo cách thức như sau:\n\n- Điểm tình trạng tài khoản (AHR) bị trừ khi vi phạm các chính sách của chúng tôi.\n- Số điểm AHR bị trừ tương ứng với mức độ nghiêm trọng và tác động của các vi phạm chính sách.\n- Khi điểm tình trạng tài khoản (AHR) của Người bán đạt đến các ngưỡng được quy định trong Mục 5 dưới đây, Nền tảng sẽ thực hiện hành động thực thi tương ứng.\n- \u003cmark>Điểm tình trạng tài khoản (AHR) bị trừ do vi phạm sẽ được tự động xóa sau mỗi **90** ngày trừ khi cửa hàng của Người bán đã bị nền tảng đóng, tức là Điểm tình trạng tài khoản (AHR) = 0.\u003c/mark>\n- Nền tảng có thể thực hiện bất kỳ hành động khắc phục và kiểm soát bổ sung cần thiết nào ngoài việc trừ điểm AHR.\n\n## 3. Hành động thực thi áp dụng với các Tài khoản liên kết\n\n- **Tài khoản liên kết** tức là tài khoản của Người bán, tài khoản của Nhà sáng tạo khác hoặc bất kỳ loại tài khoản nào trên nền tảng TikTok mà Nền tảng xác định một cách hợp lý rằng tài khoản đó có đủ kết nối để chỉ ra mối quan hệ hiện tại giữa chủ sở hữu của các tài khoản có liên quan.\n- \u003cmark>Nếu Nền tảng phát hiện ra rằng tài khoản của Người bán có (các) Tài khoản liên kết và các tài khoản đó đã vi phạm Điều khoản và Chính sách của chúng tôi hoặc bất kỳ luật hiện hành nào, chúng tôi có thể triển khai hành động thực thi đối với Người bán và (các) Tài khoản liên kết.\u003c/mark>\n- (Các) hành động thực thi áp dụng đối với Tài khoản liên kết sẽ phụ thuộc vào mức độ nghiêm trọng của hành động vi phạm. Nền tảng sẽ xác định mức độ nghiêm trọng của tất cả các hành động thực thi được thực hiện một cách hợp lý, nhưng sẽ tuân theo toàn quyền quyết định của Nền tảng.\n\n## 4. Vi phạm chính sách\n\nBảng sau đây trình bày danh sách một số hành động vi phạm chính sách có thể khiến người bán nhận được điểm AHR và phải chịu các hành động thực thi (xem phần 7), có thể bao gồm cả hình phạt vô hiệu hóa tài khoản. Chúng tôi có thể áp dụng nhiều điểm AHR hơn và triển khai các hành động thực thi nghiêm khắc hơn đối với những vi phạm lặp lại.\n\n| Lý do vi phạm | Điểm AHR |\n| --- | --- |\n| **Chứng nhận người bán và sản phẩm** |  |\n| Thiếu chứng nhận | 6-48 |\n| Chứng nhận hết hạn | 4-48 |\n| Chứng nhận không xác thực | 12-48 |\n| **Quyền sở hữu trí tuệ** |  |\n| Vi phạm quyền sở hữu trí tuệ (IP) | 1-48 |\n| Hàng giả | 4-48 |\n| Hàng nhái | 0-4 |\n| **Niêm yết sản phẩm** |  |\n| Danh mục không phù hợp | 0-48 |\n| Niêm yết hoặc vận chuyển sản phẩm bị cấm | 6-48 |\n| Niêm yết hoặc vận chuyển sản phẩm không được hỗ trợ | 0-48 |\n| Không tuân thủ Nguyên tắc niêm yết sản phẩm | 0-48 |\n| **Chất lượng Sản phẩm (Kiểm tra lấy mẫu sản phẩm)** |  |\n| Vi phạm Chất lượng Sản phẩm | 0-48 |\n| **Dịch vụ khách hàng** |  |\n| Tỷ lệ phản hồi trong vòng 24h ở mức thấp | 1 |\n| Giao tiếp với khách hàng bằng hình thức không phù hợp/bị cấm | 1-12 |\n| **Hoạt động hoàn thành đơn hàng của người bán** |  |\n| Tỷ lệ hủy cao do lỗi của người bán (SFCR) | 2-4 |\n| Tỷ lệ gửi hàng muộn (LDR) ở mức cao | 2-4 |\n| Tỷ lệ trả hàng/hoàn tiền do lỗi của người bán ở mức cao | 2 |\n| Vận chuyển sản phẩm \"Khác biệt lớn so với mô tả (SNAD)\" | 1-48 |\n| **Nội dung thương mại điện tử**\u003cbr>Lưu ý: TikTok Shop có thể áp dụng hình phạt chung đối với cửa hàng/tài khoản của bạn nếu tài khoản nhà sáng tạo liên kết với bạn vi phạm nguyên tắc và chính sách trên nền tảng của chúng tôi. |  |\n| Nội dung không nguyên bản | 48 |\n| Quảng cáo sản phẩm bị cấm hoặc sản phẩm không được hỗ trợ | 6-48 |\n| Quảng cáo sản phẩm không nhất quán | 1-48 |\n| Hoạt động bị cấm theo luật pháp và quy định | 48 |\n\n#### Vi phạm liên quan đến Thông tin nhận dạng cá nhân của Người mua (Buyer PII)\n\n\u003cmark>Người bán vi phạm liên quan đến **Thông tin nhận dạng cá nhân của Người mua (Buyer PII)** sẽ nhận các hành động thực thi nghiêm khắc hơn, bao gồm **tạm ngừng tài khoản** và **vô hiệu hóa tài khoản vĩnh viễn.**\u003c/mark> Buyer PII bao gồm nhưng không giới hạn ở các thông tin sau của Người mua:\n\n- Họ và tên đầy đủ, Số điện thoại, Địa chỉ email, Địa chỉ giao hàng, Tên tài khoản mạng xã hội hoặc tên người dùng (ví dụ: tên người dùng TikTok), Thông tin thanh toán, Số định danh quốc gia hoặc mã số thuế và chi tiết đơn hàng mà khi kết hợp với thông tin công khai có thể xác định lại danh tính Người mua.\n\nCác hành vi bị cấm bao gồm nhưng không giới hạn ở:\n\n- **Chuyển hướng Người mua ra ngoài nền tảng**, bao gồm việc chia sẻ thông tin liên lạc cá nhân (điện thoại, email, tên tài khoản mạng xã hội, URL) trong bất kỳ nội dung liên lạc, danh sách sản phẩm hoặc tài liệu giao hàng nào từ Người bán đến Người mua.\n- \u003cmark>**Thu thập Buyer PII** qua bất kỳ kênh nào (chat, danh sách sản phẩm, phiếu đóng gói, liên lạc sau mua hàng), trừ khi được TikTok Shop cho phép vì mục đích thực hiện đơn hàng.\u003c/mark>\n- **Sử dụng sai mục đích hoặc chia sẻ Buyer PII** cho bất kỳ mục đích nào ngoài việc thực hiện giao dịch TikTok Shop cụ thể mà thông tin đó được cung cấp. Điều này bao gồm việc liên hệ với Người mua ngoài các kênh được TikTok Shop hỗ trợ, gửi tiếp thị không được yêu cầu, tiết lộ PII cho bên thứ ba không được ủy quyền, tái sử dụng PII giữa các giao dịch, đăng PII công khai, hoặc thực hiện đơn hàng qua các nền tảng bên ngoài gửi xác nhận trực tiếp đến Người mua (ví dụ: dropshipping).\n- **Lưu giữ Buyer PII vượt quá nhu cầu thực hiện đơn hàng.** PII phải được xóa hoặc ẩn danh hóa không chậm trễ một khi giao dịch và thời hạn trả hàng/khiếu nại áp dụng (nếu có) đã kết thúc.\n\n## 5. Hệ thống Cột mốc thực thi\n\nKhi xảy ra hành vi động phạm các chính sách và nguyên tắc của chúng tôi, Nền tảng có quyền triển khai các hành động thực thi khắc phục cần thiết đối với người bán. Người bán tích lũy một số điểm AHR nhất định sẽ đạt đến các ngưỡng thực thi khác nhau. Tại các ngưỡng đó, Nền tảng sẽ triển khai Hành động thực thi đối với tài khoản của họ dựa trên số điểm tích lũy.\n\nBiểu đồ bên dưới minh họa mối quan hệ giữa các hành động thực thi và số điểm AHR tích lũy của người bán. Xin lưu ý rằng Nền tảng có thể triển khai nhiều hành động thực thi, tùy theo hình thức vi phạm của người bán.\n\nNền tảng sẽ gửi thông báo cảnh báo chính thức cho người bán khi số điểm AHR của họ còn cách mỗi ngưỡng thực thi 5 điểm.\n\n| Hành động thực thi | Ngưỡng thực thi (Điểm AHR) |\n| --- | --- |\n| \u003cmark>Người bán sẽ không thể tham gia các siêu chiến dịch mới, hoạt động phát triển người dùng, trợ cấp vận chuyển miễn phí do nền tảng tài trợ và các lợi ích khác của nền tảng trong (7) ngày theo lịch.\u003cbr>Người bán sẽ không thể đăng ký Chương trình liên kết (7) ngày theo lịch.\u003c/mark> | \u003cmark>12\u003c/mark> |\n| \u003cmark>Người bán sẽ không thể tham gia các siêu chiến dịch mới, hoạt động phát triển người dùng, trợ cấp vận chuyển miễn phí do nền tảng tài trợ và các lợi ích khác của nền tảng trong (14) ngày theo lịch.\u003cbr>Người bán sẽ không thể đăng ký Chương trình liên kết (14) ngày theo lịch.\u003cbr>Tạm ngưng khả năng tạo và cập nhật danh sách niêm yết mới trong (14) ngày theo lịch.\u003c/mark> | \u003cmark>24\u003c/mark> |\n| \u003cmark>Nền tảng sẽ vô hiệu hóa cửa hàng của người bán trong (28) ngày theo lịch.\u003cbr>Người bán sẽ không thể tham gia các siêu chiến dịch mới, hoạt động phát triển người dùng, trợ cấp vận chuyển miễn phí do nền tảng tài trợ và các lợi ích khác của nền tảng trong (42) ngày theo lịch.\u003c/mark> | \u003cmark>36\u003c/mark> |\n| \u003cmark>Nền tảng sẽ vĩnh viễn chấm dứt cửa hàng của người bán.\u003cbr>Nền tảng có thể bắt đầu triển khai hành động pháp lý đối với người bán và/hoặc báo cáo người bán với cơ quan quản lý có liên quan\u003c/mark> | \u003cmark>48\u003c/mark> |\n\n## 6. Hành động thực thi\n\nBên cạnh các ví dụ trong Phần 6, chúng tôi có thể thực hiện thêm các hành động thực thi khác đối với các hành vi vi phạm chính sách, nguyên tắc hoặc điều khoản dịch vụ của chúng tôi. Sau đây là danh sách gồm một số ví dụ về các hành động thực thi mà chúng tôi có thể thực hiện:\n\n- Thông báo cảnh báo chính thức.\n- Tạm ngưng đặc quyền niêm yết sản phẩm.\n- Hủy niêm yết sản phẩm.\n- Ngăn chặn lưu lượng truy cập của người dùng đối với quảng cáo, buổi phát trực tiếp, video và sản phẩm được niêm yết của người bán\n- Xóa quyền đủ điều kiện để được đề xuất trong Trung tâm mua sắm đối với sản phẩm được niêm yết của người bán.\n- Áp đặt giới hạn về đơn hàng và số lượng danh sách niêm yết sản phẩm đối với cửa hàng của người bán.\n- Tạm thời thu hồi hoặc chấm dứt vĩnh viễn quyền lợi của người bán.\n- Tạm ngưng hoặc chấm dứt vĩnh viễn việc đăng ký Bên liên kết của người bán và các sự kiện khác.\n- Tạm thời thu hồi hoặc chấm dứt vĩnh viễn quyền truy cập vào Nền tảng.\n- \u003cmark>Tạm thời giữ lại hoặc giữ lại vĩnh viễn (trong trường hợp nghiêm trọng) tất cả số dư và/hoặc hủy mọi giao dịch liên quan đến tài khoản của người bán.\u003c/mark>\n- Hủy bỏ hoặc thu hồi các chương trình khuyến mãi và/hoặc trợ cấp đã cung cấp cho người bán.\n- \u003cmark>Xóa tài khoản của người bán.\u003c/mark>\n- Áp dụng hành động pháp lý đối với người bán.\n- [Áp dụng chu kỳ quyết toán kéo dài với cửa hàng của người bán](https://seller-vn.tiktok.com/university/essay?knowledge_id=1721378949678850&from=policy&role=1&identity=1)\n- \u003cmark>Báo cáo người bán cho các cơ quan quản lý có liên quan để truy tố (chúng tôi có quyền cung cấp thông tin cần thiết về tài khoản của người bán cho các cơ quan quản lý).\u003c/mark>\n- \u003cmark>Tước khả năng của người bán trong việc xem xét và phê duyệt các yêu cầu hoàn tiền do khách hàng đưa ra. Chúng tôi sẽ thay mặt người bán trực tiếp xử lý quyết định phê duyệt yêu cầu hoàn tiền của khách hàng.\u003c/mark>\n- \u003cmark>Khấu trừ mọi khoản tiền đến hạn và phải trả cho người bán để lấy đó làm khoản bồi thường mà người bán phải đáp ứng đối với mọi tổn thất hoặc thiệt hại của chúng tôi và/hoặc (những) người mua bị ảnh hưởng hoặc các bên thứ ba có liên quan khác.\u003c/mark>\n\n## 7. Tạm giữ số dư\n\n\u003cmark>Bên cạnh các quyền của Nền tảng nêu trên, nếu chúng tôi có lý do hợp lý để tin rằng người bán đã vi phạm chính sách này, bất kỳ **Chính sách nào** của chúng tôi hoặc **Điều khoản dịch vụ đối với người bán, thì chúng tôi có thể tạm thời giữ lại từ bạn các khoản tiền phải trả hoặc có thể phải trả cho người bán (bao gồm nhưng không giới hạn ở tiền bán hàng) (gọi chung là \"Số dư\")**. Nền tảng có toàn quyền đưa ra quyết định này và không cần thông báo trước cho người bán. Tuy nhiên, chúng tôi sẽ thông báo nếu chúng tôi áp dụng hạn chế này đối với tài khoản của bạn.\u003c/mark>\n\n\u003cmark>Việc giữ lại Số dư có thể được thực hiện lâu hơn trong trường hợp:\u003c/mark>\n\n\u003cmark>(a) 180 ngày theo lịch kể từ ngày có thông báo tạm ngưng của Nền tảng; hoặc\u003c/mark>\n\n\u003cmark>(b) Hoàn thành điều tra của Nền tảng về hành vi vi phạm đáng ngờ của người bán.\u003c/mark>\n\n\u003cmark>Nếu Nền tảng xác định (hành động hợp lý) rằng nếu người bán vi phạm chính sách này hoặc bất kỳ chính sách nào khác của chúng tôi đã dẫn đến các tổn thất hoặc thiệt hại cho Nền tảng, (những) người mua hoặc các bên thứ ba khác, bao gồm chi phí hoạt động của bất kỳ cuộc điều tra liên quan nào, người bán có thể phải bồi thường, từ Số dư, cho Nền tảng và/hoặc (những) người mua bị ảnh hưởng hoặc các bên thứ ba có liên quan khác. Sau khi thanh toán xong tiền bồi thường, chúng tôi sẽ hoàn trả Số dư còn lại cho người bán.\u003c/mark>\n\nNgười bán có thể nộp đơn kháng nghị đối với hành động thực thi này theo mục 9 dưới đây.\n\nNếu kháng nghị thành công, Nền tảng sẽ trả lại tiền cho người bán.\n\nNền tảng có thể giữ lại số dư nếu bạn phạm phải các vi phạm sau đây (dưới đây chỉ là một số trường hợp ví dụ):\n\n- [Sản phẩm \"Khác biệt lớn so với mô tả\" (SNAD)](https://seller-vn.tiktok.com/university/essay?knowledge_id=6837791128831746&role=1&course_type=1&from=search&identity=1)\n- [Đơn hàng giả mạo hoặc gian lận](https://seller-vn.tiktok.com/university/essay?knowledge_id=5328890282182401&role=1&course_type=1&from=search&identity=1)\n- [Truy cập trái phép](https://seller-vn.tiktok.com/university/essay?knowledge_id=6837778147346177&role=1&course_type=1&from=search&identity=1)\n- [Tài khoản có số dư âm](https://seller-vn.tiktok.com/university/essay?knowledge_id=8913188201465602&role=1&course_type=1&from=search&identity=1)\n- [Lạm dụng trợ cấp của nền tảng](https://seller-vn.tiktok.com/university/essay?knowledge_id=6837795792570114&role=1&course_type=1&from=search&identity=1)\n- Không bảo mật tài khoản bằng tính năng [xác minh 2 bước](https://seller-vn.tiktok.com/university/essay?knowledge_id=1717011551110928)\n\n## 8. Kháng nghị\n\n- \u003cmark>Nếu Người bán cho rằng hành động thực thi được áp dụng với họ do nhầm lẫn, họ có thể kháng nghị thông qua chức năng kháng nghị do nền tảng cung cấp trong thông báo hành động thực thi.\u003c/mark>\n- Sau đó, Nền tảng sẽ điều tra trường hợp này và thực hiện hành động khắc phục nếu thích hợp.\n- \u003cmark>Xin lưu ý rằng việc gửi kháng nghị không đảm bảo rằng Người bán sẽ kháng nghị thành công.\u003c/mark>\n\n### 8.1 Quy trình kháng nghị\n\n- \u003cmark>Người bán có thể gửi tối đa hai kháng nghị đối với một hành động thực thi.\u003c/mark>\n- \u003cmark>Trong vòng 30 ngày kể từ ngày nhận được thông báo về hành động thực thi, Người bán phải nộp kháng nghị đầu tiên. Phải nộp kháng nghị thứ hai trong vòng mười lăm (15) ngày kể từ ngày từ chối kháng nghị đầu tiên. Sau thời gian này, người bán không được phép nộp kháng nghị nữa.\u003c/mark>\n- \u003cmark>Điểm AHR phát sinh từ mỗi hành động vi phạm sẽ được xóa tự động sau 90 ngày theo lịch, trừ khi Người bán đã tích lũy đủ 48 điểm.\u003c/mark>\n- Tất cả các kháng nghị được đưa ra sau các mốc thời gian quy định ở trên không phải là kháng nghị hợp lệ và sẽ không được Nền tảng xem xét.\n\n### 8.2 Kết quả kháng nghị\n\n- Trong thời gian không quá chậm trễ, Nền tảng sẽ đánh giá kháng nghị của Người bán và thông báo cho Người bán về kết quả kháng nghị hoặc đưa ra yêu cầu cung cấp thêm thông tin. Người bán cũng sẽ nhận được thông báo về khả năng giải quyết tranh chấp ngoài tòa án và các biện pháp khắc phục có sẵn khác.\n- Trong thời gian không quá chậm trễ, chúng tôi sẽ thông báo cho Người bán về quyết định của Nền tảng liên quan đến kháng nghị của họ.\n- \u003cmark>Nếu Người bán kháng nghị thành công, Nền tảng sẽ xóa mọi hình phạt đã ban hành và/hoặc khôi phục mọi đặc quyền đã thu hồi từ Người bán.\u003c/mark>\n- \u003cmark>Tất cả các quyết định do Nền tảng đưa ra đều tuân theo toàn quyền quyết định của Nền tảng và không phân biệt đối xử, được xem xét cẩn thận và không độc đoán. Không phân biệt quy trình giải quyết tranh chấp ngoài tòa án và thủ tục hòa giải do Nền tảng đưa ra, quyết định được coi là có hiệu lực cuối cùng sau khi Nền tảng từ chối kháng nghị thứ hai.\u003c/mark>\n","# Cộng Tác Tiếp Thị Liên Kết\n\n- Ngày trên bài nguồn: 14/10/2026\n- knowledge_id: 6837788624340738\n- Nguồn: https://seller-vn.tiktok.com/university/essay?knowledge_id=6837788624340738&role=1&course_type=1&from=search&identity=1&lang=vi-VN\n\nBản toàn văn. Thẻ mark chỉ để nhìn nhanh, không thuộc nội dung chính sách.\n\nBài viết này sẽ hướng dẫn bạn cách sử dụng tính năng **Cộng tác** (trước đây được gọi là **Kế hoạch**) trong TikTok Shop Affiliate (Tiếp thị liên kết). Chương trình Affiliate tạo ra tính năng này để đem lại cho bạn, với vai trò là Nhà bán hàng, thêm nhiều cách để bán sản phẩm với sự trợ giúp đến từ các Nhà sáng tạo. Với TikTok Shop Affiliate, Nhà bán hàng và Nhà sáng tạo đôi bên cùng có lợi: Nhà bán hàng có thể bán được nhiều sản phẩm hơn, trong khi Nhà sáng tạo có thể kiếm thêm hoa hồng từ việc bán các sản phẩm đó.\n\nĐể bắt đầu, chúng ta sẽ xem qua hai phiên bản: **Cộng tác mở** và **Cộng tác mục tiêu**. Hai phiên bản này khác nhau ở cách bạn liên kết với Nhà sáng tạo như thế nào.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/f655566c0b9a43439563a38875541921~tplv-nk3i2mqmvs-image.png?x-expires=2016691230&x-signature=dtf8bWQUdofnTBJ66JVoZFWeQhM%3D)\n\n## Cộng tác là gì?\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/2035b9b75048479ca1ece40ed6d86fa8~tplv-nk3i2mqmvs-image.png?x-expir ng?x-expires=2016691228&x-signature=9WyyZCsUchPrNMTc%2F8S4%2B2GsmOw%3D)\n\n## Cộng tác mục tiêu\n\nSử dụng **Cộng tác mục tiêu** cho phép bạn mời những nhà sáng tạo cụ thể quảng bá sản phẩm cho bạn. Nhà sáng tạo có thể bắt đầu quảng cáo sau khi họ chấp nhận lời mời của bạn. Họ sẽ nhận được một thư mời trong hộp thư đến của mình. Tại đó, họ có thể thêm sản phẩm của bạn vào trang trưng bày của mình và từ đó, bắt đầu tạo nội dung.\n\n**Hành trình cộng tác mục tiêu**\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/90ff5f2313b24d7c881eecb09dc0f915~tplv-nk3i2mqmvs-image.png?x-expires=2016691227&x-signature=BB3y0w6vu67TVPbOKfj4Ulc%2BHrE%3D)\n\n---\n\n### Tạo cộng tác mục tiêu của bạn\n\nBắt đầu **Cộng tác mục tiêu** bằng cách truy cập vào Trung tâm Affiliate và nhấp vào mục **Cộng tác** trên menu bên tay trái.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/08c2c27cc0344288bc50805e952b9550~tplv-nk3i2mqmvs-image.png?x-expires=2016691227&x-signature=%2FEEWG020uCfMes9lkiOAwgqy9cQ%3D)\n\n#### Kết nối nhà sáng tạo\n\n- Từ [Trung tâm Affiliate > Kết nối nhà sáng tạo](https://affiliate.tiktok.com/connection/creator?shop_region=PH), trong khi lướt tìm các nhà sáng tạo khác nhau mà bạn có thể hợp tác, bạn chỉ cần chọn nút “Mời” trên một nhà sáng tạo cụ thể là bạn đã có thể bắt đầu khởi tạo cộng tác mục tiêu.\n\n    ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/247e5194bc9a40118ca99243a062547c~tplv-nk3i2mqmvs-image.png?x-expires=2016691226&x-signature=9LF8azdO5UyK%2BUuMM9Tu%2BlY7ijQ%3D)\n\n**Nhà sáng tạo đã lưu và Mời hàng loạt**\n\n- Trong mục Kết nối nhà sáng tạo, bạn có thể lưu các nhà sáng tạo bằng cách sử dụng nút trái tim nằm trên mỗi dòng của nhà sáng tạo. Tab **Nhà sáng tạo đã lưu** sẽ hiển thị cho bạn danh sách các nhà sáng tạo mà bạn “đã thả tim”. Trên màn hình này, bạn sẽ có thể mời riêng Nhà sáng tạo hoặc **Mời hàng loạt** bằng cách nhấp vào dấu kiểm bên cạnh mục “Nhà sáng tạo”.\n\n    ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/3cb55356a54e46ab95654190a28bcb6c~tplv-nk3i2mqmvs-image.png?x-expires=2016691225&x-signature=bBvHzX93EY1L8Vu%2FwHohwFMbMEU%3D)\n\n**Thẻ nhà sáng tạo**\n\n- Sau khi đã chọn được nhà sáng tạo phù hợp từ Kết nối nhà sáng tạo, bạn có thể xem dữ liệu về hiệu suất của người đó trong thẻ nhà sáng tạo của họ. Bạn cũng sẽ có quyền mời nhà sáng tạo tham gia cộng tác mục tiêu từ giao diện này.\n\n    ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/cbc9f2a3d0e0478d9e146480c0e0697b~tplv-nk3i2mqmvs-image.png?x-expires=2016691225&x-signature=%2FL6639%2FV%2F1WiUZRjiJIDIccV11w%3D)\n\n---\n\n#### Thư mời mục tiêu\n\nMột cách khác để tạo Cộng tác mục tiêu là dùng **Thư mời mục tiêu**. Hãy truy cập [Tiếp thị liên kết > Thư mời mục tiêu](https://affiliate.tiktok.com/plan/targeted?shop_region=PHhttps://affiliate.tiktok.com/plan/targeted/create?shop_region=PH) để mời một danh sách nhiều nhà sáng tạo quảng bá cho sản phẩm của bạn trong một ngày và khoảng thời gian cố định. Trên màn hình Thư mời mục tiêu, nhấp vào **Gửi lời mời** ở góc trên bên phải màn hình của bạn.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/342690a19e364e44889099540cb32a9d~tplv-nk3i2mqmvs-image.png?x-expires=2016691224&x-signature=3nlRdfPKeCTCksVaZy%2FmNHfNqVQ%3D)\n\n---\n\nKhi bạn vào trang **Mời cộng tác**, bạn sẽ cần thực hiện bốn (4) bước chính để tạo **Cộng tác mục tiêu**\n\n##### Bước 1: Tạo Thư Mời\n\n- **Tên lời mời**: Đây sẽ là tên mà bạn dùng để gọi danh sách các nhà sáng tạo mà bạn đã mời.\n- **Có hiệu lực đến**: Các nhà sáng tạo sẽ có thể chấp nhận và quảng bá sản phẩm của bạn trong khoảng thời gian này.\n- **Thông Tin Liên Hệ**: Chia sẻ thông tin liên lạc của bạn để các nhà sáng tạo có thể liên hệ.\n- **Nội dung lời mời**: Bạn có thể thêm một thông điệp để thuyết phục nhà sáng tạo quảng bá thương hiệu / sản phẩm của bạn (tùy chọn).\n- \u003cmark>**Loại nội dung ưu tiên**: Chia sẻ loại nội dung mà bạn ưa thích. Lưu ý rằng nhà sáng tạo vẫn có thể đăng bất kỳ loại nội dung nào để kiếm hoa hồng từ lời mời này.\u003c/mark>\n\n    ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/7c7ca641fec74c4b942b44d0e912dced~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2092125123&x-signature=XLNjwdIn0IRgogH9ejGRWhXqteU%3D)\n\n##### Bước 2: Chọn sản phẩm\n\n\u003cmark>Kiểm tra tất cả các sản phẩm bạn đã chọn và bấm **Thêm**. Bạn có thể thêm tối đa 100 sản phẩm cho mỗi lời mời.\u003c/mark>\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/acf5e1a3d15d48f693e604d7ed548de5~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2092125123&x-signature=sxlzdcYItVNKuy665B%2FzdKKPLIw%3D)\n\n*📝 Hãy nhớ rằng khi thêm sản phẩm, điều quan trọng là phải kiểm tra lượng hàng tồn kho của bạn! Bạn không muốn bỏ lỡ doanh số vì các nhà sáng tạo hết hàng để bán!*Khi các sản phẩm của bạn đã được chọn, bạn có thể xác định tỷ lệ hoa hồng cho mỗi sản phẩm, và hệ thống sẽ tự động tính toán giá trị hoa hồng ước tính cho mỗi sản phẩm mà nhà sáng tạo bán.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/f12e43450e454fbeaa4cf32eeadd7b09~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2092125123&x-signature=I7d16rouYjFZKjnNKAA2d5easd4%3D)\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/083683eb4fc342c8b23bfc89b06b4ee7~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2092125124&x-signature=lFqXE5YQLd8OutEKyYMGxS8acjo%3D)\n\n*📝 Hãy chắc chắn xác định mức hoa hồng hấp dẫn đối với các nhà sáng tạo! Sử dụng hướng dẫn về mức hoa hồng được đề xuất để giúp bạn xác định tỷ lệ hoa hồng phù hợp!*\n\n##### Bước 3: Thiết lập mẫu thử miễn phí\n\nSau khi bạn đã thêm Nhà sáng tạo và Sản phẩm cho Thư mời mục tiêu, đây là lúc thiết lập Mẫu thử miễn phí. Bấm vào [đây](https://seller-vn.tiktok.com/university/essay?knowledge_id=4320631378609922&role=1&course_type=1&from=search&identity=1) để biết thêm thông tin về cách thiết lập.\n\n##### Bước 4: Chọn Nhà Sáng Tạo\n\n- Bạn có thể tìm kiếm nhà sáng tạo theo tên người dùng hoặc từ những người bạn đã lưu trong **Tìm nhà sáng tạo**![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/95df64f34fe34f3e90b29d23ae2cfe86~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2099558877&x-signature=lox1BJ5A27YE3y3vnVcI5nAPGmY%3D)\n\n---\n\n### Hiệu suất cộng tác mục tiêu\n\nKhi tính năng Cộng tác mục tiêu đã hoạt động, bạn có thể kiểm tra từng hiệu suất của Cộng tác mục tiêu vào bất kỳ lúc nào. Bạn sẽ có thể xem có bao nhiêu Nhà sáng tạo đã chấp nhận lời mời và bao nhiêu trong số những Nhà sáng tạo được mời này đã đăng bài.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/9fa60eaa8d23411eabfd828a632e955f~tplv-nk3i2mqmvs-image.png?x-expires=2016691221&x-signature=hMYq33j4nHhvdqvsjoGVTxzjfRg%3D)\n\nNhấp vào tên của Cộng tác mục tiêu và bạn sẽ có thể tìm thấy tất cả thông tin cần thiết: **Chi tiết cộng tác, Chi tiết về nhà sáng tạo và Chi tiết sản phẩm**.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/79439a6a4c054e58aeae9e41fcc409e8~tplv-nk3i2mqmvs-image.png?x-expires=2016691220&x-signature=nxHZK6iaibnzYLJP6TAlv4oXlZA%3D)\n\n**Chi tiết video**\n\nĐối với mỗi sản phẩm có nội dung do nhà sáng tạo đăng, bạn sẽ có thể xem nội dung video giới thiệu về sản phẩm đó.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/b1070d131d464b7aaae50e9a12a696ee~tplv-nk3i2mqmvs-image.png?x-expires=2016691219&x-signature=X9IHOkrGToEjlIfOzql3LctjaB4%3D)\n\n---\n\n### Góc nhìn từ nhà sáng tạo của cộng tác mục tiêu\n\nSau khi bạn đã thiết lập Cộng tác mục tiêu, Nhà sáng tạo sẽ có thể nhìn thấy lời mời của bạn như hiển thị dưới đây:\n\n**Cách nhà sáng tạo nhìn thấy Lời mời cộng tác mục tiêu của bạn**\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/93f3efb81dd14eab93d56831a73b953c~tplv-nk3i2mqmvs-image.png?x-expires=2016691220&x-signature=e5oWcLANiTJ8QB8IknCS8s0k60s%3D)\n\n### Xóa sản phẩm và Nhà sáng tạo trong Cộng tác Mục tiêu\n\nNếu bạn muốn xóa Sản phẩm hoặc Nhà sáng tạo trong Cộng tác mục tiêu của mình, trước tiên bạn phải chọn Lời mời Cộng tác Mục tiêu muốn xoá.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/dbb338934a75493a8a896272e15678b9~tplv-nk3i2mqmvs-image.png?x-expires=2017124945&x-signature=0qOyVNibfp%2BFBQtk5ZCSli4gNJ4%3D)\n\nSau khi bấm vào Chi tiết lời mời, bạn có thể chỉnh sửa Nhà sáng tạo và sản phẩm bằng cách nhấp vào nút được đánh dấu bên dưới:\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/8278c1135395458f9acefea45771b8c1~tplv-nk3i2mqmvs-image.png?x-expires=2017124945&x-signature=kPAd0Sou%2FV2VmuzC8%2B4ADif9GKU%3D)\n\nĐiều này sẽ cho phép bạn chỉnh sửa lời mời của mình theo ý muốn. Cuối cùng, hãy nhấp vào nút thùng rác để xóa Nhà sáng tạo hoặc sản phẩm bạn đã chọn. Bạn sẽ nhận được một xác nhận cuối cùng trước khi quá trình xóa hoàn tấtX**áng tạo**\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/9142da2a61da41aeb50964d5c81c4790~tplv-nk3i2mqmvs-image.png?x-expires=2017124943&x-signature=mUJ3foyPzNEwE9zH53MIha7R0mg%3D)\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/460d9bbd3ca64ddbb9c71d851004056d~tplv-nk3i2mqmvs-image.png?x-expires=2017124944&x-signature=CWuuAQKmYSTuDxvA7hPjuPt2cm0%3D)\n\n**Loại bỏ sản phẩm**\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/90a936984e404d2fa1771273d1a3e5bb~tplv-nk3i2mqmvs-image.png?x-expires=2017124942&x-signature=BCE%2BqdL5HseZ5eMFDfPoqbc0Qq4%3D)\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/c88c26373ed448668e7d1ed39109bc27~tplv-nk3i2mqmvs-image.png?x-expires=2017124941&x-signature=xqyj1ZXYlFiz0m14xoiMWRozf6Q%3D)\n\n### Hạn mức lời mời Cộng tác mục tiêu\n\n\u003cmark>Nhà bán hàng có **hạn mức hằng tuần** để liên hệ với nhà sáng tạo thông qua **Cộng tác mục tiêu** và **Tin nhắn của Nhà Sáng Tạo**. Hạn mức này thể hiện số lượng nhà sáng tạo mà nhà bán hàng có thể liên hệ mỗi tuần và chỉ áp dụng cho những nhà sáng tạo mà nhà bán hàng chưa từng liên hệ trước đó.\u003c/mark>\n\n#### Hạn mức hằng tuần hoạt động như thế nào?\n\n\u003cmark>**Lưu ý:** Hạn mức này sẽ chỉ có hiệu lực sau **ngày 12 tháng 10 năm 2026**. Bất kỳ lời mời Cộng tác mục tiêu hoặc tin nhắn nào được gửi trước ngày đó sẽ không bị ảnh hưởng.\u003c/mark>\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/3c833e158767405db8d167bd0ae8f45d~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2107315546&x-signature=neWz6r0B32dUGs526pGr7TIizAI%3D)\n\n\u003cmark>**Lưu ý:** GMV được hiển thị bằng USD. Vui lòng truy cập trang quy định giới hạn hằng tuần của Trung tâm Tiếp thị liên kết để kiểm tra số tiền theo đơn vị tiền tệ địa phương của bạn.\u003c/mark>\n\n- \u003cmark>Hạn mức hằng tuần được xác định dựa trên **GMV của 30 ngày gần nhất** của nhà bán hàng, điều này có nghĩa là nhà bán hàng có thể được mở thêm hạn mức khi GMV tăng lên.\u003c/mark>\n- \u003cmark>Hạn mức được đặt lại **mỗi tuần**. Bất kỳ hạn mức chưa sử dụng nào của tuần hiện tại sẽ **không** được chuyển sang tuần tiếp theo.\u003c/mark>\n    -   **Ví dụ**: Nếu một nhà bán hàng có hạn mức hằng tuần là 100 nhà sáng tạo và chỉ sử dụng 50 trong một tuần, hạn mức sẽ được đặt lại về 100 vào tuần kế tiếp. 50 hạn mức chưa sử dụng sẽ không được cộng dồn.\n- \u003cmark>Những nhà bán hàng có hiệu quả tốt và nằm trong top 20% dựa trên hiệu quả tiếp cận trong 14 ngày có thể được thưởng **hạn mức bổ sung** ngoài hạn mức hằng tuần cơ bản. Hiệu suất được đánh giá **hằng tuần**, dựa trên tỉ lệ nhà bán hàng liên lạc nhà sáng tạo và tạo ra hoạt động hợp tác.\u003c/mark>\n    -   **Ví dụ**: Nếu một nhà bán hàng có hạn mức hằng tuần cơ bản là 300 cho các nhà sáng tạo cấp L3–L4 và đủ điều kiện nhận thưởng, họ có
