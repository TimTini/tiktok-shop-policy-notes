const SECTION_MDS = ["# Tóm tắt từng mục: Chính sách đánh giá hiệu suất của người bán trên TikTok Shop\n\n- Ngày trên bài nguồn: 22/09/2026\n- knowledge_id: 8623594494494465\n- Toàn văn: [toan-van.md](toan-van.md)\n- Nguồn: https://seller-vn.tiktok.com/university/essay?knowledge_id=8623594494494465&role=1&course_type=1&from=search&identity=1&lang=vi-VN\n\nBản tra cứu theo mục. Trong bảng điểm, một số ô là khoảng và một số ô là một mức cố định (1, 2 hoặc 48).\n\n## 1. Tổng quan\n\nChính sách dành cho người bán. Nêu cách TikTok Shop xử lý vi phạm điều khoản, chính sách và cách kháng nghị. Bài không phủ hết mọi tình huống. Người bán phải tự tuân thủ luật và chính sách; chính sách được cập nhật định kỳ.\n\n## 2. Trừ điểm tình trạng tài khoản AHR\n\nMục này dùng chữ trừ điểm. Điểm AHR bị trừ khi vi phạm; số điểm bị trừ theo mức độ nghiêm trọng và tác động. Khi điểm AHR đạt ngưỡng ở mục 5, nền tảng thực hiện hành động thực thi tương ứng. Điểm bị trừ do vi phạm tự xóa sau mỗi 90 ngày, trừ khi cửa hàng đã bị nền tảng đóng, tức AHR = 0. Nền tảng có thể áp dụng hành động khắc phục và kiểm soát khác ngoài việc trừ điểm.\n\n## 3. Hành động thực thi áp dụng với các Tài khoản liên kết\n\nTài khoản liên kết là tài khoản người bán, tài khoản nhà sáng tạo khác, hoặc tài khoản TikTok mà nền tảng xác định hợp lý là có đủ kết nối để chỉ ra mối quan hệ hiện tại giữa các chủ sở hữu. Nếu người bán có tài khoản liên kết và các tài khoản đó vi phạm điều khoản, chính sách hoặc luật hiện hành, nền tảng có thể phạt người bán và các tài khoản liên kết. Mức phạt phụ thuộc mức độ nghiêm trọng của vi phạm. Nền tảng xác định mức độ nghiêm trọng của các hành động thực thi được thực hiện một cách hợp lý, nhưng quyết định thuộc toàn quyền của nền tảng.\n\n## 4. Vi phạm chính sách\n\nBảng là ví dụ các vi phạm có thể làm người bán nhận điểm AHR và chịu hành động thực thi. Trang ghi xem phần 7. Phần 7 trên trang là tạm giữ số dư. Danh sách ví dụ hành động thực thi là mục 6. Hành động thực thi có thể gồm vô hiệu hóa tài khoản. Vi phạm lặp lại có thể bị áp dụng nhiều điểm AHR hơn và xử nghiêm khắc hơn. Nếu nhà sáng tạo liên kết vi phạm nguyên tắc và chính sách trên nền tảng, TikTok Shop có thể phạt chung cửa hàng hoặc tài khoản.\n\n| Nhóm | Vi phạm | Điểm AHR |\n| --- | --- | --- |\n| Chứng nhận | Thiếu chứng nhận | 6–48 |\n| Chứng nhận | Hết hạn | 4–48 |\n| Chứng nhận | Không xác thực | 12–48 |\n| Sở hữu trí tuệ | Vi phạm IP | 1–48 |\n| Sở hữu trí tuệ | Hàng giả | 4–48 |\n| Sở hữu trí tuệ | Hàng nhái | 0–4 |\n| Niêm yết | Sai danh mục; hàng không hỗ trợ; sai nguyên tắc niêm yết | 0–48 |\n| Niêm yết | Niêm yết hoặc vận chuyển hàng bị cấm | 6–48 |\n| Chất lượng | Vi phạm chất lượng sản phẩm (kiểm tra lấy mẫu) | 0–48 |\n| Dịch vụ | Tỷ lệ phản hồi 24 giờ thấp | 1 |\n| Dịch vụ | Giao tiếp không phù hợp hoặc bị cấm | 1–12 |\n| Hoàn thành đơn | Hủy do lỗi người bán (SFCR); gửi hàng muộn (LDR) | 2–4 |\n| Hoàn thành đơn | Tỷ lệ trả hàng/hoàn tiền do lỗi người bán cao | 2 |\n| Hoàn thành đơn | Giao hàng khác biệt lớn so với mô tả (SNAD) | 1–48 |\n| Nội dung | Nội dung không nguyên bản; hoạt động bị luật cấm | 48 |\n| Nội dung | Quảng cáo hàng cấm hoặc không được hỗ trợ | 6–48 |\n| Nội dung | Quảng cáo sản phẩm không nhất quán | 1–48 |\n\n### Buyer PII\n\nNgười bán vi phạm Buyer PII nhận hành động thực thi nặng hơn, gồm tạm ngừng tài khoản và vô hiệu hóa tài khoản vĩnh viễn. PII gồm, nhưng không chỉ: họ tên, điện thoại, email, địa chỉ giao hàng, tên tài khoản mạng xã hội hoặc tên người dùng, thông tin thanh toán, số định danh quốc gia hoặc mã số thuế, và chi tiết đơn mà khi kết hợp với thông tin công khai có thể xác định lại người mua.\n\nBị cấm, nhưng không chỉ: chuyển hướng người mua ra ngoài nền tảng; thu thập PII qua chat, niêm yết, phiếu đóng gói hoặc liên lạc sau mua, trừ khi TikTok Shop cho phép để thực hiện đơn; dùng sai hoặc chia sẻ PII ngoài giao dịch TikTok Shop cụ thể mà thông tin được cung cấp; lưu giữ PII quá nhu cầu thực hiện đơn. Khi giao dịch và thời hạn trả hàng/khiếu nại áp dụng (nếu có) đã hết, phải xóa hoặc ẩn danh PII không chậm trễ.\n\n## 5. Hệ thống Cột mốc thực thi\n\nMục này dùng chữ tích lũy: người bán tích lũy điểm AHR đến ngưỡng, rồi bị hành động thực thi theo số điểm tích lũy. Có thể áp dụng nhiều hành động thực thi, tùy hình thức vi phạm. Nền tảng gửi thông báo cảnh báo chính thức khi điểm AHR còn cách mỗi ngưỡng 5 điểm.\n\n| Điểm | Chế tài |\n| --- | --- |\n| 12 | Không tham gia siêu chiến dịch mới, hoạt động phát triển người dùng, trợ cấp vận chuyển miễn phí do nền tảng tài trợ và lợi ích khác trong 7 ngày theo lịch. Không đăng ký Chương trình liên kết trong 7 ngày theo lịch. |\n| 24 | Hai hạn chế trên trong 14 ngày theo lịch. Tạm ngưng tạo và cập nhật danh sách niêm yết mới trong 14 ngày theo lịch. |\n| 36 | Vô hiệu hóa cửa hàng trong 28 ngày theo lịch. Không tham gia siêu chiến dịch mới, hoạt động phát triển người dùng, trợ cấp vận chuyển miễn phí do nền tảng tài trợ và lợi ích khác trong 42 ngày theo lịch. |\n| 48 | Chấm dứt cửa hàng vĩnh viễn. Có thể bắt đầu hành động pháp lý và/hoặc báo cơ quan quản lý. |\n\n## 6. Hành động thực thi\n\nMục mở bằng câu “bên cạnh các ví dụ trong Phần 6”, rồi nói còn có thể có hành động khác đối với vi phạm chính sách, nguyên tắc hoặc điều khoản dịch vụ. Ví dụ gồm: cảnh báo chính thức; tạm ngưng đặc quyền niêm yết; hủy niêm yết; chặn traffic tới quảng cáo, livestream, video và sản phẩm; gỡ quyền được đề xuất trong Trung tâm mua sắm; giới hạn đơn và số niêm yết; thu hồi quyền lợi tạm thời hoặc vĩnh viễn; tạm ngưng hoặc chấm dứt vĩnh viễn đăng ký bên liên kết và sự kiện khác; thu hồi quyền truy cập tạm thời hoặc vĩnh viễn; giữ toàn bộ số dư tạm thời, hoặc vĩnh viễn nếu nghiêm trọng, và/hoặc hủy mọi giao dịch; hủy hoặc thu hồi khuyến mãi và/hoặc trợ cấp; xóa tài khoản; hành động pháp lý; kéo dài kỳ quyết toán; báo cơ quan quản lý để truy tố; tự duyệt hoàn tiền thay người bán; khấu trừ tiền đến hạn để bồi thường.\n\n## 7. Tạm giữ số dư\n\nNếu có lý do hợp lý cho rằng người bán vi phạm chính sách này, chính sách khác, hoặc Điều khoản dịch vụ đối với người bán, nền tảng có thể tạm giữ khoản phải trả hoặc có thể phải trả, gồm tiền bán hàng (Số dư). Nền tảng toàn quyền quyết định và không cần báo trước; nếu đã áp dụng hạn chế thì có thông báo. Việc giữ Số dư có thể được thực hiện lâu hơn trong trường hợp (a) 180 ngày theo lịch kể từ ngày thông báo tạm ngưng, hoặc (b) hoàn thành điều tra về vi phạm đáng ngờ. Nếu nền tảng xác định hợp lý rằng vi phạm gây tổn thất cho nền tảng, người mua hoặc bên thứ ba, kể cả chi phí điều tra, có thể trừ Số dư để bồi thường, rồi trả phần còn lại. Trang ghi có thể kháng nghị hành động này theo mục 9. Phần kháng nghị trên cùng trang được đánh số mục 8. Kháng nghị thành công thì được trả lại tiền.\n\nVí dụ có thể bị giữ tiền: SNAD, đơn giả hoặc gian lận, truy cập trái phép, tài khoản có số dư âm, lạm dụng trợ cấp nền tảng, không bảo mật tài khoản bằng xác minh 2 bước.\n\n## 8. Kháng nghị\n\nKháng nghị qua chức năng trong thông báo chế tài nếu cho rằng bị xử nhầm. Nền tảng điều tra và khắc phục khi thấy phù hợp. Gửi đơn không bảo đảm được chấp nhận.\n\n### 8.1 Quy trình\n\nTối đa hai kháng nghị cho một hành động thực thi. Lần đầu trong 30 ngày kể từ ngày nhận thông báo. Lần hai trong 15 ngày kể từ ngày lần đầu bị từ chối. Sau các mốc đó, người bán không được nộp thêm; đơn muộn không hợp lệ và không được xét. Điểm AHR phát sinh từ mỗi vi phạm tự xóa sau 90 ngày theo lịch, trừ khi người bán đã tích lũy đủ 48 điểm.\n\n### 8.2 Kết quả\n\nNền tảng đánh giá và báo kết quả, hoặc yêu cầu thêm thông tin; đồng thời thông báo khả năng giải quyết ngoài tòa án. Kháng nghị thành công thì xóa mọi hình phạt đã ban và/hoặc khôi phục mọi đặc quyền đã thu hồi. Sau khi lần hai bị từ chối, quyết định có hiệu lực cuối cùng.\n","# Tóm tắt từng mục: Cộng Tác Tiếp Thị Liên Kết\n\n- Ngày trên bài nguồn: 14/10/2026\n- knowledge_id: 6837788624340738\n- Toàn văn: [toan-van.md](toan-van.md)\n- Nguồn: https://seller-vn.tiktok.com/university/essay?knowledge_id=6837788624340738&role=1&course_type=1&from=search&identity=1&lang=vi-VN\n\nBài hướng dẫn hai cách hợp tác affiliate: **Cộng tác mở** và **Cộng tác mục tiêu**. Phần so sánh và hầu hết thao tác trên màn hình nằm trong ảnh của toàn văn. Một số liên kết sâu trong nguồn trỏ tới `affiliate.tiktok.com` với `shop_region=PH`; liên kết «Thư mời mục tiêu» bị dính hai URL.\n\n## Cộng tác là gì?\n\nẢnh đặt hai câu hỏi. Bên trái: đã có nhà sáng tạo cụ thể muốn quảng bá sản phẩm. Bên phải: chưa nghĩ đến nhà sáng tạo nào, muốn bất kỳ nhà sáng tạo nào quan tâm cũng có thể quảng bá. Chú thích trong bài: trả lời Có ở phía bên trái thì nghiêng về cộng tác mục tiêu; nghiêng về phía bên phải thì nên dùng cộng tác mở.\n\n## Lợi thế của mỗi phương thức hợp tác\n\nẢnh lợi thế: cộng tác mục tiêu để mời nhà sáng tạo do người bán chọn, và chọn người mà người tiêu dùng có thể thấy sản phẩm. Cộng tác mở: mọi nhà sáng tạo đủ điều kiện của TikTok Shop Affiliate đều có thể đăng ký; người bán chọn loại sản phẩm muốn làm nổi bật trong cửa hàng.\n\nNgười bán mới thường bắt đầu bằng cộng tác mở để xem nhà sáng tạo nào chọn sản phẩm và hiệu suất ra sao. Khi đã quen, chuyển sang cộng tác mục tiêu với nhà sáng tạo đã có quan hệ.\n\n## Có thể tìm Cộng tác Affiliate ở đâu\n\nTrên máy tính: Trung tâm nhà bán hàng → **Tiếp thị liên kết** → Trung tâm Affiliate. Menu trái có hai tùy chọn cộng tác.\n\n## Cộng tác mục tiêu\n\nMời đúng nhà sáng tạo. Họ nhận thư trong hộp thư, chấp nhận rồi mới được quảng bá, thêm sản phẩm vào trang trưng bày và tạo nội dung.\n\n### Tạo cộng tác mục tiêu\n\nVào Trung tâm Affiliate → **Cộng tác**.\n\n- **Kết nối nhà sáng tạo:** bấm Mời trên hồ sơ. Có thể thả tim để lưu, rồi mời riêng hoặc mời hàng loạt. Thẻ nhà sáng tạo cho xem hiệu suất và mời từ đó.\n- **Thư mời mục tiêu:** mời một danh sách trong một khoảng thời gian. Bấm **Gửi lời mời**. Bốn bước:\n  1. Tên lời mời, ngày hiệu lực, thông tin liên hệ, nội dung tùy chọn, loại nội dung ưu tiên. Nhà sáng tạo vẫn được đăng loại nội dung khác để nhận hoa hồng.\n  2. Thêm tối đa 100 sản phẩm, đặt hoa hồng từng sản phẩm. Nên kiểm tra tồn kho và dùng mức hoa hồng gợi ý.\n  3. Thiết lập mẫu thử miễn phí. Bài trỏ sang một hướng dẫn riêng.\n  4. Chọn nhà sáng tạo theo tên người dùng hoặc danh sách đã lưu.\n\n### Hiệu suất, góc nhìn nhà sáng tạo, xóa\n\nTheo dõi số người chấp nhận và số người đã đăng. Trong từng lời mời có chi tiết cộng tác, nhà sáng tạo, sản phẩm và video. Nhà sáng tạo thấy lời mời như ảnh trong bài. Muốn xóa sản phẩm hoặc nhà sáng tạo: mở lời mời → chỉnh sửa → thùng rác → xác nhận.\n\n### Hạn mức lời mời\n\nCó hạn mức tuần cho số nhà sáng tạo được liên hệ qua cộng tác mục tiêu và tin nhắn. Phần chữ: chỉ tính người chưa từng liên hệ. Có hiệu lực sau **12/10/2026**; lời mời và tin nhắn trước ngày đó không bị ảnh hưởng.\n\n- Hạn mức theo GMV 30 ngày gần nhất, hiển thị bằng USD; xem số tiền địa phương trong Trung tâm Tiếp thị liên kết.\n- Đặt lại mỗi tuần, phần chưa dùng không cộng sang tuần sau. Ví dụ hạn mức 100, dùng 50, tuần sau vẫn là 100.\n- Top 20% hiệu quả tiếp cận trong 14 ngày có thể được thưởng thêm. Hiệu suất xét lại mỗi tuần. Nếu hiệu suất giảm ở tuần sau, có thể mất phần thưởng. Ví dụ hạn mức cơ bản 300 với nhà sáng tạo L3–L4, thưởng 200 thì tuần sau liên hệ tối đa 500. Ví dụ này khớp hàng $0-$500, cột L3-L4 của bảng tiếng Việt bên dưới.\n\nBảng tiếng Việt, ảnh ngay sau lưu ý ngày hiệu lực. Hạn mức hằng tuần:\n\n| GMV 30 ngày gần nhất | L0-L2 | L3-L4 | L5-L6 | L7-L8 |\n| --- | --- | --- | --- | --- |\n| Nhà bán hàng mới với GMV $0 | 500 nhà sáng tạo (gói khởi đầu một lần), một ô chung mọi cấp | | | |\n| $0-$500 | Không giới hạn | 300 nhà sáng tạo | 100 nhà sáng tạo | 20 nhà sáng tạo |\n| $500-$2,500 | Không giới hạn | 600 nhà sáng tạo | 300 nhà sáng tạo | 80 nhà sáng tạo |\n| $2,500-$10,000 | Không giới hạn | Không giới hạn | 500 nhà sáng tạo | 150 nhà sáng tạo |\n| $10,000+ | Không giới hạn, một ô chung mọi cấp | | | |\n\nThưởng hằng tuần trên cùng ảnh:\n\n| GMV 30 ngày gần nhất | L0-L2 | L3-L4 | L5-L6 | L7-L8 |\n| --- | --- | --- | --- | --- |\n| Nhà bán hàng mới với GMV $0 | một dấu «-» chung mọi cấp | | | |\n| $0-$500 | - | +200 | +200 | +100 |\n| $500-$2,500 | - | +200 | +200 | +100 |\n| $2,500-$10,000 | - | - | +200 | +100 |\n| $10,000+ | một dấu «-» chung mọi cấp | | | |\n\nẢnh chụp trang Weekly limits rule (tiếng Anh), cột thứ tư trong hàng ảnh hướng dẫn xem hạn mức, là một bảng khác. Bậc GMV và nhóm cấp không trùng bảng tiếng Việt. Hạn mức cơ bản theo GMV 30 ngày. Ảnh ghi L0 và L1 luôn không giới hạn.\n\n| GMV trên ảnh | L0-L1 Bronze-Silver | L2 Gold | L3 Platinum | L4-L7 Ruby-Diamond |\n| --- | --- | --- | --- | --- |\n| $0 | Không giới hạn | 200 | 60 | 40 |\n| Up to $12,500 | Không giới hạn | 500 | 200 | 100 |\n| Over $12,500 - up to $25,000 | Không giới hạn | 2500 | 750 | 500 |\n| Over $25,000 - up to $65,000 | Không giới hạn | 3000 | 1000 | 800 |\n| Over $65,000 | Không giới hạn | 7000 | 2500 | 1500 |\n\nThưởng trên ảnh đó: top 20% nhà bán trong cùng bậc GMV, theo hiệu quả tiếp cận 14 ngày; tính lại mỗi Chủ Nhật theo số lời mời hợp lệ dẫn tới bài đăng.\n\n| GMV trên ảnh | L0-L1 | L2 | L3 | L4-L7 |\n| --- | --- | --- | --- | --- |\n| $0 | - | +300 | +100 | +60 |\n| Up to $12,500 | - | +500 | +300 | +200 |\n| Over $12,500 - up to $25,000 | - | nâng thành không giới hạn | +400 | +300 |\n| Over $25,000 - up to $65,000 | - | nâng thành không giới hạn | nâng thành không giới hạn | +400 |\n| Over $65,000 | - | nâng thành không giới hạn | nâng thành không giới hạn | nâng thành không giới hạn |\n\nQuy tắc đọc trên ảnh tiếng Anh này: hạn mức bằng hạn mức cơ bản theo GMV 30 ngày cộng thưởng; cập nhật và đặt lại mỗi Chủ Nhật lúc 12:00 trưa (UTC-8), theo GMV 30 ngày tại lúc đặt lại; suất giới hạn chưa dùng không cộng sang tuần sau. Gửi tin nhắn hoặc lời mời cho nhà sáng tạo chưa kết nối thì tính 1 suất; cùng tuần, vừa mời vừa nhắn tiếp cho cùng một người thì vẫn 1 suất. Ảnh này áp dụng cho người chưa được liên hệ và người không trả lời tin nhắn hoặc lời mời. Không tính người đã kết nối: đã nhắn cho nhà bán, đã trả lời tin nhắn hoặc lời mời, hoặc đã thêm sản phẩm vào trang trưng bày hoặc video.\n\nPopup trên ảnh Tìm nhà sáng tạo là số suất còn lại của một ví dụ, không phải bảng bậc: Lv. 0–Lv. 1 không giới hạn, Lv. 2 còn 160, Lv. 3 còn 100, Lv. 4–Lv. 7 còn 80. Dòng chữ trên popup: hạn mức với nhà sáng tạo chưa kết nối, đặt lại mỗi tuần, theo GMV 30 ngày từ hợp tác với nhà sáng tạo. Hai ảnh bảng điều khiển còn lại là ví dụ số dư.\n\n## Cộng tác mở\n\nSản phẩm có sẵn để nhà sáng tạo tự tìm và đăng ký bán. Hoa hồng theo phần trăm người bán đặt cho mỗi đơn từ nội dung hoặc trang trưng bày.\n\n### Tạo và thêm sản phẩm\n\nCộng tác → Cộng tác mở. Hai tab: sản phẩm đã thêm vào affiliate và sản phẩm chưa thêm. Thêm từng món hoặc **Thêm hàng loạt vào affiliate**. Có bài hướng dẫn riêng cho thêm hàng loạt.\n\nKhi thêm, đặt tỷ lệ hoa hồng (có gợi ý, người bán quyết định) và có thể bật mẫu miễn phí cho video hoặc LIVE.\n\n### Lọc yêu cầu mẫu\n\nLọc theo nhà sáng tạo (danh mục có doanh thu hoặc quảng bá 30 ngày, hoặc đã thêm vào trang trưng bày 90 ngày; số follower; Video, LIVE hoặc cả hai trong 30 ngày; thuộc công ty hay độc lập; đã từng hợp tác), theo người theo dõi (tuổi, giới tính và tỷ lệ), theo hiệu suất 30 ngày (GMV, lượt xem video, người xem LIVE; có thể chỉ tính nội dung affiliate), và theo yêu cầu mẫu (hạn, tự từ chối sau 30 ngày nếu không chọn, top 20% nhà sáng tạo đáng tin theo tỷ lệ nhận mẫu rồi đăng nội dung).\n\n### Tự thêm sản phẩm mới và xóa\n\nSản phẩm trong kế hoạch cửa hàng tự vào cộng tác mở. Có thể bật chế độ tự động cho sản phẩm mới với một tỷ lệ hoa hồng chung, hoặc tắt để thêm tay. Xóa bằng cách chọn sản phẩm rồi **Xóa hàng loạt**.\n\n### Hiệu suất và gỡ nhà sáng tạo\n\nTrên danh sách có thể sửa hoa hồng, bật mẫu miễn phí hàng loạt, hủy kích hoạt. Từng dòng hiện giá, tồn kho, tỷ lệ và số tiền hoa hồng ước tính, mẫu miễn phí, số nhà sáng tạo đã thêm, số đã đăng, trạng thái. Cột nhà sáng tạo đã thêm mở ra video và LIVE. Muốn gỡ khỏi trang trưng bày: kéo sang phải tới cột trang trưng bày → mở số lượng → thùng rác → xác nhận. Có ô tìm nhà sáng tạo.\n\n## Câu hỏi thường gặp\n\n- Được dùng cả hai kiểu cùng lúc. Bài khuyên người mới bắt đầu bằng cộng tác mở.\n- Sản phẩm nằm ở cả hai kiểu: nhà sáng tạo nhận hoa hồng của cộng tác mục tiêu.\n- Hạ hoa hồng mở từ 15% xuống 12%: nhà sáng tạo đã có sản phẩm trong nội dung hoặc khuyến mãi từ trước khi đổi giữ 15% trong 30 ngày, sau đó nhận 12%. Người thêm sản phẩm sau khi đổi nhận 12%.\n- Lưu tối đa 1.000 nhà sáng tạo.\n- FAQ: tối đa 1.000 lượt cộng tác trong 24 giờ. Mức này đứng riêng. Hạn mức tuần ở trên có hiệu lực sau ngày 12/10/2026.\n- Tối đa 50 nhà sáng tạo và 100 sản phẩm mỗi lời mời mục tiêu.\n- Nhà sáng tạo tự nhận lời mời sau khi gửi. Có thể chia sẻ lại liên kết lời mời.\n- Sửa được lời mời đã gửi: thêm hoặc xóa người và sản phẩm, đổi hoa hồng và nội dung. Nếu nhà sáng tạo đang quảng bá, thay đổi áp dụng từ ngày hôm sau.\n","# Tóm tắt từng mục: Nguyên tắc đăng bán sản phẩm có thương hiệu\n\n- Ngày trên bài nguồn: 22/09/2026\n- knowledge_id: 8064144491513601\n- Toàn văn: [toan-van.md](toan-van.md)\n- Nguồn: https://seller-vn.tiktok.com/university/essay?knowledge_id=8064144491513601&role=1&course_type=1&from=search&identity=1&lang=vi-VN\n\n## Sản phẩm có thương hiệu là gì?\n\nSản phẩm mang thương hiệu có thể được bảo hộ sở hữu trí tuệ. Với một số sản phẩm, người bán có thể phải xin chứng nhận thương hiệu trước khi đăng. Niêm yết còn phải theo các nguyên tắc đăng bán khác trong Trung tâm chính sách.\n\n## Có thương hiệu và không có thương hiệu\n\nHàng có thương hiệu phải hiển thị rõ thông tin thương hiệu, và nội dung đăng phải cho người mua nhận ra sản phẩm có thương hiệu. Tiêu đề, ảnh, mô tả, thông tin SKU và các thuộc tính khác nên nêu thương hiệu của sản phẩm đang bán khi có thể, và phải nhất quán với trường «Thương hiệu». Không cố gắng che giấu hoặc giữ lại thông tin thương hiệu; nếu không, có thể vi phạm gian lận thương hiệu.\n\nHàng không thương hiệu không được khiến khách hiểu nhầm là hàng có thương hiệu, và nội dung đăng phải nói rõ sản phẩm không có thương hiệu. Thuộc tính không nên nêu bất kỳ thương hiệu nào, trừ thương hiệu của sản phẩm tương thích. Nếu sản phẩm thực sự có thương hiệu, không cố gắng che giấu hoặc giữ lại thông tin thương hiệu; bài bảo xem lại hướng dẫn ở phần trên.\n\n## Nguyên tắc đăng bán\n\n- **Ảnh:** nên dùng một vài ảnh do người bán sở hữu hoặc được phép dùng. Ít nhất một ảnh phải phản ánh thương hiệu. Không được dùng phương tiện số hoặc vật lý, kể cả nhãn dán, vết ố, giấy tờ, văn bản, hoạ tiết khảm hoặc băng dính, để che hoặc ẩn thông tin thương hiệu khiến không xác định được thương hiệu. Làm vậy có thể bị tính là gian lận thương hiệu. Ảnh minh họa, bằng tiếng Anh, khuyến nghị ít nhất 5 ảnh để thể hiện đủ sản phẩm, và ghi giới hạn tải lên 600×600 px, tối đa 5 MB, tối đa 9 tệp, JPG, JPEG hoặc PNG.\n- **Tên:** phải nêu thương hiệu chính, không phải mẫu hay biến thể, rồi đến thông tin mẫu. Cột NÊN: «OPPO Reno11 Pro 5G», «Samsung Galaxy A55 5G». Cột KHÔNG NÊN: «Reno11 Pro 5G», «Galaxy A55 5G». Không được nêu thương hiệu khác trong nội dung đăng nếu chưa được cho phép. Ảnh ô tên ghi độ dài đề xuất từ 40 ký tự và khung gợi ý bắt đầu bằng [Thương hiệu]; ảnh cũng nói danh mục sẽ được tự động xác định theo tên sản phẩm.\n- **Danh mục:** chọn danh mục phù hợp. Sản phẩm cũ hoặc đã qua sử dụng đăng ở danh mục phù hợp. Bài trỏ tới nguyên tắc đăng bán sản phẩm tân trang lại/đã qua sử dụng. Ảnh danh mục nói tin bị chia sai danh mục, bị cấm hoặc bị hạn chế có thể bị xóa, và tài khoản nhà bán cũng có thể bị ảnh hưởng.\n- **Trường Thương hiệu:** với hàng có thương hiệu, chọn đúng mục trong danh sách thả xuống. Một số thương hiệu chuyển xám vì phải xin chứng nhận trước. Hàng không thương hiệu chọn «Không có thương hiệu». Đã được cấp chứng nhận thì chọn thương hiệu có thẻ xanh lá «Đã chứng nhận» cho mọi niêm yết của thương hiệu đó. Nếu chứng nhận mới được cấp sau khi đã đăng bán, cập nhật mọi niêm yết thuộc thương hiệu đó theo hướng dẫn trên. Ảnh trường này nói sản phẩm có ủy quyền thương hiệu có nhiều khả năng được đề xuất trên TikTok Shop hơn, và bảo đăng ký ủy quyền nếu sản phẩm đủ điều kiện; nếu không thấy thương hiệu, ảnh cho «Thêm thương hiệu mới» hoặc «Không có thương hiệu».\n- **Mô tả:** có thể thêm thông số hoặc thông tin thương hiệu. Không được nêu thương hiệu khác nếu chưa được phép. Ảnh trong mục này không được che hoặc ẩn thông tin thương hiệu. Lưu ý trên bài: chỉ nên trình bày thông tin thương hiệu ở phần mô tả, và việc đưa thông tin thương hiệu vào nơi khác được xem là không đầy đủ; cùng lưu ý đó vẫn phải tuân thủ yêu cầu tiêu đề và hình ảnh nêu trên.\n\n## Cập nhật bao bì\n\nNếu thiết kế bao bì đã được cập nhật hoặc đổi, nên cập nhật ảnh chính cho đúng sản phẩm khách sẽ nhận, và nên bổ sung ảnh so sánh thiết kế cũ với thiết kế mới. Ảnh so sánh ghi «Ví dụ tốt», với các câu như «Bao bì được cập nhật», «DIỆN MẠO MỚI!» và «Vẻ ngoài mới, chất lượng không đổi». Tiêu đề có thể thêm ghi chú ngắn như «Bao bì mới» hoặc «Thiết kế bao bì mới được cập nhật».\n\nMục mô tả có một danh sách riêng, đứng trước câu về bao bì cũ, gồm ba câu: «Chỉ thiết kế mới này là chính hãng 100%», «Bao bì cũ đã ngừng sản xuất. Chỉ có phiên bản mới này là hàng thật», «Không có nhãn dán ảnh ba chiều = Không phải hàng chính hãng!». Danh sách sau đó cho phép nêu tính năng xác minh mới (mã QR, ảnh ba chiều, nhãn bảo mật), rồi đến câu tránh tuyên bố không đúng sự thật, gây hiểu nhầm hoặc ngụ ý sai rằng thiết kế bao bì cũ là hàng giả, «chẳng hạn như». Danh sách lồng trong «chẳng hạn như» đang trống.\n\n## Hạn chế một số thương hiệu\n\nVới người bán cá nhân, nền tảng có thể hạn chế khả năng bán một số thương hiệu. Khi cố đăng các thương hiệu bị hạn chế, người bán sẽ được thông báo lúc đăng sản phẩm. Muốn đăng thì đăng ký tài khoản người bán doanh nghiệp và gửi tài liệu Chứng nhận thương hiệu để chứng minh được phép bán các thương hiệu đó. Nền tảng có toàn quyền cấm đăng bán và bán sản phẩm từ các thương hiệu cụ thể vì có khả năng gây trải nghiệm tiêu cực cho khách hàng.\n\n## Vi phạm\n\nNếu bị phát hiện vi phạm, tài khoản có thể bị thi hành chế tài. Vi phạm lặp lại sẽ dẫn đến hình phạt nghiêm trọng hơn. Bài trỏ tới «Lý do vi phạm, Điểm vi phạm & Biện pháp thi hành chế tài áp dụng với người bán», Điều khoản dịch vụ dành cho người bán và Nguyên tắc kháng nghị dành cho người bán. Kháng nghị gửi qua Trung tâm Nhà bán hàng.\n","# Tóm tắt từng mục: Cách đăng ký Chứng nhận thương hiệu\n\n- Ngày trên bài nguồn: 23/09/2026\n- knowledge_id: 5407666547115796\n- Toàn văn: [toan-van.md](toan-van.md)\n- Nguồn: https://seller-vn.tiktok.com/university/essay?knowledge_id=5407666547115796&role=1&course_type=1&from=search&identity=1&lang=vi-VN\n\n## Chứng nhận thương hiệu là gì?\n\nChứng nhận dùng để xác nhận hàng có thương hiệu là hàng chính hãng và được phép bán. Áp dụng cho chủ nhãn, người được ủy quyền hoặc người có chứng từ mua hàng. Chứng nhận không miễn trách nhiệm nếu vẫn vi phạm sở hữu trí tuệ.\n\n## Các loại chứng nhận\n\n- Chủ sở hữu nhãn hiệu.\n- Cấp 1 độc quyền toàn quốc: chủ nhãn cấp quyền phân phối độc quyền.\n- Cấp 1: chủ nhãn ủy quyền trực tiếp.\n- Cấp 2: được cấp 1 ủy quyền.\n- Cấp 3: được cấp 2 ủy quyền.\n- Bằng chứng mua hàng: chỉ một số người bán, có hóa đơn hoặc biên lai mua trực tiếp từ chủ nhãn hoặc người bán được ủy quyền.\n\nNgười bán cá nhân có thể không được bán một số nhãn. Muốn bán thì cần tài khoản doanh nghiệp và chứng nhận được duyệt.\n\n## Giấy tờ\n\nThư ủy quyền hoặc thư phân phối dùng chung các điều kiện: gửi đúng tên công ty hoặc cá nhân trong Hồ sơ người bán > Thông tin doanh nghiệp, đúng tên thương hiệu đang đăng ký, có thời hạn, có chữ ký hoặc lời chứng thực kèm họ tên và chức vụ, và phải là bản thật.\n\n- **Chủ nhãn:** giấy chứng nhận nhãn hiệu. Chỉ một tài khoản người bán được đăng ký làm chủ sở hữu.\n- **Cấp 1 độc quyền toàn quốc:** thư do chủ nhãn cấp trực tiếp và có điều khoản phân phối độc quyền.\n- **Cấp 1:** thư do chủ nhãn cấp trực tiếp.\n- **Cấp 2:** thư do cấp 1 cấp trực tiếp, kèm giấy chứng minh bên đó được chủ thương hiệu cho phép ủy quyền tiếp. Không bắt buộc: thư ủy quyền hoặc thư phân phối do chủ nhãn cấp trực tiếp cho cấp 1.\n- **Cấp 3:** thư do cấp 2 cấp trực tiếp, kèm giấy chứng minh bên đó được chủ thương hiệu cho phép ủy quyền tiếp. Không bắt buộc: thư ủy quyền hoặc thư phân phối do chủ nhãn cấp trực tiếp cho cấp 1.\n- **Bằng chứng mua hàng:** hóa đơn hoặc biên lai trong 12 tháng, có ngày mua, nhà cung cấp, người mua, thương hiệu sản phẩm, chi tiết sản phẩm, số lượng và giá. Nếu không thể tiết lộ giá vì hợp đồng bảo mật thì nộp kèm bản sao hợp đồng đó. Nếu bằng chứng mua hàng không do chủ sở hữu thương hiệu cấp, cần giấy tờ hoặc ảnh chụp màn hình từ trang web chính thức, kèm URL, chứng minh nhà cung cấp là nhà phân phối được ủy quyền. Ảnh hàng tồn kho và ảnh sản phẩm thực tế (gồm cả bao bì) từ 6 góc là tài liệu bổ sung cần gửi.\n\n## Cách nộp\n\nTài khoản của tôi → Cài đặt tài khoản → Trung tâm chứng nhận → Chứng nhận thương hiệu → Thêm chứng nhận thương hiệu.\n\n1. Chọn loại chứng nhận.\n2. Điền các trường bắt buộc.\n3. Người không phải chủ nhãn chọn trạng thái ủy quyền: có văn bản ủy quyền; được ủy quyền bằng cách khác; hoặc chưa được ủy quyền thì chưa nộp, xin ủy quyền trước.\n4. Tải giấy tờ đúng loại. Hồ sơ có thể được chia cho chủ quyền hoặc nhà cung cấp được chứng nhận để xác minh. Cấm giấy sửa hoặc giả.\n5. Theo dõi trong trung tâm chứng nhận. Xử lý có thể tới 7 ngày dương lịch. Bị từ chối thì được nộp lại.\n\n## Khai thông tin\n\n- Tên nhãn hiệu nhập đúng bản đăng ký, gồm số, chữ và ký tự. Nhãn chỉ là logo thì nhập tên thương hiệu.\n- Số đăng ký lấy trên giấy chứng nhận, không lấy mã hồ sơ.\n- Tên thương hiệu đúng chính tả và kiểu chữ chính thức, khớp website, nhãn đã đăng ký hoặc bao bì. Dài 2–30 ký tự chữ và số, mọi ngôn ngữ. Cấm ®, ™, ©, siêu liên kết hoặc tên miền, email, câu quảng cáo, chuỗi chỉ gồm ký tự đặc biệt, hoặc chuỗi số dài hơn 5 chữ số liên tiếp. Phải có ít nhất một ký tự chữ và số. Ví dụ được phép: su:m37°, 7-Eleven, & Other Stories.\n- Danh mục theo phân loại Nice, cấp 1–35.\n\n## FAQ\n\nTra nhãn trên cơ sở dữ liệu WIPO theo tên, chủ sở hữu hoặc số đăng ký; lọc trạng thái đã đăng ký, quốc gia đích đến và phân loại Nice. Tên thương hiệu đã duyệt không sửa được. Hồ sơ bị từ chối khi thông tin hoặc giấy tờ không đạt yêu cầu; bài trỏ sang một hướng dẫn riêng về lý do từ chối.\n","# Tóm tắt từng mục: Tính năng Người bán tự vận chuyển (SOF)\n\n- Ngày trên bài nguồn: 10/06/2025\n- knowledge_id: 7575204750444289\n- Toàn văn: [toan-van.md](toan-van.md)\n- Nguồn: https://seller-vn.tiktok.com/university/essay?knowledge_id=7575204750444289&role=1&course_type=1&from=search&identity=1&lang=vi-VN\n\nSOF là tự giao hàng bằng đội của người bán. Ảnh thao tác nằm trong toàn văn. Hai liên kết điều khoản và hướng dẫn trả hàng trong bài trỏ tới `seller-id.tiktok.com`.\n\n## SOF là gì?\n\nSo với vận chuyển của TikTok Shop: người bán tự sắp xe, tự nhập mã theo dõi, không in nhãn qua TikTok, người mua không thấy hành trình chi tiết, tự cập nhật đã giao và tải POD, tự tính phí theo mẫu, và không hỗ trợ COD.\n\n## Điều kiện\n\nDành cho người bán được chọn, khi có lý do phù hợp: hàng cần lắp đặt; hàng nhạy nhiệt như hoa, sô-cô-la, rau củ; hàng nguy hiểm như pin, bật lửa; hàng cồng kềnh hoặc nặng. Không thuộc các nhóm này thì dùng vận chuyển của nền tảng.\n\nShop được dùng SOF phải giữ sản lượng đơn SOF ổn định, đánh giá vận chuyển thấp, tỷ lệ trả hàng do lỗi người bán và tranh chấp SOF thấp, và có bảng kê nhận hàng cùng POD khi có tranh chấp. Không đạt thì SOF có thể bị gỡ. Đánh giá vào thứ Hai đầu tháng, trên đơn SOF của tháng trước. Bị gắn cờ hai kỳ liên tiếp thì bị thu hồi.\n\n## Trách nhiệm\n\n- Không gộp sai cách giao trong cùng đơn: món nào cấu hình vận chuyển nền tảng thì giao theo nền tảng, món SOF thì giao SOF.\n- Hàng cấu hình COD không được giao SOF.\n- Nhập đúng mã theo dõi và trạng thái, không chậm.\n- Chỉ chuyển từ «Đã vận chuyển» sang «Đã giao» hoặc «Giao hàng thất bại» sau 24 giờ.\n- Giữ POD ít nhất một năm và xuất trình khi TikTok Shop yêu cầu.\n- Nên thử giao ít nhất hai lần trước khi đánh dấu thất bại.\n- Chưa có trạng thái «Đã giao» thì không được thanh toán. Điều khoản thanh toán của SOF không đổi so với quy định chung.\n- Trả hàng sau giao: người bán thu gom trong 48 giờ; yêu cầu hoàn tiền tự được duyệt. Phí vận chuyển và chi phí liên quan do người bán hoặc khách chịu theo thỏa thuận.\n- Vi phạm điều khoản hoặc các trường hợp ở phần trách nhiệm có thể bị thu hồi SOF.\n- TikTok Shop không chịu trách nhiệm nếu hàng vẫn được giao sau khi đơn đã «Đã hủy».\n- Chưa chuyển sang «Đã giao» thì đơn bị hủy vào ngày thứ 13 kể từ ngày thanh toán.\n\n## Cách làm\n\n1. Sau khi shop được bật SOF, bật «Giao hàng bởi người bán» trong Tùy chọn vận chuyển.\n2. Tạo mẫu phí: chọn vùng không giao được, vùng giao được, rồi nhập khoảng trọng lượng và phí. Tối thiểu phải có bậc 0–30 kg; không giới hạn trần trọng lượng. Đơn nặng hơn trần thì khách trả phí theo mức trần. Vùng chưa chọn có thể chuyển sang vùng loại trừ hoặc vùng giao. Gửi và xác nhận để lưu.\n3. Sản phẩm đang theo cài đặt vận chuyển của shop sẽ có SOF. Muốn một sản phẩm chỉ giao SOF thì sửa tùy chọn giao hàng trên trang sản phẩm thành chỉ «do người bán vận chuyển».\n4. Lọc đơn «do người bán vận chuyển» → «Đánh dấu là đã vận chuyển» → nhập ID theo dõi, kiểm tra hóa đơn, xác nhận kiện. Sau khi đã vận chuyển, sửa mã theo dõi trong 36 giờ. Sau 24 giờ mới được «Cập nhật trạng thái giao hàng», chọn kết quả và tải bảng kê cùng POD. Xác nhận thì đơn thành «đã giao». Chọn «Giao hàng thất bại» và lý do thì đơn thành «Đã hủy».\n5. Giao hàng loạt: chọn các kiện SOF, tải mẫu, điền nhà vận chuyển, ID theo dõi và số hóa đơn, rồi tải kết quả giao lên. Tab cập nhật trạng thái chỉ dành cho đơn SOF.\n\n## Phía người mua\n\nLúc xem và mua, vận chuyển hiện «do người bán vận chuyển». Sau khi người bán xử lý đơn, chi tiết theo dõi chỉ có «đã có thể vận chuyển» và «đã giao».\n","# Tóm tắt từng mục: Sản phẩm dành cho Nhà bán hàng được mời\n\n- Ngày trên bài nguồn: 04/08/2026\n- knowledge_id: 7179954358519569\n- Toàn văn: [toan-van.md](toan-van.md)\n- Nguồn: https://seller-vn.tiktok.com/university/essay?knowledge_id=7179954358519569&role=1&course_type=1&from=search&identity=1&lang=vi-VN\n\nHàng «chỉ dành cho nhà bán hàng được mời» chỉ bán được sau khi được nhận vào chương trình và nộp hồ sơ tại Tài khoản của tôi → Cài đặt tài khoản → Trung tâm chứng nhận. Vi phạm có thể bị chế tài, tái phạm nặng hơn; kháng nghị trong Trung tâm người bán. Bài cũng trỏ tới nguyên tắc sản phẩm bị hạn chế và không được hỗ trợ.\n\n## Sách, báo và tạp chí\n\nNguồn đặt hai danh sách trước hai câu giới hạn. Danh sách dài gồm Nghệ thuật, sách sơ sinh, tiểu sử, lịch, sách nấu ăn, truyện tranh, từ điển, giáo dục, giải trí, viễn tưởng, thể dục thể thao, lịch sử, luật, đời sống, văn học, y tế, sách cha mẹ, chuyên ngành, công nghệ, sách thanh thiếu niên, sách giáo khoa, sách trẻ tập đi, du lịch, phát triển bản thân, khoa học viễn tưởng, thể thao, xã hội, nghiên cứu và khoa học. Danh sách ngắn gồm Kinh doanh, Thời trang, Phong cách sống và Thanh thiếu niên.\n\nSau đó bài nói chỉ được đăng ký các danh mục sách đã liệt kê, và chỉ được đăng ký các danh mục báo, tạp chí đã liệt kê. Hai danh sách con nằm trong hai câu này đang trống, nên nguồn không gắn từng danh sách vào từng câu.\n\n## Kính áp tròng\n\nCần tuyên bố đủ điều kiện bán trang thiết bị y tế, công bố chứng nhận trang thiết bị y tế, và kết quả phân loại trang thiết bị y tế.\n\n## Hoa tươi\n\nChỉ bán nếu giao bằng «Người bán tự vận chuyển bằng phương tiện riêng».\n\n## Thực phẩm tươi và đông lạnh\n\nBán được sau khi nộp hồ sơ trong Trung tâm chứng nhận. Gồm kem, không giới hạn ở kem dùng để làm bánh, kem tươi, kem sữa béo, kem chua, kem bông tuyết, kem nấu và kem loãng. Các thực phẩm tươi và đông lạnh khác không giới hạn ở bánh mì, bánh ngọt và bánh nướng, trứng, thực phẩm đông lạnh, trái cây, kem, đồ ăn sơ chế sẵn, thịt, nấm, bánh bột nhào, thịt và hải sản đã qua chế biến, đậu phụ, rau và các sản phẩm chay thay thế thịt. Cần ít nhất một giấy: Giấy Chứng Nhận Cơ Sở Đủ Điều Kiện An Toàn Thực Phẩm, hoặc giấy chứng nhận OCOP từ 3 sao trở lên, hoặc giấy chứng nhận đạt tiêu chuẩn Vietgap, hoặc bản cam kết sản xuất, kinh doanh thực phẩm (nông lâm thủy sản) an toàn, hoặc giấy chứng nhận HACCP, hoặc giấy chứng nhận ISO 22000.\n\n## Đồ trang sức và phụ kiện\n\nÁp dụng cho trang sức hoặc phụ kiện có đá quý (như hồng ngọc, ngọc bích, ngọc lục bảo) hoặc kim loại quý (như vàng, bạc, bạch kim, palađi). Cần giấy phép kinh doanh thể hiện đủ điều kiện kinh doanh trang sức; giấy chứng nhận hoặc báo cáo thử nghiệm hiện hành, trang liệt kê báo cáo xác định đá quý, báo cáo trang sức, báo cáo chứng nhận vàng; và ảnh sản phẩm kèm giấy chứng nhận hoặc báo cáo.\n\n## Sản phẩm đa phương tiện\n\nChỉ hàng vật lý: băng cassette, đĩa CD & DVD, đĩa than.\n\n## Thẻ SIM\n\nMọi loại thẻ SIM di động. Cần giấy phép kinh doanh và thỏa thuận phân phối với nhà cung cấp dịch vụ có liên quan: giấy phép cung cấp dịch vụ viễn thông, hoặc hợp đồng phân phối cấp 1, hoặc thỏa thuận phân phối ủy quyền cho các sản phẩm và dịch vụ viễn thông.\n\n## Xe máy\n\nCần giấy phép kinh doanh. Khi đăng bán phải điền các thuộc tính bắt buộc.\n\n## Hàng cũ\n\nChỉ tài khoản được quản lý. Đăng ký bằng cách gửi hồ sơ cho người quản lý tài khoản. Nhóm được nêu: điện thoại, máy tính bảng, máy tính xách tay, máy tính để bàn, túi xách và phụ kiện.\n\n## Mẹ và bé\n\nVitamin và thực phẩm bổ sung cần đăng ký công bố sản phẩm, xác nhận tiếp nhận đăng ký công bố sản phẩm, xác nhận chứng nhận hợp quy đối với quy định an toàn thực phẩm, và ảnh sản phẩm. Sữa công thức cho trẻ sơ sinh không được quảng cáo trên TikTok Shop, không giới hạn ở giảm giá, voucher và flash sale.\n\n## Pin\n\nPhải bật «Người bán tự vận chuyển» trước khi đăng ký chứng nhận ngành hàng. Không cần hồ sơ thêm. Ba đường dẫn: Ô tô & Xe máy > Phụ tùng xe máy > Pin & Phụ kiện; Ô tô & Xe máy > Phụ tùng thay thế ô tô > Pin & Phụ kiện; Công cụ & Phần cứng > Công cụ điện > Phụ kiện công cụ điện.\n\n## Sức khỏe tình dục\n\nMở cho nhà bán được mời, gồm chất bôi trơn, bao cao su và thực phẩm bổ sung tăng cường sinh lý. Cả ba áp dụng cho người bán doanh nghiệp và cần ảnh chụp màn hình sản phẩm đã bán trên sàn khác. Bôi trơn và bao cao su cần nhãn có số lưu hành (SLH). Thực phẩm bổ sung cần nhãn có số đăng ký sản phẩm (DKSP).\n\n## Voucher vật lý\n\nChỉ người bán doanh nghiệp được mời. Các loại: voucher chụp ảnh, voucher tín dụng, voucher khách sạn, thẻ quà tặng, voucher du lịch, voucher data, voucher quà tặng, voucher đại lý du lịch. Cần hình ảnh minh chứng sản phẩm đang được bán trên sàn khác. Niêm yết phải ghi thời hạn hiệu lực và điều kiện sử dụng. Cấm tuyên bố gây hiểu nhầm như «sử dụng không giới hạn» hoặc nội dung có ý nghĩa tương tự.\n"];
const SOURCES = ["# Chính sách đánh giá hiệu suất của người bán trên TikTok Shop\n\n- Ngày trên bài nguồn: 22/09/2026\n- knowledge_id: 8623594494494465\n- Nguồn: https://seller-vn.tiktok.com/university/essay?knowledge_id=8623594494494465&role=1&course_type=1&from=search&identity=1&lang=vi-VN\n\n## 1. Tổng quan\n\n- Đây là **Chính sách** **đánh giá hiệu suất của người bán** (sau đây gọi là \"**Chính sách này**\"). Chính sách này trình bày chi tiết hành động thực thi mà TikTok Shop (sau đây gọi là \"**Nền tảng**\") sẽ áp dụng đối với những Người bán vi phạm Điều khoản và Chính sách của Nền tảng, cũng như cách thức Người bán có thể kháng nghị hành động thực thi đó.\n- Nền tảng có thể áp dụng hành động thực thi theo quy định trong Chính sách này, bất kỳ Chính sách nào khác của Nền tảng và **Điều khoản sử dụng của người bán**.\n- Chính sách này chỉ áp dụng với **Người bán**.\n- Chính sách này chưa bao quát tất cả các trường hợp. Người bán hoàn toàn chịu trách nhiệm đảm bảo rằng họ không tham gia vào bất kỳ hành vi nào mà Chính sách này nghiêm cấm. Đồng thời, họ phải tuân thủ các luật lệ và quy định hiện hành, cũng như tất cả các Điều khoản và Chính sách của Nền tảng.\n- Người bán có thể cần tìm kiếm tư vấn pháp lý độc lập nếu họ có thắc mắc về luật pháp và quy định liên quan đến hoạt động của mình.\n- Chính sách của chúng tôi được cập nhật định kỳ. Thông thường, chúng tôi sẽ thông báo trước cho bạn về tất cả những thay đổi đối với Chính sách này. Vui lòng đọc **Điều khoản sử dụng của người bán** để nắm được thông tin chi tiết về cách thức chúng tôi có thể thực hiện các thay đổi đối với điều khoản và chính sách của mình. Người bán có trách nhiệm thường xuyên xem trang này để đảm bảo rằng họ tuân thủ Chính sách của chúng tôi.\n\n## 2. Trừ điểm tình trạng tài khoản AHR\n\nĐiểm tình trạng tài khoản (AHR) bị trừ theo cách thức như sau:\n\n- Điểm tình trạng tài khoản (AHR) bị trừ khi vi phạm các chính sách của chúng tôi.\n- Số điểm AHR bị trừ tương ứng với mức độ nghiêm trọng và tác động của các vi phạm chính sách.\n- Khi điểm tình trạng tài khoản (AHR) của Người bán đạt đến các ngưỡng được quy định trong Mục 5 dưới đây, Nền tảng sẽ thực hiện hành động thực thi tương ứng.\n- Điểm tình trạng tài khoản (AHR) bị trừ do vi phạm sẽ được tự động xóa sau mỗi **90** ngày trừ khi cửa hàng của Người bán đã bị nền tảng đóng, tức là Điểm tình trạng tài khoản (AHR) = 0.\n- Nền tảng có thể thực hiện bất kỳ hành động khắc phục và kiểm soát bổ sung cần thiết nào ngoài việc trừ điểm AHR.\n\n## 3. Hành động thực thi áp dụng với các Tài khoản liên kết\n\n- **Tài khoản liên kết** tức là tài khoản của Người bán, tài khoản của Nhà sáng tạo khác hoặc bất kỳ loại tài khoản nào trên nền tảng TikTok mà Nền tảng xác định một cách hợp lý rằng tài khoản đó có đủ kết nối để chỉ ra mối quan hệ hiện tại giữa chủ sở hữu của các tài khoản có liên quan.\n- Nếu Nền tảng phát hiện ra rằng tài khoản của Người bán có (các) Tài khoản liên kết và các tài khoản đó đã vi phạm Điều khoản và Chính sách của chúng tôi hoặc bất kỳ luật hiện hành nào, chúng tôi có thể triển khai hành động thực thi đối với Người bán và (các) Tài khoản liên kết.\n- (Các) hành động thực thi áp dụng đối với Tài khoản liên kết sẽ phụ thuộc vào mức độ nghiêm trọng của hành động vi phạm. Nền tảng sẽ xác định mức độ nghiêm trọng của tất cả các hành động thực thi được thực hiện một cách hợp lý, nhưng sẽ tuân theo toàn quyền quyết định của Nền tảng.\n\n## 4. Vi phạm chính sách\n\nBảng sau đây trình bày danh sách một số hành động vi phạm chính sách có thể khiến người bán nhận được điểm AHR và phải chịu các hành động thực thi (xem phần 7), có thể bao gồm cả hình phạt vô hiệu hóa tài khoản. Chúng tôi có thể áp dụng nhiều điểm AHR hơn và triển khai các hành động thực thi nghiêm khắc hơn đối với những vi phạm lặp lại.\n\n| Lý do vi phạm | Điểm AHR |\n| --- | --- |\n| **Chứng nhận người bán và sản phẩm** |  |\n| Thiếu chứng nhận | 6-48 |\n| Chứng nhận hết hạn | 4-48 |\n| Chứng nhận không xác thực | 12-48 |\n| **Quyền sở hữu trí tuệ** |  |\n| Vi phạm quyền sở hữu trí tuệ (IP) | 1-48 |\n| Hàng giả | 4-48 |\n| Hàng nhái | 0-4 |\n| **Niêm yết sản phẩm** |  |\n| Danh mục không phù hợp | 0-48 |\n| Niêm yết hoặc vận chuyển sản phẩm bị cấm | 6-48 |\n| Niêm yết hoặc vận chuyển sản phẩm không được hỗ trợ | 0-48 |\n| Không tuân thủ Nguyên tắc niêm yết sản phẩm | 0-48 |\n| **Chất lượng Sản phẩm (Kiểm tra lấy mẫu sản phẩm)** |  |\n| Vi phạm Chất lượng Sản phẩm | 0-48 |\n| **Dịch vụ khách hàng** |  |\n| Tỷ lệ phản hồi trong vòng 24h ở mức thấp | 1 |\n| Giao tiếp với khách hàng bằng hình thức không phù hợp/bị cấm | 1-12 |\n| **Hoạt động hoàn thành đơn hàng của người bán** |  |\n| Tỷ lệ hủy cao do lỗi của người bán (SFCR) | 2-4 |\n| Tỷ lệ gửi hàng muộn (LDR) ở mức cao | 2-4 |\n| Tỷ lệ trả hàng/hoàn tiền do lỗi của người bán ở mức cao | 2 |\n| Vận chuyển sản phẩm \"Khác biệt lớn so với mô tả (SNAD)\" | 1-48 |\n| **Nội dung thương mại điện tử**\u003cbr>Lưu ý: TikTok Shop có thể áp dụng hình phạt chung đối với cửa hàng/tài khoản của bạn nếu tài khoản nhà sáng tạo liên kết với bạn vi phạm nguyên tắc và chính sách trên nền tảng của chúng tôi. |  |\n| Nội dung không nguyên bản | 48 |\n| Quảng cáo sản phẩm bị cấm hoặc sản phẩm không được hỗ trợ | 6-48 |\n| Quảng cáo sản phẩm không nhất quán | 1-48 |\n| Hoạt động bị cấm theo luật pháp và quy định | 48 |\n\n#### Vi phạm liên quan đến Thông tin nhận dạng cá nhân của Người mua (Buyer PII)\n\nNgười bán vi phạm liên quan đến **Thông tin nhận dạng cá nhân của Người mua (Buyer PII)** sẽ nhận các hành động thực thi nghiêm khắc hơn, bao gồm **tạm ngừng tài khoản** và **vô hiệu hóa tài khoản vĩnh viễn.** Buyer PII bao gồm nhưng không giới hạn ở các thông tin sau của Người mua:\n\n- Họ và tên đầy đủ, Số điện thoại, Địa chỉ email, Địa chỉ giao hàng, Tên tài khoản mạng xã hội hoặc tên người dùng (ví dụ: tên người dùng TikTok), Thông tin thanh toán, Số định danh quốc gia hoặc mã số thuế và chi tiết đơn hàng mà khi kết hợp với thông tin công khai có thể xác định lại danh tính Người mua.\n\nCác hành vi bị cấm bao gồm nhưng không giới hạn ở:\n\n- **Chuyển hướng Người mua ra ngoài nền tảng**, bao gồm việc chia sẻ thông tin liên lạc cá nhân (điện thoại, email, tên tài khoản mạng xã hội, URL) trong bất kỳ nội dung liên lạc, danh sách sản phẩm hoặc tài liệu giao hàng nào từ Người bán đến Người mua.\n- **Thu thập Buyer PII** qua bất kỳ kênh nào (chat, danh sách sản phẩm, phiếu đóng gói, liên lạc sau mua hàng), trừ khi được TikTok Shop cho phép vì mục đích thực hiện đơn hàng.\n- **Sử dụng sai mục đích hoặc chia sẻ Buyer PII** cho bất kỳ mục đích nào ngoài việc thực hiện giao dịch TikTok Shop cụ thể mà thông tin đó được cung cấp. Điều này bao gồm việc liên hệ với Người mua ngoài các kênh được TikTok Shop hỗ trợ, gửi tiếp thị không được yêu cầu, tiết lộ PII cho bên thứ ba không được ủy quyền, tái sử dụng PII giữa các giao dịch, đăng PII công khai, hoặc thực hiện đơn hàng qua các nền tảng bên ngoài gửi xác nhận trực tiếp đến Người mua (ví dụ: dropshipping).\n- **Lưu giữ Buyer PII vượt quá nhu cầu thực hiện đơn hàng.** PII phải được xóa hoặc ẩn danh hóa không chậm trễ một khi giao dịch và thời hạn trả hàng/khiếu nại áp dụng (nếu có) đã kết thúc.\n\n## 5. Hệ thống Cột mốc thực thi\n\nKhi xảy ra hành vi động phạm các chính sách và nguyên tắc của chúng tôi, Nền tảng có quyền triển khai các hành động thực thi khắc phục cần thiết đối với người bán. Người bán tích lũy một số điểm AHR nhất định sẽ đạt đến các ngưỡng thực thi khác nhau. Tại các ngưỡng đó, Nền tảng sẽ triển khai Hành động thực thi đối với tài khoản của họ dựa trên số điểm tích lũy.\n\nBiểu đồ bên dưới minh họa mối quan hệ giữa các hành động thực thi và số điểm AHR tích lũy của người bán. Xin lưu ý rằng Nền tảng có thể triển khai nhiều hành động thực thi, tùy theo hình thức vi phạm của người bán.\n\nNền tảng sẽ gửi thông báo cảnh báo chính thức cho người bán khi số điểm AHR của họ còn cách mỗi ngưỡng thực thi 5 điểm.\n\n| Hành động thực thi | Ngưỡng thực thi (Điểm AHR) |\n| --- | --- |\n| Người bán sẽ không thể tham gia các siêu chiến dịch mới, hoạt động phát triển người dùng, trợ cấp vận chuyển miễn phí do nền tảng tài trợ và các lợi ích khác của nền tảng trong (7) ngày theo lịch.\u003cbr>Người bán sẽ không thể đăng ký Chương trình liên kết (7) ngày theo lịch. | 12 |\n| Người bán sẽ không thể tham gia các siêu chiến dịch mới, hoạt động phát triển người dùng, trợ cấp vận chuyển miễn phí do nền tảng tài trợ và các lợi ích khác của nền tảng trong (14) ngày theo lịch.\u003cbr>Người bán sẽ không thể đăng ký Chương trình liên kết (14) ngày theo lịch.\u003cbr>Tạm ngưng khả năng tạo và cập nhật danh sách niêm yết mới trong (14) ngày theo lịch. | 24 |\n| Nền tảng sẽ vô hiệu hóa cửa hàng của người bán trong (28) ngày theo lịch.\u003cbr>Người bán sẽ không thể tham gia các siêu chiến dịch mới, hoạt động phát triển người dùng, trợ cấp vận chuyển miễn phí do nền tảng tài trợ và các lợi ích khác của nền tảng trong (42) ngày theo lịch. | 36 |\n| Nền tảng sẽ vĩnh viễn chấm dứt cửa hàng của người bán.\u003cbr>Nền tảng có thể bắt đầu triển khai hành động pháp lý đối với người bán và/hoặc báo cáo người bán với cơ quan quản lý có liên quan | 48 |\n\n## 6. Hành động thực thi\n\nBên cạnh các ví dụ trong Phần 6, chúng tôi có thể thực hiện thêm các hành động thực thi khác đối với các hành vi vi phạm chính sách, nguyên tắc hoặc điều khoản dịch vụ của chúng tôi. Sau đây là danh sách gồm một số ví dụ về các hành động thực thi mà chúng tôi có thể thực hiện:\n\n- Thông báo cảnh báo chính thức.\n- Tạm ngưng đặc quyền niêm yết sản phẩm.\n- Hủy niêm yết sản phẩm.\n- Ngăn chặn lưu lượng truy cập của người dùng đối với quảng cáo, buổi phát trực tiếp, video và sản phẩm được niêm yết của người bán\n- Xóa quyền đủ điều kiện để được đề xuất trong Trung tâm mua sắm đối với sản phẩm được niêm yết của người bán.\n- Áp đặt giới hạn về đơn hàng và số lượng danh sách niêm yết sản phẩm đối với cửa hàng của người bán.\n- Tạm thời thu hồi hoặc chấm dứt vĩnh viễn quyền lợi của người bán.\n- Tạm ngưng hoặc chấm dứt vĩnh viễn việc đăng ký Bên liên kết của người bán và các sự kiện khác.\n- Tạm thời thu hồi hoặc chấm dứt vĩnh viễn quyền truy cập vào Nền tảng.\n- Tạm thời giữ lại hoặc giữ lại vĩnh viễn (trong trường hợp nghiêm trọng) tất cả số dư và/hoặc hủy mọi giao dịch liên quan đến tài khoản của người bán.\n- Hủy bỏ hoặc thu hồi các chương trình khuyến mãi và/hoặc trợ cấp đã cung cấp cho người bán.\n- Xóa tài khoản của người bán.\n- Áp dụng hành động pháp lý đối với người bán.\n- [Áp dụng chu kỳ quyết toán kéo dài với cửa hàng của người bán](https://seller-vn.tiktok.com/university/essay?knowledge_id=1721378949678850&from=policy&role=1&identity=1)\n- Báo cáo người bán cho các cơ quan quản lý có liên quan để truy tố (chúng tôi có quyền cung cấp thông tin cần thiết về tài khoản của người bán cho các cơ quan quản lý).\n- Tước khả năng của người bán trong việc xem xét và phê duyệt các yêu cầu hoàn tiền do khách hàng đưa ra. Chúng tôi sẽ thay mặt người bán trực tiếp xử lý quyết định phê duyệt yêu cầu hoàn tiền của khách hàng.\n- Khấu trừ mọi khoản tiền đến hạn và phải trả cho người bán để lấy đó làm khoản bồi thường mà người bán phải đáp ứng đối với mọi tổn thất hoặc thiệt hại của chúng tôi và/hoặc (những) người mua bị ảnh hưởng hoặc các bên thứ ba có liên quan khác.\n\n## 7. Tạm giữ số dư\n\nBên cạnh các quyền của Nền tảng nêu trên, nếu chúng tôi có lý do hợp lý để tin rằng người bán đã vi phạm chính sách này, bất kỳ **Chính sách nào** của chúng tôi hoặc **Điều khoản dịch vụ đối với người bán, thì chúng tôi có thể tạm thời giữ lại từ bạn các khoản tiền phải trả hoặc có thể phải trả cho người bán (bao gồm nhưng không giới hạn ở tiền bán hàng) (gọi chung là \"Số dư\")**. Nền tảng có toàn quyền đưa ra quyết định này và không cần thông báo trước cho người bán. Tuy nhiên, chúng tôi sẽ thông báo nếu chúng tôi áp dụng hạn chế này đối với tài khoản của bạn.\n\nViệc giữ lại Số dư có thể được thực hiện lâu hơn trong trường hợp:\n\n(a) 180 ngày theo lịch kể từ ngày có thông báo tạm ngưng của Nền tảng; hoặc\n\n(b) Hoàn thành điều tra của Nền tảng về hành vi vi phạm đáng ngờ của người bán.\n\nNếu Nền tảng xác định (hành động hợp lý) rằng nếu người bán vi phạm chính sách này hoặc bất kỳ chính sách nào khác của chúng tôi đã dẫn đến các tổn thất hoặc thiệt hại cho Nền tảng, (những) người mua hoặc các bên thứ ba khác, bao gồm chi phí hoạt động của bất kỳ cuộc điều tra liên quan nào, người bán có thể phải bồi thường, từ Số dư, cho Nền tảng và/hoặc (những) người mua bị ảnh hưởng hoặc các bên thứ ba có liên quan khác. Sau khi thanh toán xong tiền bồi thường, chúng tôi sẽ hoàn trả Số dư còn lại cho người bán.\n\nNgười bán có thể nộp đơn kháng nghị đối với hành động thực thi này theo mục 9 dưới đây.\n\nNếu kháng nghị thành công, Nền tảng sẽ trả lại tiền cho người bán.\n\nNền tảng có thể giữ lại số dư nếu bạn phạm phải các vi phạm sau đây (dưới đây chỉ là một số trường hợp ví dụ):\n\n- [Sản phẩm \"Khác biệt lớn so với mô tả\" (SNAD)](https://seller-vn.tiktok.com/university/essay?knowledge_id=6837791128831746&role=1&course_type=1&from=search&identity=1)\n- [Đơn hàng giả mạo hoặc gian lận](https://seller-vn.tiktok.com/university/essay?knowledge_id=5328890282182401&role=1&course_type=1&from=search&identity=1)\n- [Truy cập trái phép](https://seller-vn.tiktok.com/university/essay?knowledge_id=6837778147346177&role=1&course_type=1&from=search&identity=1)\n- [Tài khoản có số dư âm](https://seller-vn.tiktok.com/university/essay?knowledge_id=8913188201465602&role=1&course_type=1&from=search&identity=1)\n- [Lạm dụng trợ cấp của nền tảng](https://seller-vn.tiktok.com/university/essay?knowledge_id=6837795792570114&role=1&course_type=1&from=search&identity=1)\n- Không bảo mật tài khoản bằng tính năng [xác minh 2 bước](https://seller-vn.tiktok.com/university/essay?knowledge_id=1717011551110928)\n\n## 8. Kháng nghị\n\n- Nếu Người bán cho rằng hành động thực thi được áp dụng với họ do nhầm lẫn, họ có thể kháng nghị thông qua chức năng kháng nghị do nền tảng cung cấp trong thông báo hành động thực thi.\n- Sau đó, Nền tảng sẽ điều tra trường hợp này và thực hiện hành động khắc phục nếu thích hợp.\n- Xin lưu ý rằng việc gửi kháng nghị không đảm bảo rằng Người bán sẽ kháng nghị thành công.\n\n### 8.1 Quy trình kháng nghị\n\n- Người bán có thể gửi tối đa hai kháng nghị đối với một hành động thực thi.\n- Trong vòng 30 ngày kể từ ngày nhận được thông báo về hành động thực thi, Người bán phải nộp kháng nghị đầu tiên. Phải nộp kháng nghị thứ hai trong vòng mười lăm (15) ngày kể từ ngày từ chối kháng nghị đầu tiên. Sau thời gian này, người bán không được phép nộp kháng nghị nữa.\n- Điểm AHR phát sinh từ mỗi hành động vi phạm sẽ được xóa tự động sau 90 ngày theo lịch, trừ khi Người bán đã tích lũy đủ 48 điểm.\n- Tất cả các kháng nghị được đưa ra sau các mốc thời gian quy định ở trên không phải là kháng nghị hợp lệ và sẽ không được Nền tảng xem xét.\n\n### 8.2 Kết quả kháng nghị\n\n- Trong thời gian không quá chậm trễ, Nền tảng sẽ đánh giá kháng nghị của Người bán và thông báo cho Người bán về kết quả kháng nghị hoặc đưa ra yêu cầu cung cấp thêm thông tin. Người bán cũng sẽ nhận được thông báo về khả năng giải quyết tranh chấp ngoài tòa án và các biện pháp khắc phục có sẵn khác.\n- Trong thời gian không quá chậm trễ, chúng tôi sẽ thông báo cho Người bán về quyết định của Nền tảng liên quan đến kháng nghị của họ.\n- Nếu Người bán kháng nghị thành công, Nền tảng sẽ xóa mọi hình phạt đã ban hành và/hoặc khôi phục mọi đặc quyền đã thu hồi từ Người bán.\n- Tất cả các quyết định do Nền tảng đưa ra đều tuân theo toàn quyền quyết định của Nền tảng và không phân biệt đối xử, được xem xét cẩn thận và không độc đoán. Không phân biệt quy trình giải quyết tranh chấp ngoài tòa án và thủ tục hòa giải do Nền tảng đưa ra, quyết định được coi là có hiệu lực cuối cùng sau khi Nền tảng từ chối kháng nghị thứ hai.\n","# Cộng Tác Tiếp Thị Liên Kết\n\n- Ngày trên bài nguồn: 14/10/2026\n- knowledge_id: 6837788624340738\n- Nguồn: https://seller-vn.tiktok.com/university/essay?knowledge_id=6837788624340738&role=1&course_type=1&from=search&identity=1&lang=vi-VN\n\nBài viết này sẽ hướng dẫn bạn cách sử dụng tính năng **Cộng tác** (trước đây được gọi là **Kế hoạch**) trong TikTok Shop Affiliate (Tiếp thị liên kết). Chương trình Affiliate tạo ra tính năng này để đem lại cho bạn, với vai trò là Nhà bán hàng, thêm nhiều cách để bán sản phẩm với sự trợ giúp đến từ các Nhà sáng tạo. Với TikTok Shop Affiliate, Nhà bán hàng và Nhà sáng tạo đôi bên cùng có lợi: Nhà bán hàng có thể bán được nhiều sản phẩm hơn, trong khi Nhà sáng tạo có thể kiếm thêm hoa hồng từ việc bán các sản phẩm đó.\n\nĐể bắt đầu, chúng ta sẽ xem qua hai phiên bản: **Cộng tác mở** và **Cộng tác mục tiêu**. Hai phiên bản này khác nhau ở cách bạn liên kết với Nhà sáng tạo như thế nào.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/f655566c0b9a43439563a38875541921~tplv-nk3i2mqmvs-image.png?x-expires=2016691230&x-signature=dtf8bWQUdofnTBJ66JVoZFWeQhM%3D)\n\n## Cộng tác là gì?\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/2035b9b75048479ca1ece40ed6d86fa8~tplv-nk3i2mqmvs-image.png?x-expires=2016691231&x-signature=9Ghtm3ZOdRZ9kvgSy7cPHoARRsE%3D)\n\n📝 Nếu bạn trả lời **Có** cho câu hỏi ở bên trái, kế hoạch affiliate của bạn sẽ nghiêng về phía **Cộng tác mục tiêu**. Nếu ý của bạn nghiêng về câu hỏi ở bên phải hơn, chúng tôi khuyên bạn nên thử **Cộng tác mở**.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/55029dcebf06449eb9e74ac6c33f05c5~tplv-nk3i2mqmvs-image.png?x-expires=2016691229&x-signature=NKMgI0L0se77StJ6SpqcEw8LikA%3D)\n\n## Lợi thế của mỗi Phương thức hợp tác\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/759c7cadce9e4d83ba5896e36ff802ad~tplv-nk3i2mqmvs-image.png?x-expires=2016691231&x-signature=LP09VNGRfKHZVMKAI%2B1ut2J9MyQ%3D)\n\n📝 Rất nhiều Nhà bán hàng mới bắt đầu dùng TikTok Shop Affiliate đều sử dụng **Cộng tác mở** để xem thử Nhà sáng tạo nào sẽ chọn sản phẩm của họ để sử dụng và hiệu suất cá nhân của họ khi dùng sản phẩm đó.\n\nTuy nhiên, khi bạn dần quen với TikTok Shop Affiliate, bạn sẽ muốn khám phá về **Cộng tác** **mục tiêu** với những Nhà sáng tạo mà bạn đã xây dựng quan hệ đối tác.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/c2c8a12fed8a4e4baf1ce553ea2fdda4~tplv-nk3i2mqmvs-image.png?x-expires=2016691229&x-signature=AEASESK6sRV8M7SC4xrPV9sfiFQ%3D)\n\n## Có thể tìm Cộng tác Affiliate ở đâu\n\nBắt đầu việc Cộng tác Affiliate của bạn thật dễ dàng. Trên máy tính để bàn của bạn, hãy Đăng nhập vào Trung tâm nhà bán hàng và nhấn vào **Tiếp thị liên kết**. Sau đó, bạn sẽ được chuyển hướng đến **Trung tâm Affiliate.** Đi đến menu bên tay trái và ở đó bạn sẽ tìm thấy hai tùy chọn để **Cộng tác**:\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/b7fa4e67175441bda844b92176b4c24c~tplv-nk3i2mqmvs-image.png?x-expires=2016691228&x-signature=kZ3%2BlBGXii%2B8LB32lRHtPoskuds%3D)\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/1b0320a9d4284d5896e2841f48a1b5c6~tplv-nk3i2mqmvs-image.png?x-expires=2016691228&x-signature=9WyyZCsUchPrNMTc%2F8S4%2B2GsmOw%3D)\n\n## Cộng tác mục tiêu\n\nSử dụng **Cộng tác mục tiêu** cho phép bạn mời những nhà sáng tạo cụ thể quảng bá sản phẩm cho bạn. Nhà sáng tạo có thể bắt đầu quảng cáo sau khi họ chấp nhận lời mời của bạn. Họ sẽ nhận được một thư mời trong hộp thư đến của mình. Tại đó, họ có thể thêm sản phẩm của bạn vào trang trưng bày của mình và từ đó, bắt đầu tạo nội dung.\n\n**Hành trình cộng tác mục tiêu**\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/90ff5f2313b24d7c881eecb09dc0f915~tplv-nk3i2mqmvs-image.png?x-expires=2016691227&x-signature=BB3y0w6vu67TVPbOKfj4Ulc%2BHrE%3D)\n\n---\n\n### Tạo cộng tác mục tiêu của bạn\n\nBắt đầu **Cộng tác mục tiêu** bằng cách truy cập vào Trung tâm Affiliate và nhấp vào mục **Cộng tác** trên menu bên tay trái.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/08c2c27cc0344288bc50805e952b9550~tplv-nk3i2mqmvs-image.png?x-expires=2016691227&x-signature=%2FEEWG020uCfMes9lkiOAwgqy9cQ%3D)\n\n#### Kết nối nhà sáng tạo\n\n- Từ [Trung tâm Affiliate > Kết nối nhà sáng tạo](https://affiliate.tiktok.com/connection/creator?shop_region=PH), trong khi lướt tìm các nhà sáng tạo khác nhau mà bạn có thể hợp tác, bạn chỉ cần chọn nút “Mời” trên một nhà sáng tạo cụ thể là bạn đã có thể bắt đầu khởi tạo cộng tác mục tiêu.\n\n    ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/247e5194bc9a40118ca99243a062547c~tplv-nk3i2mqmvs-image.png?x-expires=2016691226&x-signature=9LF8azdO5UyK%2BUuMM9Tu%2BlY7ijQ%3D)\n\n**Nhà sáng tạo đã lưu và Mời hàng loạt**\n\n- Trong mục Kết nối nhà sáng tạo, bạn có thể lưu các nhà sáng tạo bằng cách sử dụng nút trái tim nằm trên mỗi dòng của nhà sáng tạo. Tab **Nhà sáng tạo đã lưu** sẽ hiển thị cho bạn danh sách các nhà sáng tạo mà bạn “đã thả tim”. Trên màn hình này, bạn sẽ có thể mời riêng Nhà sáng tạo hoặc **Mời hàng loạt** bằng cách nhấp vào dấu kiểm bên cạnh mục “Nhà sáng tạo”.\n\n    ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/3cb55356a54e46ab95654190a28bcb6c~tplv-nk3i2mqmvs-image.png?x-expires=2016691225&x-signature=bBvHzX93EY1L8Vu%2FwHohwFMbMEU%3D)\n\n**Thẻ nhà sáng tạo**\n\n- Sau khi đã chọn được nhà sáng tạo phù hợp từ Kết nối nhà sáng tạo, bạn có thể xem dữ liệu về hiệu suất của người đó trong thẻ nhà sáng tạo của họ. Bạn cũng sẽ có quyền mời nhà sáng tạo tham gia cộng tác mục tiêu từ giao diện này.\n\n    ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/cbc9f2a3d0e0478d9e146480c0e0697b~tplv-nk3i2mqmvs-image.png?x-expires=2016691225&x-signature=%2FL6639%2FV%2F1WiUZRjiJIDIccV11w%3D)\n\n---\n\n#### Thư mời mục tiêu\n\nMột cách khác để tạo Cộng tác mục tiêu là dùng **Thư mời mục tiêu**. Hãy truy cập [Tiếp thị liên kết > Thư mời mục tiêu](https://affiliate.tiktok.com/plan/targeted?shop_region=PHhttps://affiliate.tiktok.com/plan/targeted/create?shop_region=PH) để mời một danh sách nhiều nhà sáng tạo quảng bá cho sản phẩm của bạn trong một ngày và khoảng thời gian cố định. Trên màn hình Thư mời mục tiêu, nhấp vào **Gửi lời mời** ở góc trên bên phải màn hình của bạn.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/342690a19e364e44889099540cb32a9d~tplv-nk3i2mqmvs-image.png?x-expires=2016691224&x-signature=3nlRdfPKeCTCksVaZy%2FmNHfNqVQ%3D)\n\n---\n\nKhi bạn vào trang **Mời cộng tác**, bạn sẽ cần thực hiện bốn (4) bước chính để tạo **Cộng tác mục tiêu**\n\n##### Bước 1: Tạo Thư Mời\n\n- **Tên lời mời**: Đây sẽ là tên mà bạn dùng để gọi danh sách các nhà sáng tạo mà bạn đã mời.\n- **Có hiệu lực đến**: Các nhà sáng tạo sẽ có thể chấp nhận và quảng bá sản phẩm của bạn trong khoảng thời gian này.\n- **Thông Tin Liên Hệ**: Chia sẻ thông tin liên lạc của bạn để các nhà sáng tạo có thể liên hệ.\n- **Nội dung lời mời**: Bạn có thể thêm một thông điệp để thuyết phục nhà sáng tạo quảng bá thương hiệu / sản phẩm của bạn (tùy chọn).\n- **Loại nội dung ưu tiên**: Chia sẻ loại nội dung mà bạn ưa thích. Lưu ý rằng nhà sáng tạo vẫn có thể đăng bất kỳ loại nội dung nào để kiếm hoa hồng từ lời mời này.\n\n    ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/7c7ca641fec74c4b942b44d0e912dced~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2092125123&x-signature=XLNjwdIn0IRgogH9ejGRWhXqteU%3D)\n\n##### Bước 2: Chọn sản phẩm\n\nKiểm tra tất cả các sản phẩm bạn đã chọn và bấm **Thêm**. Bạn có thể thêm tối đa 100 sản phẩm cho mỗi lời mời.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/acf5e1a3d15d48f693e604d7ed548de5~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2092125123&x-signature=sxlzdcYItVNKuy665B%2FzdKKPLIw%3D)\n\n*📝 Hãy nhớ rằng khi thêm sản phẩm, điều quan trọng là phải kiểm tra lượng hàng tồn kho của bạn! Bạn không muốn bỏ lỡ doanh số vì các nhà sáng tạo hết hàng để bán!*Khi các sản phẩm của bạn đã được chọn, bạn có thể xác định tỷ lệ hoa hồng cho mỗi sản phẩm, và hệ thống sẽ tự động tính toán giá trị hoa hồng ước tính cho mỗi sản phẩm mà nhà sáng tạo bán.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/f12e43450e454fbeaa4cf32eeadd7b09~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2092125123&x-signature=I7d16rouYjFZKjnNKAA2d5easd4%3D)\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/083683eb4fc342c8b23bfc89b06b4ee7~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2092125124&x-signature=lFqXE5YQLd8OutEKyYMGxS8acjo%3D)\n\n*📝 Hãy chắc chắn xác định mức hoa hồng hấp dẫn đối với các nhà sáng tạo! Sử dụng hướng dẫn về mức hoa hồng được đề xuất để giúp bạn xác định tỷ lệ hoa hồng phù hợp!*\n\n##### Bước 3: Thiết lập mẫu thử miễn phí\n\nSau khi bạn đã thêm Nhà sáng tạo và Sản phẩm cho Thư mời mục tiêu, đây là lúc thiết lập Mẫu thử miễn phí. Bấm vào [đây](https://seller-vn.tiktok.com/university/essay?knowledge_id=4320631378609922&role=1&course_type=1&from=search&identity=1) để biết thêm thông tin về cách thiết lập.\n\n##### Bước 4: Chọn Nhà Sáng Tạo\n\n- Bạn có thể tìm kiếm nhà sáng tạo theo tên người dùng hoặc từ những người bạn đã lưu trong **Tìm nhà sáng tạo**![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/95df64f34fe34f3e90b29d23ae2cfe86~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2099558877&x-signature=lox1BJ5A27YE3y3vnVcI5nAPGmY%3D)\n\n---\n\n### Hiệu suất cộng tác mục tiêu\n\nKhi tính năng Cộng tác mục tiêu đã hoạt động, bạn có thể kiểm tra từng hiệu suất của Cộng tác mục tiêu vào bất kỳ lúc nào. Bạn sẽ có thể xem có bao nhiêu Nhà sáng tạo đã chấp nhận lời mời và bao nhiêu trong số những Nhà sáng tạo được mời này đã đăng bài.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/9fa60eaa8d23411eabfd828a632e955f~tplv-nk3i2mqmvs-image.png?x-expires=2016691221&x-signature=hMYq33j4nHhvdqvsjoGVTxzjfRg%3D)\n\nNhấp vào tên của Cộng tác mục tiêu và bạn sẽ có thể tìm thấy tất cả thông tin cần thiết: **Chi tiết cộng tác, Chi tiết về nhà sáng tạo và Chi tiết sản phẩm**.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/79439a6a4c054e58aeae9e41fcc409e8~tplv-nk3i2mqmvs-image.png?x-expires=2016691220&x-signature=nxHZK6iaibnzYLJP6TAlv4oXlZA%3D)\n\n**Chi tiết video**\n\nĐối với mỗi sản phẩm có nội dung do nhà sáng tạo đăng, bạn sẽ có thể xem nội dung video giới thiệu về sản phẩm đó.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/b1070d131d464b7aaae50e9a12a696ee~tplv-nk3i2mqmvs-image.png?x-expires=2016691219&x-signature=X9IHOkrGToEjlIfOzql3LctjaB4%3D)\n\n---\n\n### Góc nhìn từ nhà sáng tạo của cộng tác mục tiêu\n\nSau khi bạn đã thiết lập Cộng tác mục tiêu, Nhà sáng tạo sẽ có thể nhìn thấy lời mời của bạn như hiển thị dưới đây:\n\n**Cách nhà sáng tạo nhìn thấy Lời mời cộng tác mục tiêu của bạn**\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/93f3efb81dd14eab93d56831a73b953c~tplv-nk3i2mqmvs-image.png?x-expires=2016691220&x-signature=e5oWcLANiTJ8QB8IknCS8s0k60s%3D)\n\n### Xóa sản phẩm và Nhà sáng tạo trong Cộng tác Mục tiêu\n\nNếu bạn muốn xóa Sản phẩm hoặc Nhà sáng tạo trong Cộng tác mục tiêu của mình, trước tiên bạn phải chọn Lời mời Cộng tác Mục tiêu muốn xoá.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/dbb338934a75493a8a896272e15678b9~tplv-nk3i2mqmvs-image.png?x-expires=2017124945&x-signature=0qOyVNibfp%2BFBQtk5ZCSli4gNJ4%3D)\n\nSau khi bấm vào Chi tiết lời mời, bạn có thể chỉnh sửa Nhà sáng tạo và sản phẩm bằng cách nhấp vào nút được đánh dấu bên dưới:\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/8278c1135395458f9acefea45771b8c1~tplv-nk3i2mqmvs-image.png?x-expires=2017124945&x-signature=kPAd0Sou%2FV2VmuzC8%2B4ADif9GKU%3D)\n\nĐiều này s ền theo đơn vị tiền tệ địa phương của bạn.\n\n- Hạn mức hằng tuần được xác định dựa trên **GMV của 30 ngày gần nhất** của nhà bán hàng, điều này có nghĩa là nhà bán hàng có thể được mở thêm hạn mức khi GMV tăng lên.\n- Hạn mức được đặt lại **mỗi tuần**. Bất kỳ hạn mức chưa sử dụng nào của tuần hiện tại sẽ **không** được chuyển sang tuần tiếp theo.\n    -   **Ví dụ**: Nếu một nhà bán hàng có hạn mức hằng tuần là 100 nhà sáng tạo và chỉ sử dụng 50 trong một tuần, hạn mức sẽ được đặt lại về 100 vào tuần kế tiếp. 50 hạn mức chưa sử dụng sẽ không được cộng dồn.\n- Những nhà bán hàng có hiệu quả tốt và nằm trong top 20% dựa trên hiệu quả tiếp cận trong 14 ngày có thể được thưởng **hạn mức bổ sung** ngoài hạn mức hằng tuần cơ bản. Hiệu suất được đánh giá **hằng tuần**, dựa trên tỉ lệ nhà bán hàng liên lạc nhà sáng tạo và tạo ra hoạt động hợp tác.\n    -   **Ví dụ**: Nếu một nhà bán hàng có hạn mức hằng tuần cơ bản là 300 cho các nhà sáng tạo cấp L3–L4 và đủ điều kiện nhận thưởng, họ có thể nhận thêm 200 hạn mức vào tuần tiếp theo, cho phép họ liên hệ tổng cộng tối đa 500 nhà sáng tạo.\n    -   **Lưu ý**: Vì hiệu suất được đánh giá mỗi tuần, hạn mức thưởng không phải là cố định. Nếu hiệu suất giảm trong một tuần sau đó, nhà bán hàng có thể mất phần hạn mức bổ sung.\n\n| Nhà bán hàng có thể xem chi tiết hạn mức của mình bằng cách truy cập trang này từ trang Tìm nhà sáng tạo. | Trên trang này, họ có thể kiểm tra hạn mức khả dụng cho từng cấp độ nhà sáng tạo mà họ đủ điều kiện để liên hệ. | Hệ thống cũng sẽ xem xét hằng tuần liệu nhà bán hàng có đủ điều kiện nhận thêm hạn mức thưởng hay không. | Nhà bán hàng cũng có thể tìm thấy thông tin chi tiết hơn về giới hạn hạn mức và cách hạn mức được tính. |\n| --- | --- | --- | --- |\n| ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/881a71d3963749608d186f4444b5e087~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2107315547&x-signature=cYo0bHbUGgsI2hLa9grV3q3dlQY%3D) | ![](https://p16-oec-university-sig
