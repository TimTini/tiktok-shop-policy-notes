tplv-nk3i2mqmvs-image.png?x-expires=2020405721&x-signature=Lrk6xj1wSeukM74D96%2F5jUnjUx4%3D)\n\n---\n\nCuối cùng, tùy chọn **Yêu cầu mẫu** cho phép bạn lọc các yêu cầu bạn nhận được dựa trên ngày hết hạn của chúng và yêu cầu mẫu có tự động bị từ chối hay không nếu không được chọn trong vòng 30 ngày.\n\n- **Từ những Nhà sáng tạo đáng tin cậy:** Tùy chọn này cung cấp cho bạn danh sách 20% Nhà sáng tạo hàng đầu dựa trên tỷ lệ mẫu nhận được và nội dung đã đăng.\n\n    ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/997f6fc7916c4c4e99bbbf68da233087~tplv-nk3i2mqmvs-image.png?x-expires=2020405720&x-signature=leJDSIEoAfe8btYwHx3Hawvr5HU%3D)\n\nHãy thoải mái khám phá tất cả các tùy chọn lọc có sẵn để nhận được những các yêu cầu tốt nhất cho sản phẩm của bạn!\n\n---\n\n#### Tự thêm sản phẩm mới\n\n\u003cmark>Các sản phẩm trong Kế Hoạch Cửa Hàng sẽ tự động được thêm vào Cộng tác mở.\u003c/mark>\n\nChọn sản phẩm theo cách thủ công có thể làm bạn bị quá tải, đặc biệt là khi Cửa hàng của bạn có đến hàng nghìn sản phẩm. Để giúp cho việc vận hành mỗi ngày của bạn đơn giản hơn, bạn có thể chọn bật Chế độ tự động và chế độ này sẽ thay bạn làm phần việc này.\n\nTrên trang **Cộng tác mở**, hãy nhấn vào **Chế độ tự động cho sản phẩm mới** nằm ở góc trên bên phải màn hình. Đối với người mới sử dụng, bạn sẽ thấy có phần giải thích ngắn gọn về chức năng trên Cửa sổ bật lên này.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/ba486aa592384c14966c14fc3360aeb1~tplv-nk3i2mqmvs-image.png?x-expires=2016691216&x-signature=INar1J88UARHh33lJP6BMu0Fp2w%3D)\n\nKhi nhấp vào **Chế độ tự động cho sản phẩm mới**, một Cửa sổ bật lên như thế này sẽ xuất hiện trên màn hình của bạn, hãy bật **Các sản phẩm mới thêm vào affiliate** và bạn sẽ được yêu cầu đặt tỷ lệ hoa hồng chung cho mọi sản phẩm mới của mình.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/7f91bc098ca844d7b80cc8bce4e9b549~tplv-nk3i2mqmvs-image.png?x-expires=2016691214&x-signature=nwLNFlErctzjKALDDS7RQuuRcTU%3D)\n\n\u003cmark>Sau khi đã hoàn tất, tất cả các sản phẩm mới tải lên trong Cửa hàng của bạn sẽ tự động được thêm vào mục Cộng tác mở với tỷ lệ hoa hồng đã được định trước.\u003c/mark>\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/fec74ba2ff8d475d8fea378d28c3e25a~tplv-nk3i2mqmvs-image.png?x-expires=2016691213&x-signature=wSWsZlcG3PnH5uGWUY1Kpa1bjpg%3D)\n\nNếu muốn tiếp tục thêm sản phẩm theo cách thủ công, bạn có thể tắt Tự động thêm sản phẩm bằng cách nhấp vào nút được đánh dấu bên dưới:\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/300ee7942a3d40209dc494623761eedf~tplv-nk3i2mqmvs-image.png?x-expires=2016691213&x-signature=RtEkEPGsqNsN4nTXwLsMUQyw%2B%2Fw%3D)\n\nĐể xóa sản phẩm khỏi Cộng tác mở, bạn chọn sản phẩm bằng cách đánh dấu vào hộp trước thông tin sản phẩm. Hãy đánh dấu vào tất cả các sản phẩm bạn muốn chọn và nhấp vào nút Xóa hàng loạt.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/f09fbd0e64804c93ad263d0bb4e905b7~tplv-nk3i2mqmvs-image.png?x-expires=2016691212&x-signature=Ezy6i77s0IlOVyBDHWIsMaA6gjs%3D)\n\n---\n\n### Hiệu suất cộng tác mở\n\nBạn có thể kiểm tra hiệu suất sản phẩm của mình trong mục Cộng tác mở vào bất cứ lúc nào. Các nút ở đầu danh sách sản phẩm sẽ cho phép bạn quản lý những mục sau:\n\n- **Chỉnh sửa hoa hồng** – Tăng hoặc giảm tỷ lệ hoa hồng mà bạn đã thêm lúc đầu\n- **Mẫu miễn phí hàng loạt** – Tạo tùy chọn để Nhà sáng tạo có thể yêu cầu mẫu sản phẩm của bạn và sử dụng cho nội dung của họ\n- **Hủy kích hoạt** – Chọn một hoặc nhiều sản phẩm mà bạn muốn xóa trong Cộng tác Affiliate của bạn\n\nĐối với mỗi dòng sản phẩm cụ thể, bạn có thể kiểm tra đầy đủ chi tiết và hiệu suất của chúng:\n\n- **Giá** – Giá đầy đủ của sản phẩm trong cửa hàng của bạn\n- **Số lượng hàng tồn kho** – Số lượng sản phẩm có sẵn trong cửa hàng của bạn\n- **Tỷ lệ hoa hồng** – Tỷ lệ phần trăm từ **Giá** mà Nhà sáng tạo sẽ nhận được cho mỗi Sản phẩm đã bán\n- **Hoa hồng ước tính** – Giá trị chuyển đổi tiền tệ của **Tỷ lệ hoa hồng**\n- **Mẫu miễn phí** – Có thể yêu cầu sản phẩm để sử dụng trong nội dung của Nhà sáng tạo hay không\n- **Nhà sáng tạo đã thêm** – Số lượng Nhà sáng tạo đã thêm sản phẩm của bạn vào Trang trưng bày sản phẩm của họ\n- **Nhà sáng tạo đã đăng** – Số lượng Nhà sáng tạo đã tạo và đăng video hoặc buổi LIVE có liên kết sản phẩm của bạn\n- **Trạng thái sản phẩm** – Có thể sử dụng sản phẩm cho Cộng tác mở hay không\n\n    ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/1795f8774f3e4784b94067dcd71b2e60~tplv-nk3i2mqmvs-image.png?x-expires=2016691212&x-signature=31vYZb0bNCNWe3u44i2qHM68f8w%3D)\n\n    ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/f62faa65f4024f049121aca548b14ed8~tplv-nk3i2mqmvs-image.png?x-expires=2016691212&x-signature=t3aPCIzMZw7WpmAjc6CCXerDxzs%3D)\n\nNhấp vào cột **Nhà sáng tạo đã thêm** của một sản phẩm riêng lẻ sẽ chuyển hướng bạn đến trang **Chi tiết nhà sáng tạo đã thêm**. Đây là nơi bạn có thể kiểm tra đã có bao nhiêu video hoặc buổi LIVE mà Nhà sáng tạo đã thực hiện cho Sản phẩm của bạn.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/7dc2be5919ee4d4dbb2470038697b7c5~tplv-nk3i2mqmvs-image.png?x-expires=2016691212&x-signature=ldubtSjhOu0CtPfCOfJRHJTepzs%3D)\n\n**Chi tiết Video**\n\nĐối với mỗi sản phẩm có nội dung do nhà sáng tạo đăng, bạn sẽ có thể xem nội dung video giới thiệu về sản phẩm đó.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/20acfe999d134cb8bef309055f521a43~tplv-nk3i2mqmvs-image.png?x-expires=2016691212&x-signature=1KUTDvR%2FCv9LAQHlZWNh00tYwyI%3D)\n\n### Xóa Nhà sáng tạo trong Cộng tác Mở\n\nĐể xóa Nhà Sáng Tạo trong Cộng Tác Mở, hãy vào trang Cộng Tác Mở và kéo **sang phải** để thấy cột **Trang Trưng Bày của Nhà Sáng Tạo**.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/44ca10c73fc74519bb2d61b900892e4e~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2026200554&x-signature=FZNCv%2Ffthi%2FQl47TyzoIQ8exmxk%3D)\n\nBấm vào **số hiển thị** để chuyển đến trang chi tiết về Trang Trưng Bày của Nhà Sáng Tạo.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/a94b22db2561464a9cad69f279e82741~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2026200554&x-signature=asNG8w9qCI2hWsweaW29N0mWG00%3D)\n\nTrên trang chi tiết về Trang Trưng Bày của Nhà Sáng Tạo, bạn có thể thấy tất cả Nhà Sáng Tạo hiện đang giới thiệu sản phẩm của bạn trên Trang Trưng Bày thuộc tài khoản của họ. Để xóa sản phẩm của bạn khỏi Trang Trưng Bày của Nhà Sáng Tạo, hãy bấm vào nút **thùng rác** nằm bên cạnh nút **mời**.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/1e6a56258eb34d7f9d70bac31b1460b5~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2026200555&x-signature=cnFzKCEFizpMfHx3mXxUCYCw2Ts%3D)\n\nMột cửa sổ sẽ bật lên để xác nhận có xóa Nhà Sáng Tạo hay không.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/369c43e389914a7fbb22a14b7eeecd6d~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2026200553&x-signature=zxqaTfXUqmvy42C8h2c1dYQyHG0%3D)\n\nNgoài ra, bạn còn có thể tìm kiếm các Nhà Sáng Tạo bằng thanh tìm kiếm nếu không thể tìm ra họ trong Danh sách.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/9eb8d4299f3f4f128bb59352211cb8d9~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2026200553&x-signature=g3L1RSYTpOxs%2F1WrUXQ8FXPKddE%3D)\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/cbfc6dcae28d48ba8a460cb7ecbee2dd~tplv-nk3i2mqmvs-image.png?x-expires=2016691211&x-signature=rT5IbAyHyQHBTQKTaF%2F5uhhnIAE%3D)\n\n## Câu hỏi thường gặp\n\n1.  **Đây là lần đầu tiên tôi dùng thử TikTok Shop Affiliate. Tôi chỉ được phép chọn một kiểu Cộng tác thôi sao?**\n    -   \u003cmark>Không, bạn được phép sử dụng cả hai loại Cộng tác cùng một lúc. Tuy nhiên, chúng tôi khuyên bạn lúc đầu chỉ nên bắt đầu với **Cộng tác mở** để làm quen dần với chương trình.\u003c/mark>\n2.  **Hoa hồng sẽ hoạt động như thế nào nếu tôi đăng ký sản phẩm của mình trên cả Cộng tác mở và Cộng tác mục tiêu?**\n\n\u003cmark>Nếu người sáng tạo quảng cáo một sản phẩm được đăng ký trên cả hai lần hợp tác, họ sẽ nhận được hoa hồng từ Cộng tác mục tiêu.\u003c/mark>\n\n3.  **Sản phẩm 1 hiện đang trong chương trình Cộng Tác Mở với tỷ lệ Hoa Hồng 15%. Nhà Bán Hàng tiến hành hạ tỷ lệ xuống 12%, chuyện gì sẽ xảy ra?**\n    -   \u003cmark>Những Nhà Sáng Tạo cũ có sản phẩm trong nội dung/khuyến mãi của họ từ trước khi thay đổi sẽ nhận được tỷ lệ Hoa Hồng 15% trong 30 ngày. Sau đó, họ sẽ nhận được Hoa Hồng 12%.\u003c/mark>\n    -   \u003cmark>Nhà Sáng Tạo mới thêm sản phẩm sau khi thay đổi sẽ nhận được 12% Hoa Hồng.\u003c/mark>\n\nTìm hiểu thêm [tại đây](https://seller-vn.tiktok.com/university/essay?knowledge_id=3747225037670161&role=1&course_type=1&from=search&identity=1)\n\n4.  **Tôi có thể thêm bao nhiêu người sáng tạo vào \"Người sáng tạo đã lưu\"?**\n\n\u003cmark>Bạn có thể lưu tới 1000 người sáng tạo\u003c/mark>\n\n5.  **Tôi có thể gửi bao nhiêu Lời mời hợp tác mục tiêu trong một ngày?**\n\n\u003cmark>Bạn có thể gửi tới 1000 lượt cộng tác trong 24 giờ\u003c/mark>\n\n6.  **Tôi có thể mời bao nhiêu người sáng tạo tham gia một Target Collaboration?**\n\n\u003cmark>Bạn có thể mời tối đa 50 người sáng tạo cho một lần Cộng tác mục tiêu\u003c/mark>\n\n7.  **Tôi có thể thêm bao nhiêu sản phẩm vào lời mời Cộng tác mục tiêu?**\n\n\u003cmark>Bạn có thể thêm tối đa 100 sản phẩm cho một Cộng tác mục tiêu\u003c/mark>\n\n8.  **Sau khi tạo và gửi Lời mời cộng tác mục tiêu, tôi có cần thông báo cho Người tạo không?**\n\n\u003cmark>Người sáng tạo sẽ tự động nhận được lời mời từ phía họ sau khi bạn gửi. Bạn có thể kiểm tra bài viết này để biết người sáng tạo sẽ nhận được lời mời như thế nào. Tuy nhiên, bạn luôn có thể chia sẻ lại liên kết Mời cộng tác mục tiêu với người sáng tạo nếu cần bằng cách nhấp vào nút chia sẻ này:\u003c/mark>\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/b7f031667eec4bdabfeaa3a0dae09df5~tplv-nk3i2mqmvs-image.png?x-expires=2016691873&x-signature=yargM9J9e75cK%2FnLkOthxF4r14Q%3D)\n\n9.  **Sau khi tạo Cộng tác mục tiêu, tôi có thể chỉnh sửa chi tiết không?**\n\n\u003cmark>Vâng, bạn có thể. Trên trang chính Cộng tác mục tiêu, chỉ cần nhấp vào Lời mời cộng tác mục tiêu mà bạn muốn chỉnh sửa. Nó sẽ đưa bạn đến trang Chi tiết Lời mời. Nhấp vào nút chỉnh sửa và nó sẽ đưa bạn đến trang Chỉnh sửa Lời mời. Tại đây, bạn có thể thêm hoặc xóa người sáng tạo và sản phẩm, đồng thời điều chỉnh chi tiết hoa hồng và lời mời. Nếu người sáng tạo đang quảng cáo sản phẩm thì những thay đổi sẽ được áp dụng từ ngày hôm sau.\u003c/mark>\n","# Nguyên tắc đăng bán sản phẩm có thương hiệu\n\n- Ngày trên bài nguồn: 22/09/2026\n- knowledge_id: 8064144491513601\n- Nguồn: https://seller-vn.tiktok.com/university/essay?knowledge_id=8064144491513601&role=1&course_type=1&from=search&identity=1&lang=vi-VN\n\nBản toàn văn. Thẻ mark chỉ để nhìn nhanh, không thuộc nội dung chính sách.\n\n## Sản phẩm có thương hiệu là gì?\n\nSản phẩm có thương hiệu là những sản phẩm mang một thương hiệu nào đó. Thương hiệu và các đặc điểm của thương hiệu đó có thể được bảo vệ bởi quyền sở hữu trí tuệ thuộc về chủ sở hữu bản quyền. Người bán trên nền tảng phải tôn trọng các quyền này.\n\n\u003cmark>Đối với một số sản phẩm có thương hiệu, người bán có thể phải xin cấp **Chứng nhận thương hiệu** trước khi có thể đăng bán các sản phẩm này trên nền tảng.\u003c/mark> Để tìm hiểu về quy trình đăng ký, vui lòng tham khảo bài viết [Sản phẩm có thương hiệu – Hướng dẫn đăng ký chứng nhận thương hiệu](https://seller-vn.tiktok.com/university/essay?knowledge_id=6837770400401153&role=1&course_type=1&from=search&identity=1).\n\nKhi đăng bán sản phẩm có thương hiệu, bạn phải tuân thủ các nguyên tắc sau đây, cùng với các nguyên tắc đăng bán sản phẩm khác được nêu trong Trung tâm chính sách.\n\n## Đăng bán Sản phẩm có thương hiệu so với Sản phẩm không có thương hiệu\n\nNhằm đảm bảo rằng khách hàng có thể đưa ra quyết định mua hàng sáng suốt, vui lòng tuân thủ các nguyên tắc chung sau đây.\n\n| Sản phẩm có thương hiệu | Sản phẩm không có thương hiệu |\n| --- | --- |\n| Sản phẩm có thương hiệu phải hiển thị rõ ràng thông tin về thương hiệu | Sản phẩm không có thương hiệu không được khiến khách hàng hiểu lầm rằng đó là sản phẩm có thương hiệu |\n| Khi bán một sản phẩm có thương hiệu, nội dung đăng bán sản phẩm phải trình bày rõ rằng sản phẩm đó có thương hiệu, nhằm hỗ trợ người tiêu dùng dễ dàng nhận diện thương hiệu đó.\u003cbr>Thuộc tính đăng bán (tiêu đề, hình ảnh sản phẩm, mô tả, thông tin SKU, v.v.) nên đề cập đến thương hiệu của sản phẩm đang được bán, khi có thể.\u003cbr>Đảm bảo rằng tất cả các thuộc tính đăng bán đều nhất quán với trường \"Thương hiệu\" trong nội dung đăng bán sản phẩm.\u003cbr>Không cố gắng che giấu hoặc giữ lại bất kỳ thông tin nào về thương hiệu, nếu không, bạn có thể vi phạm về Gian lận thương hiệu. | Khi bán một sản phẩm không có thương hiệu, nội dung đăng bán phải trình bày rõ rằng sản phẩm đó không có thương hiệu để tránh khả năng khách hàng nhầm lẫn hoặc sai lệch thông tin.\u003cbr>Thuộc tính đăng bán (tiêu đề, hình ảnh sản phẩm, mô tả, thông tin SKU, v.v.) không nên đề cập đến bất kỳ thương hiệu nào, trừ khi đó là thương hiệu của các sản phẩm tương thích.\u003cbr>Không cố gắng che giấu hoặc giữ lại bất kỳ thông tin thương hiệu nào nếu sản phẩm thực sự có thương hiệu. Đồng thời, hãy tham khảo hướng dẫn đăng bán ở phần trên |\n\nTìm hiểu thêm bằng cách nhấp vào các liên kết sau đây:\n\n- [Gian lận thương hiệu](https://seller-vn.tiktok.com/university/essay?knowledge_id=3156588241159937&role=1&course_type=1&from=search&identity=1)\n- [Hướng dẫn đăng bán các sản phẩm tương thích](https://seller-vn.tiktok.com/university/essay?knowledge_id=1344073953773314&role=1&course_type=1&from=search&identity=1)\n\n## Nguyên tắc đăng bán sản phẩm có thương hiệu\n\nKhi đăng bán sản phẩm có thương hiệu, vui lòng đảm bảo rằng bạn tuân thủ các nguyên tắc sau đây khi đăng bán sản phẩm.\n\n### Hình ảnh sản phẩm\n\n| ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/919281cfb3074138ab454bf8622c6b66~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2043210146&x-signature=u2kUs58wuobraOcADqcj72r9l0k%3D) | ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/7890f05b4f2a40e89bbdb07a41842298~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2043210146&x-signature=uWI0OwtzNsPUf2b%2BVwVpc7klzsg%3D) | ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/df55dcfb45be49d2ab978681bfa97b8b~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2043210147&x-signature=%2BRsEhFQHnTM5ESMIGgyg2VMVz8U%3D) |\n| --- | --- | --- |\n\nNgười bán nên sử dụng một vài hình ảnh (do người bán sở hữu hoặc được phép sử dụng) để đại diện cho sản phẩm đăng bán. \u003cmark>**Ít nhất một** trong các hình ảnh **phải** phản ánh thương hiệu của sản phẩm.\u003c/mark>\n\n\u003cmark>Người bán không được phép sử dụng phương tiện kỹ thuật số hoặc vật lý (bao gồm nhưng không giới hạn ở nhãn dán, vết ố, giấy tờ, văn bản, hoạ tiết khảm hoặc băng dính, v.v.) có khả năng che khuất/ẩn thông tin thương hiệu nhằm ngăn khả năng xác định thương hiệu của sản phẩm.\u003c/mark> Nếu không tuân thủ nguyên tắc này, bạn có thể mắc phải vi phạm [Gian lận thương hiệu](https://seller-vn.tiktok.com/university/essay?knowledge_id=3156588241159937&role=1&course_type=1&from=search&identity=1).\n\n### Tiêu đề/Tên sản phẩm\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/113c5e6b15774940b26c8187999d2e6a~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2043210146&x-signature=UPqhLX2I3krtE7ZKII8pKZ1%2FI0s%3D)\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/eceaac11f49c456ab3306fffd7d3b7f0~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2043210147&x-signature=KGESg8alzR%2FWTwgkWe%2B7xs37TxI%3D)\n\n\u003cmark>Phải nêu thương hiệu chính (không phải mẫu hay biến thể) trên tên sản phẩm, theo sau là thông tin về mẫu sản phẩm.\u003c/mark>\n\n| NÊN | KHÔNG NÊN |\n| --- | --- |\n| OPPO Reno11 Pro 5G | Reno11 Pro 5G |\n| Samsung Galaxy A55 5G | Galaxy A55 5G |\n\n\u003cmark>Không được đề cập đến bất kỳ thương hiệu nào khác trong nội dung đăng bán sản phẩm nếu chưa được cho phép vì đây là hành động có khả năng vi phạm quyền sở hữu trí tuệ của chủ sở hữu nhãn hiệu.\u003c/mark> Nếu không tuân thủ nguyên tắc này, bạn có thể [Vi phạm nhãn hiệu](https://seller-vn.tiktok.com/university/essay?knowledge_id=7444121006737153&role=1&course_type=1&from=search&identity=1).\n\n### Danh mục\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/c78106a186744ffa9578aab668f9afc1~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2043210146&x-signature=vAeihKz0nDNOD2A6sWV3ivPijT4%3D)\n\nVui lòng chọn danh mục sản phẩm phù hợp. Nếu sản phẩm là **sản phẩm cũ/sản phẩm đã qua sử dụng**, vui lòng đăng bán sản phẩm trong danh mục phù hợp. Vui lòng tham khảo [Nguyên tắc đăng bán sản phẩm được tân trang lại/sản phẩm đã qua sử dụng](https://seller-vn.tiktok.com/university/essay?knowledge_id=383957212661520&role=1&course_type=1&from=search&identity=1) để biết thêm thông tin.\n\n### Trường \"Thương hiệu\"\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/309e34fef020421d8989debee54c3af8~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2043210145&x-signature=vHGDHgCUCRe5u6rgECKocnfaVAk%3D)\n\nNếu bạn đang bán sản phẩm có thương hiệu, vui lòng chọn thương hiệu phù hợp từ danh sách thả xuống. \u003cmark>Một số thương hiệu chuyển sang màu xám vì bạn phải xin chứng nhận thương hiệu trước.\u003c/mark> Nếu bạn đang bán sản phẩm không có thương hiệu, vui lòng chọn \"Không có thương hiệu\".\n\n**Thương hiệu đã có Chứng nhận**\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/1d1e4c7bdb284f62a602023f39f7e040~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2043210146&x-signature=i9da1K8jwa7wTvaAC9LqfpJRjRA%3D)\n\n\u003cmark>Nếu bạn đã được cấp chứng nhận thương hiệu, vui lòng chọn thương hiệu có thẻ \"Đã chứng nhận\" màu xanh lá cây từ danh sách lựa chọn đối với tất cả các sản phẩm đăng bán thuộc thương hiệu đó.\u003c/mark>\n\n\u003cmark>**Lưu ý:** Nếu bạn chỉ mới được cấp chứng nhận thương hiệu sau khi đã đăng bán sản phẩm, vui lòng cập nhật tất cả các sản phẩm đăng bán thuộc thương hiệu đó theo hướng dẫn phía trên.\u003c/mark>\n\n### Mô tả sản phẩm\n\nTrong phần này, bạn có thể trình bày thêm bất kỳ thông tin chi tiết nào về thông số kỹ thuật hoặc thương hiệu của sản phẩm.\n\nKhông được đề cập đến bất kỳ thương hiệu nào khác trong nội dung đăng bán sản phẩm nếu chưa được phép vì đây là hành động có khả năng vi phạm quyền sở hữu trí tuệ của chủ sở hữu nhãn hiệu. Nếu không tuân thủ nguyên tắc này, bạn có thể [Vi phạm nhãn hiệu](https://seller-vn.tiktok.com/university/essay?knowledge_id=7444121006737153&role=1&course_type=1&from=search&identity=1).\n\nTất cả các hình ảnh được sử dụng trong phần này không được phép bao gồm phương tiện kỹ thuật số hoặc vật lý (bao gồm nhưng không giới hạn ở nhãn dán, vết ố, giấy tờ, văn bản, hoạ tiết khảm hoặc băng dính, v.v.) có khả năng che khuất/ẩn thông tin thương hiệu nhằm ngăn khả năng xác định thương hiệu của sản phẩm. Nếu không tuân thủ nguyên tắc này, bạn có thể vi phạm [Gian lận thương hiệu](https://seller-vn.tiktok.com/university/essay?knowledge_id=3156588241159937&role=1&course_type=1&from=search&identity=1).\n\n**Lưu ý:** Bạn chỉ nên trình bày thông tin thương hiệu vào phần mô tả sản phẩm, việc đưa thông tin thương hiệu vào nơi khác đều được xem là *không đầy đủ*. Bạn phải đảm bảo tuân thủ các yêu cầu về tiêu đề và hình ảnh nêu trên.\n\n## Cập nhật bao bì đối với Sản phẩm có thương hiệu\n\nĐôi khi, các thương hiệu có thể thay đổi bao bì của mình. Sau đây là một số nguyên tắc giúp bạn đăng bán các sản phẩm có bao bì mới này một cách rõ ràng và tránh gây nhầm lẫn cho khách hàng.\n\n**Nguyên tắc về hình ảnh sản phẩm** Nếu sản phẩm bạn đang bán đã được cập nhật hoặc thay đổi thiết kế bao bì, bạn nên:\n\n- \u003cmark>Cập nhật hình ảnh chính để thể hiện sản phẩm mà khách hàng sẽ nhận được.\u003c/mark>\n- \u003cmark>Bổ sung một hình ảnh so sánh thiết kế cũ và thiết kế mới cập nhật, nhằm giúp khách hàng nhận ra sự khác biệt.![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/c720826552d4404c883b9267184c2dfb~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2076161602&x-signature=8l44veE2BtG%2B28d33QimMWGBLOY%3D)\u003c/mark>\n\n**Nguyên tắc về tiêu đề sản phẩm**\n\n- \u003cmark>Nhằm giúp khách hàng nhận biết các đặc điểm cập nhật hoặc thay đổi trên thiết kế bao bì sản phẩm, bạn có thể thêm ghi chú ngắn như \"Bao bì mới\" hoặc \"Thiết kế bao bì mới được cập nhật\"\u003c/mark>\n\n**Nguyên tắc về mô tả sản phẩm**\n\n- \"Chỉ thiết kế mới này là chính hãng 100%\".\n- \"Bao bì cũ đã ngừng sản xuất. Chỉ có phiên bản mới này là hàng thật\".\n- \"Không có nhãn dán ảnh ba chiều = Không phải hàng chính hãng!\"\n\n- \u003cmark>Nếu bao bì mới có thêm các tính năng xác minh (ví dụ: mã QR, ảnh ba chiều hoặc nhãn bảo mật), bạn có thể đề cập đến những tính năng này trong phần mô tả sản phẩm.\u003c/mark>\n- \u003cmark>Tránh đưa ra những tuyên bố không đúng sự thật và có thể gây hiểu lầm cho khách hàng hoặc ngụ ý sai lệch rằng sản phẩm có thiết kế bao bì cũ là hàng giả, chẳng hạn như:\u003c/mark>\n\n## Hạn chế đặc biệt áp dụng với một số thương hiệu\n\n\u003cmark>Đối với người bán cá nhân, chúng tôi có thể hạn chế khả năng bán hàng từ một số thương hiệu nhất định trên TikTok Shop. Khi người bán cố gắng đăng bán các thương hiệu bị hạn chế, chúng tôi sẽ thông báo lúc bạn đăng bán sản phẩm. Nếu bạn muốn đăng bán những thương hiệu đó, vui lòng đăng ký tài khoản người bán doanh nghiệp và gửi tài liệu Chứng nhận thương hiệu để chứng minh rằng bạn được phép bán sản phẩm của những thương hiệu đó trên TikTok Shop.\u003c/mark>\n\nNền tảng của chúng tôi có toàn quyền cấm đăng bán và bán sản phẩm từ các thương hiệu cụ thể vì có khả năng dẫn đến trải nghiệm tiêu cực cho khách hàng.\n\n## Điều gì xảy ra nếu tôi vi phạm các nguyên tắc này?\n\n\u003cmark>Nếu phát hiện ra rằng bạn vi phạm các nguyên tắc này, chúng tôi có thể thi hành chế tài đối với tài khoản của bạn. Bạn nên lưu ý rằng các hành động vi phạm lặp lại sẽ dẫn đến các hình phạt nghiêm trọng hơn.\u003c/mark>\n\nVui lòng đọc bài viết [Lý do vi phạm, Điểm vi phạm & Biện pháp thi hành chế tài áp dụng với người bán](https://seller-vn.tiktok.com/university/essay?knowledge_id=6132077083739920&role=1&course_type=1&from=search&identity=1) và [Điều khoản dịch vụ dành cho người bán](https://seller-vn.tiktok.com/university/essay?knowledge_id=2581017870255874&default_language=en&identity=1) để biết thêm thông tin. Nếu bạn cho rằng biện pháp thi hành chế tài được áp dụng với mình do nhầm lẫn, vui lòng gửi đơn kháng nghị thông qua Trung tâm Nhà bán hàng. Vui lòng đọc bài viết [Nguyên tắc kháng nghị dành cho người bán](https://seller-vn.tiktok.com/university/essay?knowledge_id=5696656206202625&role=1&course_type=1&from=search&identity=1) để biết thêm thông tin.\n","# Cách đăng ký Chứng nhận thương hiệu\n\n- Ngày trên bài nguồn: 23/09/2026\n- knowledge_id: 5407666547115796\n- Nguồn: https://seller-vn.tiktok.com/university/essay?knowledge_id=5407666547115796&role=1&course_type=1&from=search&identity=1&lang=vi-VN\n\nBản toàn văn. Thẻ mark chỉ để nhìn nhanh, không thuộc nội dung chính sách.\n\n## Chứng nhận thương hiệu là gì?\n\nChứng nhận thương hiệu giúp đảm bảo rằng các sản phẩm có thương hiệu bạn bán trên TikTok Shop là hàng chính hãng và được ủy quyền hợp pháp. Chứng nhận này áp dụng với chủ sở hữu nhãn hiệu, người bán được ủy quyền hoặc người bán có chứng từ mua hàng đối với các sản phẩm có thương hiệu. Người bán có trách nhiệm tuân thủ tất cả các quyền sở hữu trí tuệ. Chứng nhận thương hiệu không miễn trừ trách nhiệm của bạn nếu bạn thực sự vi phạm quyền sở hữu trí tuệ.\n\n## Chứng nhận thương hiệu có những loại nào?\n\nBạn có thể đăng ký Chứng nhận thương hiệu thuộc một trong những loại sau:\n\n- **Chủ sở hữu nhãn hiệu:** Bạn là chủ sở hữu nhãn hiệu đã đăng ký.\n- **Người bán đạt chuẩn cấp 1 độc quyền toàn quốc:** Bạn có quyền phân phối độc quyền – do chủ sở hữu nhãn hiệu cấp trực tiếp.\n- **Người bán đạt chuẩn cấp 1:** Bạn được chủ sở hữu nhãn hiệu ủy quyền trực tiếp để bán sản phẩm của họ.\n- **Người bán đạt chuẩn cấp 2:** Bạn được Người bán đạt chuẩn cấp 1 ủy quyền.\n- **Người bán đạt chuẩn cấp 3:** Bạn được Người bán đạt chuẩn cấp 2 ủy quyền.\n- **Người bán có bằng chứng mua hàng (chỉ áp dụng với một số người bán nhất định):** Bạn có thể cung cấp hóa đơn hoặc biên lai hợp lệ đối với các sản phẩm mua trực tiếp từ chủ sở hữu nhãn hiệu hoặc người bán được ủy quyền.\n\n\u003cmark>**Lưu ý:** Nếu bạn đăng ký là **Người bán cá nhân**, có thể bạn sẽ không được phép bán một số thương hiệu nhất định trên TikTok Shop. Để bán các thương hiệu này, bạn cần đăng ký làm **Người bán doanh nghiệp** và được phê duyệt **Chứng nhận thương hiệu**.\u003c/mark>\n\n## Các loại giấy tờ được yêu cầu theo Loại chứng nhận\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/3527f7f8691b48409c74f7b248c01ce0~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2076659075&x-signature=l04sZzbMsF8khNsDnmazhhRkm3c%3D)\n\n### Chủ sở hữu nhãn hiệu\n\n- \u003cmark>Giấy chứng nhận nhãn hiệu chính thức\u003c/mark>\n- \u003cmark>Bạn chỉ có thể đăng ký một tài khoản người bán làm chủ sở hữu nhãn hiệu. Hãy đảm bảo rằng bạn nộp hồ sơ bằng tài khoản người bán chính xác.\u003c/mark>\n\n### Người bán đạt chuẩn cấp 1 độc quyền toàn quốc\n\n\u003cmark>Thư ủy quyền (LOA) hoặc thư phân phối đáp ứng tất cả các yêu cầu sau:\u003c/mark>\n\n- \u003cmark>Được cấp trực tiếp bởi chủ sở hữu thương hiệu\u003c/mark>\n- \u003cmark>Gửi tới Tên công ty hoặc Tên cá nhân của bạn (theo thông tin trong Trung tâm nhà bán hàng > Hồ sơ người bán > Thông tin doanh nghiệp)\u003c/mark>\n- \u003cmark>Ghi rõ tên thương hiệu (phải trùng khớp với thương hiệu bạn đăng ký)\u003c/mark>\n- \u003cmark>Nêu rõ thời hạn hiệu lực\u003c/mark>\n- \u003cmark>Có chữ ký hoặc lời chứng thực của chủ sở hữu thương hiệu hoặc người được ủy quyền, bao gồm họ, tên và chức vụ\u003c/mark>\n- \u003cmark>Nêu rõ điều khoản phân phối độc quyền\u003c/mark>\n- \u003cmark>Phải xác thực và hợp lệ\u003c/mark>\n\n### Người bán đạt chuẩn cấp 1\n\nThư ủy quyền (LOA) hoặc thư phân phối đáp ứng tất cả các yêu cầu sau:\n\n- Được cấp trực tiếp bởi chủ sở hữu thương hiệu\n- Gửi tới Tên công ty hoặc Tên cá nhân của bạn (theo thông tin trong Trung tâm nhà bán hàng > Hồ sơ người bán > Thông tin doanh nghiệp)\n- Ghi rõ tên thương hiệu (phải trùng khớp với thương hiệu bạn đăng ký)\n- Nêu rõ thời hạn hiệu lực\n- Có chữ ký hoặc lời chứng thực của chủ sở hữu thương hiệu hoặc người được ủy quyền, bao gồm họ, tên và chức vụ\n- Phải xác thực và hợp lệ\n\n### Người bán đạt chuẩn cấp 2\n\n\u003cmark>Thư ủy quyền (LOA) hoặc thư phân phối (do Người bán đạt chuẩn cấp 1 cấp trực tiếp cho bạn) đáp ứng các yêu cầu sau:\u003c/mark>\n\n- \u003cmark>Được cấp bởi một bên được thương hiệu ủy quyền\u003c/mark>\n- \u003cmark>Đi kèm với tài liệu bổ sung chứng minh rằng bên này được chủ sở hữu thương hiệu cho phép ủy quyền cho những người bán khác\u003c/mark>\n- Gửi tới Tên công ty hoặc Tên cá nhân của bạn (theo thông tin trong Trung tâm nhà bán hàng > Hồ sơ người bán > Thông tin doanh nghiệp)\n- Ghi rõ tên thương hiệu (phải trùng khớp với thương hiệu bạn đăng ký)\n- Nêu rõ thời hạn hiệu lực\n- Có chữ ký hoặc lời chứng thực của chủ sở hữu thương hiệu hoặc người được ủy quyền, bao gồm họ, tên và chức vụ\n- Phải xác thực và hợp lệ\n- \u003cmark>Không bắt buộc: gửi thư ủy quyền hoặc thư phân phối do Chủ sở hữu nhãn hiệu cấp trực tiếp cho Người bán được ủy quyền cấp 1\u003c/mark>\n\n### Người bán đạt chuẩn cấp 3\n\n\u003cmark>Thư ủy quyền (LOA) hoặc thư phân phối (do Người bán đạt chuẩn cấp 2 cấp trực tiếp cho bạn) đáp ứng các yêu cầu sau:\u003c/mark>\n\n- Được cấp bởi một bên được thương hiệu ủy quyền\n- Đi kèm với tài liệu bổ sung chứng minh rằng bên này được chủ sở hữu thương hiệu cho phép ủy quyền cho những người bán khác\n- Gửi tới Tên công ty hoặc Tên cá nhân của bạn (theo thông tin trong Trung tâm nhà bán hàng > Hồ sơ người bán > Thông tin doanh nghiệp)\n- Ghi rõ tên thương hiệu (phải trùng khớp với thương hiệu bạn đăng ký)\n- Nêu rõ thời hạn hiệu lực\n- Có chữ ký hoặc lời chứng thực của chủ sở hữu thương hiệu hoặc người được ủy quyền, bao gồm họ, tên và chức vụ\n- Là ủy quyền xác thực và hợp lệ\n- \u003cmark>Không bắt buộc: thư ủy quyền hoặc thư phân phối do Chủ sở hữu nhãn hiệu cấp trực tiếp cho Người bán được ủy quyền cấp 1\u003c/mark>\n\n### Người bán có bằng chứng mua hàng\n\n\u003cmark>Hóa đơn hoặc biên lai được xuất trong vòng 12 tháng gần nhất, trong đó có chứa các thông tin sau:\u003c/mark>\n\n- \u003cmark>Ngày mua hàng, tên nhà cung cấp, tên người mua, thương hiệu sản phẩm, thông tin chi tiết về sản phẩm, số lượng mua và mức giá\u003c/mark>\n- \u003cmark>Nếu bạn không thể tiết lộ giá sản phẩm do ràng buộc bởi hợp đồng bảo mật, vui lòng gửi kèm bản sao hợp đồng đó trong hồ sơ đăng ký.\u003c/mark>\n\nTài liệu bổ sung cần gửi:\n\n- \u003cmark>Nếu bằng chứng mua hàng không được cấp bởi chủ sở hữu thương hiệu, hãy cung cấp giấy tờ hoặc ảnh chụp màn hình từ trang web chính thức (có kèm liên kết URL) để chứng minh rằng nhà cung cấp là nhà phân phối được ủy quyền của thương hiệu\u003c/mark>\n- \u003cmark>Hình ảnh hàng tồn kho\u003c/mark>\n- \u003cmark>Hình ảnh sản phẩm thực tế (gồm cả bao bì) chụp từ 6 góc độ khác nhau\u003c/mark>\n\n## Cách gửi Chứng nhận thương hiệu\n\n### Bước 1 – Đăng nhập vào Trung tâm nhà bán hàng\n\n- Đăng nhập vào tài khoản người bán của bạn và gửi chứng nhận thương hiệu bằng cách đi đến Tài khoản của tôi > Cài đặt tài khoản > Trung tâm chứng nhận > Chứng nhận thương hiệu > Thêm chứng nhận thương hiệu\n\n    ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/f32bda87f6c64a64ad3870f282002158~tplv-nk3i2mqmvs-image.gif?lk3s=5d1a069b&x-expires=2076659002&x-signature=4kzSsT2nIHK9Bz9lK62LF5Op01Y%3D)\n\n### Bước 2 – Chọn Loại chứng nhận\n\nChọn loại chứng nhận phù hợp (ví dụ: Chủ sở hữu nhãn hiệu, Người bán đạt chuẩn cấp 1, v.v.).\n\n### Bước 3 – Điền thông tin nhãn hiệu/chứng nhận\n\nHoàn thành tất cả các trường bắt buộc.\n\n### Bước 4 – Chọn Trạng thái ủy quyền của bạn\n\nBước này áp dụng cho những người không phải là Chủ sở hữu Nhãn hiệu.\n\n| Tình huống | Tuỳ chọn |\n| --- | --- |\n|\u003cmark> Bạn có văn bản ủy quyền từ chủ sở hữu nhãn hiệu \u003c/mark>|\u003cmark> Chọn -> Tôi có văn bản ủy quyền \u003c/mark>|\n|\u003cmark> Bạn không có văn bản ủy quyền từ chủ sở hữu nhãn hiệu, nhưng chủ sở hữu nhãn hiệu đã cấp cho bạn ủy quyền thông qua các phương tiện khác. \u003c/mark>|\u003cmark> Chọn -> Tôi không có văn bản ủy quyền \u003c/mark>|\n|\u003cmark> Bạn chưa nhận được ủy quyền từ chủ sở hữu nhãn hiệu. \u003c/mark>|\u003cmark> Chưa nộp biểu mẫu. Hãy xin ủy quyền từ chủ sở hữu nhãn hiệu trước. \u003c/mark>|\n\n### Bước 5 - Tải lên tài liệu hỗ trợ\n\nĐính kèm các tài liệu cần thiết cho loại đủ điều kiện của bạn.\n\n\u003cmark>**Lưu ý**: Các tài liệu được nộp có thể được chia sẻ với chủ sở hữu quyền hoặc các nhà cung cấp được chứng nhận để phục vụ mục đích xác minh bổ sung. Việc cung cấp tài liệu đã bị chỉnh sửa hoặc giả mạo bị nghiêm cấm và có thể dẫn đến các biện pháp xử lý đối với tài khoản của bạn.\u003c/mark>\n\n### Bước 6 - Theo dõi trạng thái của bạn\n\n\u003cmark>Thời gian xử lý có thể mất đến 7 ngày dương lịch. Bạn có thể theo dõi trạng thái của mình tại trung tâm Chứng nhận thương hiệu và nộp lại đơn đăng ký nếu cần.\u003c/mark>\n\n## Hướng dẫn bổ sung về quá trình nộp hồ sơ Chứng nhận thương hiệu\n\n- **Tên nhãn hiệu**\n    -   Nhập chính xác tên đã đăng ký, bao gồm tất cả các số, chữ cái, ký tự đặc biệt (bao gồm cả dấu cách).\n    -   Nếu nhãn hiệu chỉ bao gồm logo, hãy nhập tên thương hiệu.\n- **Số đăng ký**:\n    -   \u003cmark>Nhập số đăng ký được ghi trên giấy chứng nhận nhãn hiệu (không phải mã số hồ sơ đăng ký).\u003c/mark>\n- **Tên thương hiệu**\n    -   Viết đúng chính tả và kiểu chữ chính thức của thương hiệu (chữ hoa/chữ thường như công ty sử dụng).\n    -   Phải trùng khớp với **trang web chính thức, nhãn hiệu đã đăng ký hoặc bao bì sản phẩm** của thương hiệu.\n    -   \u003cmark>Giới hạn ký tự: 2 – 30 ký tự chữ và số.\u003c/mark>\n    -   Ngôn ngữ: Tên thương hiệu có thể ở bất kỳ ngôn ngữ nào.\n    -   **❌ Không được cho phép:**\n        -   \u003cmark>Biểu tượng (ví dụ: ®, ™, ©)\u003c/mark>\n        -   \u003cmark>Siêu liên kết hoặc tên miền (ví dụ: .com, .cn, .net, .org, v.v., www., http:)\u003c/mark>\n        -   \u003cmark>Địa chỉ email (ví dụ: [gmail.com](http://gmail.com), [outlook.com](http://outlook.com))\u003c/mark>\n        -   \u003cmark>Cụm từ quảng cáo (ví dụ: \"ưu đãi tốt nhất\", \"miễn phí vận chuyển\")\u003c/mark>\n        -   \u003cmark>Không được phép chỉ bao gồm toàn ký tự đặc biệt (ví dụ: \"&/$\\*%#+\") hoặc chuỗi số dài hơn 5 chữ số liên tiếp (ví dụ: \"111111\").\u003c/mark>\n            -   \u003cmark>Tên thương hiệu phải bao gồm ít nhất một ký tự chữ và số (ví dụ: su:m37°, 7-Eleven, & Other Stories).\u003c/mark>\n- **Danh mục**\n    -   Thông tin này tức là Bảng phân loại Nice về hàng hóa và dịch vụ mà nhãn hiệu đăng ký.\n    -   \u003cmark>Chúng tôi chấp nhận tất cả các nhãn hiệu thuộc cấp độ 1 – 35.\u003c/mark>\n\n## Câu hỏi thường gặp (FAQ)\n\n### Tôi có thể tìm thấy thông tin nhãn hiệu ở đâu?\n\nBạn có thể xác minh thông tin nhãn hiệu thông qua **Cơ sở dữ liệu thương hiệu toàn cầu của WIPO.**\n\n- Tìm kiếm theo **tên thương hiệu**, **chủ sở hữu** hoặc **số đăng ký**.\n- Áp dụng bộ lọc theo:\n    -   **Trạng thái:** Đã đăng ký\n    -   **Quốc gia đích đến**\n    -   **Phân loại Nice:** Chọn danh mục phù hợp với sản phẩm của bạn.\n\n        ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/c2eb64f4380b4fe4ba9f0f7c0d0e3b9a~tplv-nk3i2mqmvs-image.gif?lk3s=5d1a069b&x-expires=2076659003&x-signature=bLbmwTWGHyobQxHZ8jL7eqt2iWA%3D)\n\n### Tôi có thể thay đổi tên thương hiệu sau khi Chứng nhận thương hiệu được phê duyệt không?\n\n\u003cmark>Không. Sau khi hồ sơ đăng ký của bạn được phê duyệt, tên thương hiệu sẽ là tên chính thức và bạn không thể thay đổi.\u003c/mark>\n\n### Tại sao hồ sơ đăng ký Chứng nhận thương hiệu của tôi bị từ chối?\n\nHồ sơ đăng ký của bạn có thể bị từ chối nếu thông tin hoặc giấy tờ bạn cung cấp không đáp ứng yêu cầu của TikTok Shop. Hãy tham khảo [bài viết này](https://seller-vn.tiktok.com/university/essay?identity=1&role=1&knowledge_id=4705417410807554&from=policy) để biết thêm thông tin chi tiết.\n","# Tính Năng Người Bán Tự Vận Chuyển (Seller Own Fleet - SOF) Trên TikTok Shop\n\n- Ngày trên bài nguồn: 10/06/2025\n- knowledge_id: 7575204750444289\n- Nguồn: https://seller-vn.tiktok.com/university/essay?knowledge_id=7575204750444289&role=1&course_type=1&from=search&identity=1&lang=vi-VN\n\nBản toàn văn. Thẻ mark chỉ để nhìn nhanh, không thuộc nội dung chính sách.\n\n## Tính năng Người bán tự vận chuyển (Seller Own Fleet - SOF) là gì?\n\n**Tính năng Người bán tự vận chuyển (SOF)** là hình thức cho phép người bán tự vận chuyển và gửi sản phẩm cho người mua thông qua nhân lực giao hàng riêng của mình.\n\n|  |  | Dịch vụ vận chuyển của nền tảng TikTok Shop | Người bán tự vận chuyển (Seller Own Fleet - SOF) |\n| --- | --- | --- | --- |\n| 1 | Sắp xếp vận chuyển | Nhà bán hàng có thể lựa chọn dịch vụ lấy hàng/gửi tại bưu cục sao cho thuận tiện với mình | Nhà bán hàng phải sắp xếp vận chuyển một cách độc lập |\n| 2 | Số theo dõi | Được tạo tự động thông qua nhà cung cấp dịch vụ kho vận của Nền tảng | Phải được nhập thủ công bởi Nhà bán hàng |\n| 3 | Nhãn vận chuyển | Có thể được in qua TikTok | Không thể in qua TikTok |\n| 4 | Chi tiết theo dõi | Được hiển thị trên TikTok | Không có chi tiết theo dõi cho đơn hàng SOF |\n| 5 | Trạng thái Đã giao | Hệ thống dịch vụ kho vận sẽ tự động phản ánh | Phải tự cập nhật trạng thái giao hàng của đơn hàng và tải lên POD của đơn hàng |\n| 6 | Tính phí vận chuyển | Hệ thống tự động tính | Được tính thủ công theo mẫu vận chuyển đã nhập |\n| 7 | COD | Có hỗ trợ | Không hỗ trợ |\n\n## Tính năng Người bán tự vận chuyển (SOF) có những điều kiện gì?\n\n**Nhà bán hàng có thể sử dụng SOF, miễn là bạn có lý do chính đáng, bao gồm nhưng không giới hạn ở:**\n\n1.  Hàng hoá cần lắp đặt (máy lạnh, quạt trần)\n2.  Hàng hóa cần xử lý đặc biệt ở một mức độ nhất định (các sản phẩm nhạy cảm với nhiệt độ như hoa, sô-cô-la, rau củ, v.v.)\n3.  Hàng hóa nguy hiểm như pin, bật lửa (nên bao gồm nhưng không giới hạn những mặt hàng này)\n4.  Hàng hóa cồng kềnh hoặc nặng (tùy vào trọng lượng và kích thước)\n\n**Nếu bạn không đáp ứng các tiêu chí này, vui lòng sử dụng dịch vụ vận chuyển của Nền tảng để thay thế.**\n\nĐối với những nhà bán hàng đã được chọn sử dụng SOF, vui lòng đảm bảo bạn duy trì tiêu chuẩn dịch vụ ở mức cao, bao gồm:\n\n5.  Khối lượng đơn hàng nhất quán cho Đơn hàng SOF.\n6.  Duy trì mức đánh giá vận chuyển thấp liên quan đến cửa hàng ở mức thấp.\n7.  Tỷ lệ trả hàng do lỗi của nhà bán hàng và tỷ lệ tranh chấp do SOF ở mức thấp.\n8.  Có các giấy tờ vận chuyển phù hợp cho SOF, chẳng hạn như bảng kê khai nhận hàng và bằng chứng giao hàng, có thể được gửi trong trường hợp có bất kỳ tranh chấp nào về lô hàng.\n\nNếu không, có thể dẫn đến việc SOF bị gỡ bỏ.\n\n\u003cmark>**Vào thứ Hai đầu tiên trong tháng mới, nhà bán hàng sẽ được đánh giá dựa trên các đơn hàng SOF được tạo trong tháng trước. Nhà bán hàng bị gắn cờ hai lần liên tiếp sẽ bị thu hồi.**\u003c/mark>\n\n## Trách nhiệm của nhà bán hàng khi sử dụng tính năng Người bán tự vận chuyển (SOF)\n\nNhà bán hàng có tùy chọn giao hàng SOF phải đảm nhận các trách nhiệm sau đây và cung cấp trải nghiệm tốt nhất cho khách hàng:\n\n1.  Nhà bán hàng không được phép giao các mặt hàng được cấu hình theo các phương thức giao hàng khác nhau (nếu đơn hàng có một mặt hàng được cấu hình cho kho vận của nền tảng và một mặt hàng khác được cấu hình cho SOF, thì nhà bán hàng phải vận chuyển chúng theo các phương thức giao hàng tương ứng).\n2.  \u003cmark>Các sản phẩm được cấu hình là thanh toán khi giao hàng (COD) sẽ không đủ điều kiện cho SOF.\u003c/mark>\n3.  Nhà bán hàng phải đảm bảo số theo dõi đơn hàng và trạng thái đơn hàng được cập nhật chính xác.\n4.  Nhà bán hàng nên cập nhật trạng thái đơn hàng một cách chính xác, không chậm trễ.\n\n> \u003cmark>Nhà bán hàng chỉ có thể cập nhật trạng thái đơn hàng từ “Đã vận chuyển” thành “Đã giao”/“Giao hàng thất bại” sau 24 giờ (tính từ thời điểm đơn hàng được cập nhật thành “Đã vận chuyển”)\u003c/mark>\n\n5.  \u003cmark>Nhà bán hàng cần giữ bản sao Bằng chứng giao hàng (POD) trong ít nhất một năm và xuất trình theo yêu cầu của TikTok Shop bất cứ khi nào có tranh chấp.\u003c/mark>\n6.  Nhà bán hàng **nên thử giao hàng ít nhất hai lần** trước khi đánh dấu đơn hàng là “Giao hàng thất bại”.\n7.  \u003cmark>Nhà bán hàng sẽ không được thanh toán nếu trạng thái đơn hàng không có trạng thái “Đã giao”.\u003c/mark> Sẽ không có thay đổi về điều khoản thanh toán đối với hình thức giao hàng SOF.\n8.  \u003cmark>Trong trường hợp trả hàng sau khi giao, nhà bán hàng chịu trách nhiệm xử lý việc trả hàng và sắp xếp để thu gom mặt hàng trong vòng 48 giờ theo [Hướng dẫn hủy đơn hàng, trả hàng và hoàn tiền cho khách hàng của TikTok Shop](https://seller-id.tiktok.com/university/article?knowledge_id=10000852), yêu cầu hoàn tiền sẽ tự động được phê duyệt.\u003c/mark>\n9.  Đối với các trường hợp trả hàng, tất cả các chi phí liên quan, bao gồm nhưng không giới hạn ở chi phí vận chuyển, sẽ do nhà bán hàng hoặc khách hàng chịu theo thỏa thuận mà không có sự can thiệp của TikTok Shop.\n10.  TikTok Shop có quyền thu hồi tính năng Nhà bán hàng tự vận chuyển nếu họ bị phát hiện vi phạm [Điều khoản dịch vụ dành cho nhà bán hàng của TikTok Shop](https://seller-id.tiktok.com/university/article/agreement?knowledge_id=10001020) hoặc rơi vào bất kỳ trường hợp nào được mô tả trong **Phần 3**.\n11.  TikTok Shop sẽ không chịu trách nhiệm nếu đơn hàng được giao sau khi trạng thái được cập nhật thành “Đã hủy”.\n12.  \u003cmark>TikTok Shop sẽ hủy đơn hàng vào **ngày thứ 13 (kể từ ngày đơn hàng được thanh toán)** nếu đơn hàng chưa cập nhật trạng thái thành “Đã giao”.\u003c/mark>\n\n## Hướng dẫn tính năng Người bán tự vận chuyển (SOF)\n\n### Bước 1: Bật “Giao hàng bởi người bán” trong mục Tùy chọn vận chuyển\n\nSau khi cửa hàng của bạn đã được bật SOF, tùy chọn “**Giao hàng bởi người bán**” sẽ xuất hiện trong phần Tùy chọn vận chuyển của bạn.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/47f4ce07282945e8819141598e564e09~tplv-nk3i2mqmvs-image.jpeg?lk3s=5d1a069b&x-expires=2064901584&x-signature=1xnSpVnvxFYKZAY2NlSNDg9ftiU%3D)\n\n### Bước 2: Cài đặt mẫu phí vận chuyển\n\nBạn có thể cài đặt khu vực giao hàng và phí vận chuyển trong mẫu phí vận chuyển. Chỉ có thể sử dụng tùy chọn do người bán vận chuyển khi thiết lập mẫu phí vận chuyển.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/cb723446eef14a43bf72409d073668d2~tplv-nk3i2mqmvs-image.jpeg?lk3s=5d1a069b&x-expires=2064901586&x-signature=KKORT%2FcRHahuS8ffpkvx9jpVpT8%3D)\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/6a4d2f0fb85d4599b1dd891259bcbba6~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2064901585&x-signature=NXKQ5xuqXiKhdLAFfWSWa%2BcaSVI%3D)\n\n**Bước cài đặt mẫu:**\n\n1.  Vui lòng chọn khu vực mà đội ngũ riêng của bạn không thể giao đơn hàng.\n\n    ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/ff9aa2b3698746ada8db6a7811179730~tplv-nk3i2mqmvs-image.jpeg?lk3s=5d1a069b&x-expires=2064901583&x-signature=NBGZbblmi6AcovMCtnhl142fTog%3D)\n\n2.  Để cài đặt Khu vực giao hàng và chọn khu vực mà đội ngũ riêng của bạn có thể giao đơn hàng. Sau đó, vui lòng chèn thủ công các quy tắc vận chuyển của khu vực này:\n\n- Phạm vi trọng lượng\n- Chi phí vận chuyển cho trọng lượng\n\n\u003cmark>Lưu ý: Cần đặt tối thiểu 0-30kg, không giới hạn trọng lượng tối đa. Nếu đơn hàng thực tế của khách hàng vượt quá trọng lượng tối đa, khách hàng sẽ thanh toán phí vận chuyển theo trọng lượng tối đa.\u003c/mark>\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/15f5dcb714954a9e88e9dd0e0c46a4ff~tplv-nk3i2mqmvs-image.jpeg?lk3s=5d1a069b&x-expires=2064901583&x-signature=k2tu9z7mLxSxg7vwWSEWOC7%2Bg3o%3D)\n\n3.  Các khu vực bạn chưa chọn sẽ được hiển thị trong các khu vực chưa được chỉ định, sau đó bạn có thể di chuyển đến các khu vực bị loại trừ hoặc khu vực giao hàng.\n\n    ![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/ca53c0d9d48246a6b5220a1045cc8f8a~tplv-nk3i2mqmvs-image.jpeg?lk3s=5d1a069b&x-expires=2064901583&x-signature=7LsIeRHGtmU2OCYh5DYfIKm%2F%2FZQ%3D)\n\nNhấp vào Gửi và xác nhận để lưu mẫu phí vận chuyển. Phí vận chuyển của đơn hàng SOF từ cửa hàng của bạn sẽ được tính theo số liệu bạn nhập thủ công vào mẫu phí vận chuyển.\n\n### Bước 3: Tùy chỉnh dịch vụ giao sản phẩm của bạn thành Người bán tự vận chuyển (SOF)\n\nSau khi Mẫu vận chuyển SOF của bạn được đặt thành công, các sản phẩm trong cửa hàng của bạn, theo mặc định tuân theo cài đặt vận chuyển của cửa hàng, sẽ được bật để có tùy chọn SOF.\n\nNếu bạn muốn một số sản phẩm cụ thể chỉ được giao bởi SOF, vui lòng tìm những sản phẩm đó và chỉnh tùy chọn giao hàng thành chỉ “do người bán vận chuyển” trên trang chỉnh sửa sản phẩm.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/311aef6c15d54458b9d75498ca394d83~tplv-nk3i2mqmvs-image.jpeg?lk3s=5d1a069b&x-expires=2064901583&x-signature=TFSgIiFto8ARzNLsTiOTbX8Cdaw%3D)\n\nNhấp vào Cập nhật.\n\n### Bước 4: Vận chuyển đơn hàng Người bán tự vận chuyển (SOF)\n\nLọc bỏ các đơn hàng “do người bán vận chuyển”, sau đó nhấp vào “Đánh dấu là đã vận chuyển”, vui lòng tải ID theo dõi lên theo cách thủ công và kiểm tra thông tin liên quan đến hóa đơn, đồng thời xác nhận kiện hàng.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/ef0aa9c550e649e8a60d5bb46a7056f7~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2064901585&x-signature=UuzRkNaGOmrJ%2BgStgoVBp5%2FhEJk%3D)\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/06d80ad3470e4712b1d61f4a88f0176c~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2064901583&x-signature=YKuQ%2Fe5QAKaR9Qbxh3yTUkzz%2BMM%3D)\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/d55d6ba32fe04bd6b1d6ace47c6ffc51~tplv-nk3i2mqmvs-image.jpeg?lk3s=5d1a069b&x-expires=2064901585&x-signature=poBBSb0x9R6w3Kmrm1%2BvZCQRwDc%3D)\n\n\u003cmark>Sau khi được đánh dấu là đã vận chuyển, đơn hàng chỉ có thể được đánh dấu là đã giao sau 24 giờ.\u003c/mark>\n\n\u003cmark>Sau khi đơn hàng được vận chuyển, bạn vẫn có thể cập nhật số theo dõi trong vòng 36 giờ.\u003c/mark>\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/20366efb70c94487a1ca071170b78690~tplv-nk3i2mqmvs-image.jpeg?lk3s=5d1a069b&x-expires=2064901583&x-signature=IwmeIXYvkHWJv2ruFcOl3HG6ODw%3D)\n\n\u003cmark>24 giờ sau khi đơn hàng được đánh dấu là đã vận chuyển, đơn hàng sẽ hiển thị nút “Cập nhật trạng thái giao hàng”. Vui lòng nhấp và chọn trạng thái giao hàng, sau đó tải lên tập tin đính kèm như bảng kê khai nhận hàng và bằng chứng giao hàng. Tập tin này có thể được gửi trong trường hợp có bất kỳ tranh chấp nào về lô hàng.\u003c/mark>\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/29725d78be2e41549acc575366c5cfb9~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2064901584&x-signature=bQp%2BBh6WwiNdgH9i12inuReSrg4%3D)\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/66b57a0ec3074bf2a28979c636020d2e~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2064901584&x-signature=q7AgNq8O854SGguOBzrUehBczmU%3D)\n\nNhấp vào xác nhận, khi đó trạng thái đơn hàng sẽ chuyển thành “đã giao”. Bạn có thể kiểm tra lịch sử qua “Xem thông tin kho vận”.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/90e241fd774848c8ba37b3d04d802cca~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2064901585&x-signature=32Qx9MPfgwmwQ7i55qbdBk2nalI%3D)\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/46155f25bfc64108af5365704f48df8b~tplv-nk3i2mqmvs-image.jpeg?lk3s=5d1a069b&x-expires=2064901584&x-signature=vjYFws3ns1rIlRdzc5hRDfsQD%2Bw%3D)\n\nNếu giao hàng không thành công, vui lòng chọn “Giao hàng thất bại”, sau đó chọn lý do, khi đó trạng thái đơn hàng sẽ chuyển thành “Đã hủy”.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/977aac4d83f344c1939a7bc7a623afd5~tplv-nk3i2mqmvs-image.jpeg?lk3s=5d1a069b&x-expires=2064901585&x-signature=Cg399icU9lxFRt6%2BwGjbVR00sDY%3D)\n\n### Bước 5: Vận chuyển hàng loạt đơn hàng SOF\n\nChọn tùy chọn giao hàng “Do người bán vận chuyển”, sau đó chọn các kiện hàng cần được vận chuyển.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/5962ccefdb084318b959f94f70fb4380~tplv-nk3i2mqmvs-image.jpeg?lk3s=5d1a069b&x-expires=2064901583&x-signature=INP7aw0iPaHfenJ5oC1lwDDLiBg%3D)\n\nTải xuống mẫu và nhập thông tin nhà cung cấp dịch vụ vận chuyển, ID theo dõi và Số hóa đơn, sau đó tải trạng thái giao hàng lên.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/7a2e609e188f4d8e9f5a0ef96fa789b5~tplv-nk3i2mqmvs-image.jpeg?lk3s=5d1a069b&x-expires=2064901583&x-signature=bQhj2nbdodu80muiH3IXbiNGMH4%3D)\n\nTab “Cập nhật trạng thái giao hàng” chỉ dành cho các đơn hàng SOF. vui lòng chọn các kiện hàng, sau đó tải mẫu xuống.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/a2caf946c88249b783c2ba8ebf339bbe~tplv-nk3i2mqmvs-image.jpeg?lk3s=5d1a069b&x-expires=2064901584&x-signature=qdfST8LzxXOnRUdXt1z8uu8h7iM%3D)\n\nSau khi bạn đã nhập kết quả giao hàng. Vui lòng tải tập tin lên.\n\n## Tùy chọn Người bán tự vận chuyển (SOF) sẽ được hiển thị như thế nào ở phía người mua?\n\nKhi người mua xem và mua trên TikTok Shop, thông tin vận chuyển của sản phẩm sẽ được hiển thị là “do người bán vận chuyển”.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/692f53b4d9804a64bf7abd1618e9b556~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2064901584&x-signature=UMJuveyE1PwcZzYSGZTNvBhfyMU%3D)\n\nSau khi đặt hàng, người mua có thể nhìn thấy tùy chọn giao hàng “do người bán vận chuyển”. Sau khi nhà bán hàng hoàn thiện đơn hàng, người mua chỉ có thể nhìn thấy trạng thái “đã có thể vận chuyển” và “đã giao” trong chi tiết theo dõi.\n\n![](https://p16-oec-university-sign-sg.ibyteimg.com/tos-alisg-i-nk3i2mqmvs-sg/1d494aab1fe541d5b8ddcbade7b85dce~tplv-nk3i2mqmvs-image.png?lk3s=5d1a069b&x-expires=2064901583&x-signature=V%2FN0kBjL33gxWUQWvdEhbZ3VfKU%3D)\n","# Sản phẩm dành cho Nhà bán hàng được mời\n\n- Ngày trên bài nguồn: 04/08/2026\n- knowledge_id: 7179954358519569\n- Nguồn: https://seller-vn.tiktok.com/university/essay?knowledge_id=7179954358519569&role=1&course_type=1&from=search&identity=1&lang=vi-VN\n\nBản toàn văn. Thẻ mark chỉ để nhìn nhanh, không thuộc nội dung chính sách.\n\n## Sản phẩm \"Chỉ dành cho nhà bán hàng được mời\" là gì?\n\n\u003cmark>Sản phẩm Chỉ dành cho nhà bán hàng được mời là những sản phẩm mà bạn chỉ có thể bán nếu bạn đã tham gia thông qua quy trình \"chỉ dành cho nhà bán hàng được mời\", quy trình này yêu cầu gửi tài liệu bắt buộc có liên quan thông qua Trung tâm người bán như sau: Tài khoản của tôi > Cài đặt tài khoản > Trung tâm chứng nhận\u003c/mark>\n\n## Sách, báo và tạp chí\n\n- Nghệ thuật, Sách dành cho trẻ sơ sinh, Tiểu sử, Lịch, Sách dạy nấu ăn, Truyện tranh, Từ điển, Giáo dục, Giải trí, Viễn Tưởng, Thể dục thể thao, Lịch sử, Luật, Đời sống, Văn học, Y tế, Sách dành cho các bậc cha mẹ, Chuyên ngành, Công nghệ, Sách dành cho thanh thiếu niên, Sách giáo khoa, Sách dành cho trẻ tập đi, Du lịch, Sách phát triển bản thân, Khoa học viễn tưởng, Thể thao, Xã hội, Nghiên cứu và Khoa học\n\n- Kinh doanh, Thời trang, Phong cách sống và Thanh thiếu niên\n\n- **Sách –** Bạn chỉ có thể đăng ký bán các danh mục sách sau đây:\n\n- **Báo và Tạp chí** – Bạn chỉ có thể đăng ký bán các danh mục tạp chí và báo sau đây:\n\n## Kính áp tròng\n\nBạn sẽ phải nộp các tài liệu sau đây khi đăng ký bán kính áp tròng.\n\n**❗ Tài liệu được yêu cầu**\n\n- \u003cmark>Tuyên bố đủ điều kiện bán trang thiết bị y tế\u003c/mark>\n- \u003cmark>Công bố chứng nhận trang thiết bị y tế\u003c/mark>\n- \u003cmark>Kết quả phân loại trang thiết bị y tế\u003c/mark>\n\n## Hoa tươi\n\n\u003cmark>Bạn chỉ có thể bán hoa tươi nếu bạn có thể thực hiện đơn hàng bằng chức năng \"Người bán tự vận chuyển bằng phương tiện riêng\".\u003c/mark>\n\n## Thực phẩm tươi và thực phẩm đông lạnh có hạn chế về kho vận\n\n\u003cmark>Bạn chỉ có thể bán các loại thực phẩm tươi và đông lạnh sau đây sau khi gửi tài liệu có liên quan trong Trung tâm chứng nhận:\u003c/mark>\n\n- Kem. Bao gồm nhưng không giới hạn ở kem dùng để làm bánh, kem tươi, kem sữa béo, kem chua, kem bông tuyết, kem nấu và kem loãng.\n- Tất cả các thực phẩm tươi và đông lạnh khác. Phạm vi này bao gồm nhưng không giới hạn ở bánh mì, bánh ngọt và bánh nướng, trứng, thực phẩm đông lạnh, trái cây, kem, đồ ăn sơ chế sẵn, thịt, nấm, bánh bột nhào, thịt và hải sản đã qua chế biến, đậu phụ, rau và các sản phẩm chay thay thế thịt.\n\n**❗ Tài liệu được yêu cầu**\n\n\u003cmark>Ít nhất **một** trong các tài liệu sau đây:\u003c/mark>\n\n- \u003cmark>Giấy Chứng Nhận Cơ Sở Đủ Điều Kiện An Toàn Thực Phẩm **HOẶC**\u003c/mark>\n- \u003cmark>Giấy chứng nhận OCOP từ 3 sao trở lên **HOẶC**\u003c/mark>\n- \u003cmark>Giấy chứng nhận đạt tiêu chuẩn Vietgap **HOẶC**\u003c/mark>\n- \u003cmark>Bản cam kết sản xuất, kinh doanh thực phẩm (nông lâm thủy sản) an toàn **HOẶC**\u003c/mark>\n- \u003cmark>Giấy chứng nhận HACCP **HOẶC**\u003c/mark>\n- \u003cmark>Giấy chứng nhận ISO 22000\u003c/mark>\n\n## Đồ trang sức và phụ kiện\n\n- Danh mục này bao gồm đồ trang sức hoặc phụ kiện có chứa đá quý (chẳng hạn như hồng ngọc, ngọc bích và ngọc lục bảo) hoặc kim loại quý (chẳng hạn như vàng, bạc, bạch kim và palađi).\n\n**❗ Tài liệu được yêu cầu**\n\n- \u003cmark>Giấy phép kinh doanh thể hiện rằng bạn đủ điều kiện kinh doanh đồ trang sức\u003c/mark>\n- \u003cmark>Giấy chứng nhận hoặc báo cáo thử nghiệm hiện hành:\u003c/mark>\n    -   \u003cmark>Báo cáo xác định đá quý\u003c/mark>\n    -   \u003cmark>Báo cáo trang sức\u003c/mark>\n    -   \u003cmark>Báo cáo chứng nhận vàng\u003c/mark>\n- \u003cmark>Hình ảnh sản phẩm kèm theo giấy chứng nhận hoặc báo cáo\u003c/mark>\n\n## Sản phẩm đa phương tiện\n\n\u003cmark>Bạn chỉ có thể đăng ký bán các **sản phẩm vật lý đa phương tiện** sau đây\u003c/mark>\n\n- \u003cmark>Băng cassette\u003c/mark>\n- \u003cmark>Đĩa CD & DVD\u003c/mark>\n- \u003cmark>Đĩa than\u003c/mark>\n\n## Thẻ SIM di động\n\n- Danh mục này bao gồm tất cả các loại thẻ SIM di động\n\n**❗ Tài liệu được yêu cầu**\n\n- \u003cmark>Giấy phép kinh doanh\u003c/mark>\n- \u003cmark>Thỏa thuận phân phối với nhà cung cấp dịch vụ có liên quan\u003c/mark>\n    -   \u003cmark>Giấy phép cung cấp dịch vụ viễn thông; HOẶC\u003c/mark>\n    -   \u003cmark>Hợp đồng phân phối cấp 1; HOẶC\u003c/mark>\n    -   \u003cmark>Thỏa thuận phân phối ủy quyền cho các sản phẩm và dịch vụ viễn thông.\u003c/mark>\n\n## Xe máy\n\n\u003cmark>Bạn sẽ phải nộp các tài liệu sau đây khi đăng ký bán xe máy. Khi niêm yết xe máy, bạn cũng phải điền một số thuộc tính bắt buộc.\u003c/mark>\n\n**❗ Tài liệu được yêu cầu**\n\n- \u003cmark>Giấy phép kinh doanh\u003c/mark>\n\n## Sản phẩm cũ/Sản phẩm đã qua sử dụng\n\nSản phẩm cũ/Sản phẩm đã qua sử dụng là những sản phẩm mà trước đây người khác đã sử dụng hoặc sở hữu trước khi bán cho một thực thể khác.\n\n\u003cmark>**❗** Chỉ người bán có tài khoản được quản lý mới có thể đăng ký bán các sản phẩm này.\u003c/mark>\n\n\u003cmark>Người bán có thể bán các loại Sản phẩm đã qua sử dụng sau đây nếu họ đã tham gia chương trình bằng cách gửi những tài liệu được yêu cầu cho Người quản lý tài khoản:\u003c/mark>\n\n- \u003cmark>Điện thoại, máy tính bảng, máy tính xách tay và máy tính để bàn\u003c/mark>\n- \u003cmark>Túi xách và phụ kiện\u003c/mark>\n\n## Một số sản phẩm dành cho mẹ và bé\n\nBạn sẽ phải nộp các tài liệu sau đây khi bán Vitamin và thực phẩm bổ sung cho mẹ & bé\n\n**❗ Tài liệu được yêu cầu**\n\n- \u003cmark>Đăng ký công bố sản phẩm\u003c/mark>\n- \u003cmark>Xác nhận tiếp nhận Đăng ký công bố sản phẩm\u003c/mark>\n- \u003cmark>Xác nhận Chứng nhận hợp quy đối với quy định an toàn thực phẩm\u003c/mark>\n- \u003cmark>Hình ảnh sản phẩm\u003c/mark>\n\n\u003cmark>**Lưu ý:** Sữa công thức cho trẻ sơ sinh không được quảng cáo trên TikTok Shop. Điều này bao gồm nhưng không giới hạn ở việc giảm giá, dùng voucher hay flash sale.\u003c/mark>\n\n## Sản phẩm Pin\n\n\u003cmark>Bạn sẽ cần kích hoạt tính năng 'Người bán tự vận chuyển' trước khi đăng ký Chứng nhận Ngành hàng cho các sản phẩm liệt kê bên dưới và không cần nộp thêm tài liệu bổ sung:\u003c/mark>\n\n- \u003cmark>Ô tô & Xe máy > Phụ tùng xe máy > Pin & Phụ kiện\u003c/mark>\n- \u003cmark>Ô tô & Xe máy > Phụ tùng thay thế ô tô > Pin & Phụ kiện\u003c/mark>\n- \u003cmark>Công cụ & Phần cứng > Công cụ điện > Phụ kiện công cụ điện\u003c/mark>\n\n## Sức khỏe tình dục\n\nSức khỏe tình dục đề cập đến các sản phẩm được thiết kế để hỗ trợ và nâng cao sức khỏe cá nhân và sự thân mật. Các sản phẩm này dành cho người lớn và phải tuân theo các yêu cầu quy định để đảm bảo an toàn và tuân thủ. Các danh mục phụ sau đây hiện đã mở đăng bán cho Nhà bán hàng được mời:\n\n- Chất bôi trơn\n- Bao cao su\n- Thực phẩm bổ sung tăng cường sinh lý\n\n**❗ Tài liệu được yêu cầu**\n\n1.  **Chất bôi trơn và bao cao su**\n\n- \u003cmark>Áp dụng cho Người bán doanh nghiệp\u003c/mark>\n- \u003cmark>Để đủ điều kiện danh mục: người bán đủ điều kiện cần nộp ảnh chụp màn hình sản phẩm đã bán trên các sàn thương mại điện tử khác\u003c/mark>\n- \u003cmark>Chứng nhận sản phẩm:\u003c/mark>\n    -   \u003cmark>Nhãn sản phẩm có SLH (Số Lưu Hành)\u003c/mark>\n\n1.  **Thực phẩm bổ sung tăng cường sinh lý**\n\n- \u003cmark>Áp dụng cho Người bán doanh nghiệp\u003c/mark>\n- \u003cmark>Để đủ điều kiện danh mục: người bán đủ điều kiện cần nộp ảnh chụp màn hình sản phẩm đã bán trên các sàn thương mại điện tử khác\u003c/mark>\n- \u003cmark>Chứng nhận sản phẩm:\u003c/mark>\n    -   \u003cmark>Nhãn sản phẩm có DKSP (Số Đăng ký Sản phẩm)\u003c/mark>\n\n## Voucher vật lý (Phiếu quà tặng vật lý)\n\n\u003cmark>**Voucher vật lý** là các thẻ hoặc phiếu được in dưới dạng vật lý, có thể sử dụng để đổi lấy hàng hóa hoặc dịch vụ. Các danh mục dưới đây hiện được mở **theo hình thức chỉ dành cho người bán được mời (Invite-only)**:\u003c/mark>\n\n- Voucher chụp ảnh vật lý\n- Voucher tín dụng vật lý\n- Voucher khách sạn vật lý\n- Thẻ quà tặng vật lý\n- Voucher du lịch vật lý\n- Voucher data vật lý\n- Voucher quà tặng vật lý\n- Voucher đại lý du lịch vật lý\n\n❗ **Hồ sơ bắt buộc**\n\n- \u003cmark>Chỉ áp dụng đối với **người bán doanh nghiệp được mời**:\u003c/mark>\n- \u003cmark>Hình ảnh minh chứng sản phẩm đang được bán trên các sàn thương mại điện tử khác\u003c/mark>\n\n\u003cmark>**Lưu ý:** Danh sách sản phẩm phải thể hiện rõ **thời hạn hiệu lực** và **điều kiện sử dụng** của voucher. Nghiêm cấm sử dụng các tuyên bố gây hiểu nhầm như **\"sử dụng không giới hạn\"** hoặc các nội dung có ý nghĩa tương tự.\u003c/mark>\n\n## Điều gì xảy ra nếu tôi vi phạm các nguyên tắc này?\n\n**Điều gì xảy ra nếu tôi vi phạm các nguyên tắc này?**\n\nNếu phát hiện ra rằng bạn vi phạm các nguyên tắc này, chúng tôi có thể áp dụng các hành động thực thi đối với tài khoản của bạn. Bạn nên lưu ý rằng các hành động vi phạm lặp lại sẽ dẫn đến các hình phạt nghiêm trọng hơn.\n\nVui lòng đọc bài viết [Lý do vi phạm, Điểm vi phạm & Hành động thực thi áp dụng với người bán](https://seller-vn.tiktok.com/university/essay?knowledge_id=6132077083739920&role=1&course_type=1&from=search&identity=1) và **Điều khoản dịch vụ đối với người bán** để biết thêm thông tin. Nếu bạn cho rằng hành động thực thi được áp dụng với mình do nhầm lẫn, vui lòng gửi đơn kháng nghị thông qua Trung tâm Người bán. Vui lòng đọc bài viết [Nguyên tắc kháng nghị dành cho người bán](https://seller-vn.tiktok.com/university/essay?knowledge_id=5696656206202625&role=1&course_type=1&from=search&identity=1) để biết thêm thông tin.\n\nVui lòng nhấp vào đây để đọc [Nguyên tắc về Sản phẩm bị hạn chế và Sản phẩm không được hỗ trợ của TikTok Shop.](https://seller-vn.tiktok.com/university/essay?knowledge_id=6837787798570754&role=1&course_type=1&from=search&identity=1)\n"];
