<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tìm trong ghi chú chính sách TikTok Shop</title>
<style>
  :root {
    --ink: #1c1b19;
    --muted: #5e5a54;
    --line: #e3dfd6;
    --sidebar: #f3f1ec;
    --paper: #fffcf8;
    --mark: #f4e3a4;
    --select: #e5eee4;
    --accent: #2f4a38;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
  }
  .layout {
    display: flex;
    align-items: stretch;
    height: 100%;
    min-height: 0;
  }
  .sidebar {
    width: 320px;
    flex: 0 0 320px;
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
  }
  .search-wrap { padding: 16px 14px 12px; border-bottom: 1px solid var(--line); }
  .search-wrap label {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .search-wrap input {
    width: 100%;
    font: inherit;
    font-size: 15px;
    padding: 8px 10px;
    border: 1px solid #ccc6ba;
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }
  .search-wrap input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #tree {
    overflow: auto;
    padding: 8px 8px 28px;
    flex: 1;
    min-height: 0;
  }
  #tree ul { list-style: none; margin: 0; padding: 0; }
  #tree ul ul { padding-left: 14px; }
  #tree .row {
    display: flex;
    align-items: flex-start;
  }
  #tree .row.lv1 { margin-top: 14px; }
  #tree > ul > li:first-child > .row.lv1 { margin-top: 4px; }
  #tree button.label {
    display: block;
    flex: 1 1 auto;
    width: auto;
    min-width: 0;
    text-align: left;
    background: transparent;
    border: 0;
    border-left: 2px solid transparent;
    color: inherit;
    cursor: pointer;
    border-radius: 0;
    line-height: 1.35;
  }
  #tree button.label:hover { background: rgba(0, 0, 0, 0.04); }
  #tree button.label:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #tree button.label[aria-current="true"] {
    background: var(--select);
    border-left-color: var(--accent);
  }
  #tree button.toggle,
  #tree .toggle-gap {
    flex: 0 0 26px;
    width: 26px;
    height: 26px;
    margin-top: 2px;
  }
  #tree button.toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  #tree button.toggle:hover { background: rgba(0, 0, 0, 0.06); }
  #tree button.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #tree button.toggle .chev {
    display: block;
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
  }
  #tree button.toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  #tree button.label.lv1 {
    padding: 6px 8px 6px 2px;
    font-size: 15px;
    font-weight: 650;
  }
  #tree button.label.lv2 {
    padding: 4px 8px 4px 2px;
    font-size: 13.5px;
    font-weight: 600;
  }
  #tree button.label.lv3 {
    padding: 3px 8px 3px 2px;
    font-size: 13px;
    font-weight: 500;
    color: #3a3834;
  }
  #tree button.label.lv4,
  #tree button.label.lv5,
  #tree button.label.lv6 {
    padding: 3px 8px 3px 2px;
    font-size: 12.5px;
    font-weight: 450;
    color: #5c5852;
  }
  #tree button.hit {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    width: calc(100% - 26px);
    margin: 0 0 6px 26px;
    padding: 0 8px 0 2px;
    border: 0;
    background: transparent;
    text-align: left;
    color: var(--muted);
    font: inherit;
    font-size: 12.5px;
    font-weight: 450;
    line-height: 1.35;
    cursor: pointer;
  }
  #tree button.hit:hover { background: rgba(0, 0, 0, 0.04); }
  #tree button.hit:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  mark { background: var(--mark); color: inherit; padding: 0 1px; }
  .empty { margin: 16px 10px; color: var(--muted); font-size: 14px; }
  .main {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    height: 100%;
    overflow: auto;
    overflow-anchor: none;
    scrollbar-gutter: stable;
    padding: 0 48px;
    background: var(--paper);
  }
  #reading { max-width: 40rem; }
  #top-spacer, #bottom-spacer { width: 100%; }
  .block { display: flow-root; overflow-wrap: break-word; }
  .block.hd { padding-top: 6px; }
  .article-gap { height: 1.35rem; }
  h1 { margin: 0 0 0.8rem; font-size: 1.7rem; line-height: 1.25; font-weight: 650; }
  h2 { margin: 0 0 0.6rem; font-size: 1.28rem; line-height: 1.3; font-weight: 650; }
  h3 { margin: 0 0 0.45rem; font-size: 1.1rem; line-height: 1.35; font-weight: 650; }
  h4, h5, h6 { margin: 0 0 0.35rem; font-size: 1rem; line-height: 1.4; font-weight: 650; }
  p { margin: 0 0 0.9rem; }
  ul, ol { margin: 0 0 1rem; padding-left: 1.3rem; }
  li { margin: 0.25rem 0; }
  li ul, li ol { margin-top: 0.25rem; margin-bottom: 0.25rem; }
  a { color: var(--accent); }
  .shot {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 0.35rem 0 0.75rem;
    color: var(--muted);
    font-size: 0.92rem;
  }
  .table-scroll { overflow-x: auto; margin: 0 0 1.1rem; }
  table { border-collapse: collapse; width: 100%; font-size: 0.92rem; line-height: 1.45; }
  th, td { border: 1px solid #ddd8ce; padding: 6px 8px; vertical-align: top; text-align: left; }
  th { background: #f6f4ef; font-weight: 650; }
  tr.band td { background: #f6f4ef; font-weight: 650; }
  blockquote {
    margin: 0.4rem 0 1rem;
    padding: 0 0 0 0.9rem;
    border-left: 3px solid #cfc8bb;
  }
  hr { border: 0; border-top: 1px solid var(--line); margin: 0.8rem 0 1rem; }
  #measurer {
    position: fixed;
    left: -10000px;
    top: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .reader-tools {
    position: sticky;
    top: 0;
    z-index: 5;
    margin: 0;
    padding: 12px 0 10px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .reader-tools button,
  button.part-toggle {
    font: inherit;
    font-size: 14px;
    line-height: 1.2;
    padding: 0.35rem 0.7rem;
    border: 1px solid var(--accent);
    border-radius: 4px;
    background: #fff;
    color: var(--accent);
    cursor: pointer;
  }
  button.part-toggle { font-size: 13px; padding: 0.18rem 0.5rem; }
  .reader-tools button:hover,
  button.part-toggle:hover { background: var(--select); }
  .reader-tools button:disabled,
  button.part-toggle:disabled { opacity: 0.45; cursor: default; }
  .reader-tools button:focus-visible,
  button.part-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .perf-note {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.45;
  }
  .part-tools { margin: 0.15rem 0 0.35rem; }
  .part-body { position: relative; }
  .block[data-part] { cursor: pointer; }
  .tok.motion {
    display: inline-block;
    vertical-align: baseline;
    white-space: pre;
    line-height: inherit;
    font: inherit;
    letter-spacing: inherit;
    overflow: hidden;
    margin: 0;
    padding: 0;
    border: 0;
  }
  .tok.motion.wrap { white-space: pre-wrap; }
  .dust-canvas {
    position: absolute;
    z-index: 2;
    pointer-events: none;
  }
  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: auto;
      flex: 0 1 auto;
      max-height: 42vh;
      height: auto;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .main { padding: 0 18px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="search-wrap">
      <label for="q">Tìm trong sáu bài</label>
      <input id="q" type="search" placeholder="Tìm ngưỡng, hồ sơ, mục…" autocomplete="off">
    </div>
    <nav id="tree" aria-label="Mục lục"></nav>
  </aside>
  <main class="main" id="scroller">
    <article id="reading">
    <div class="reader-tools" id="reader-tools">
      <button type="button" id="toggle-all" aria-describedby="perf-note">Xem đủ cả bài</button>
      <p class="perf-note" id="perf-note">Bụi chữ chỉ chạy cho mục đang hiện trong khung đọc. Mục nằm ngoài khung vẫn đổi chữ, nhưng không tạo hạt, vì nhiều canvas cùng lúc sẽ nặng. Cuộn ảo vẫn chỉ gắn những khối gần khung nhìn. Cùng lúc chỉ tối đa 4 mục có hạt; mục thừa trong khung chỉ đổi mờ.</p>
    </div>
      <div id="top-spacer"></div>
      <div id="window"></div>
      <div id="bottom-spacer"></div>
    </article>
  </main>
</div>
<div id="measurer" aria-hidden="true"></div>
<script>
const BASE = {
  "à":"a","á":"a","ả":"a","ã":"a","ạ":"a",
  "ă":"a","ằ":"a","ắ":"a","ẳ":"a","ẵ":"a","ặ":"a",
  "â":"a","ầ":"a","ấ":"a","ẩ":"a","ẫ":"a","ậ":"a",
  "è":"e","é":"e","ẻ":"e","ẽ":"e","ẹ":"e",
  "ê":"e","ề":"e","ế":"e","ể":"e","ễ":"e","ệ":"e",
  "ì":"i","í":"i","ỉ":"i","ĩ":"i","ị":"i",
  "ò":"o","ó":"o","ỏ":"o","õ":"o","ọ":"o",
  "ô":"o","ồ":"o","ố":"o","ổ":"o","ỗ":"o","ộ":"o",
  "ơ":"o","ờ":"o","ớ":"o","ở":"o","ỡ":"o","ợ":"o",
  "ù":"u","ú":"u","ủ":"u","ũ":"u","ụ":"u",
  "ư":"u","ừ":"u","ứ":"u","ử":"u","ữ":"u","ự":"u",
  "ỳ":"y","ý":"y","ỷ":"y","ỹ":"y","ỵ":"y",
  "đ":"d"
};
function fold(s) {
  let out = "";
  for (const ch of s.toLowerCase()) out += BASE[ch] || ch;
  return out;
}
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, "&quot;");
}
function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const f = fold(text);
  let html = "";
  let i = 0;
  while (i < text.length) {
    const idx = f.indexOf(q, i);
    if (idx < 0) { html += escapeHtml(text.slice(i)); break; }
    html += escapeHtml(text.slice(i, idx));
    html += "<mark>" + escapeHtml(text.slice(idx, idx + q.length)) + "</mark>";
    i = idx + q.length;
  }
  return html;
}
function searchPlain(src) {
  return src
    .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/<br\s*\/?>/gi, " ")
    .replace(/\\\*/g, "*")
    .replace(/[*_`]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}
function safeUrl(url) {
  const t = String(url || "").trim();
  if (/^https?:\/\//i.test(t)) return t;
  return "";
}
function mediaName(url) {
  const id = String(url || "").match(/\/([A-Fa-f0-9]{16,})~/);
  const ext = String(url || "").match(/\.(png|gif|jpe?g|webp|mp4|webm)(?:\?|$)/i);
  if (!id || !ext) return "";
  const e = ext[1].toLowerCase() === "jpeg" ? "jpg" : ext[1].toLowerCase();
  return id[1] + "." + e;
}
function shotHtml(url) {
  const remote = safeUrl(url);
  const name = mediaName(url);
  // ponytail: files are media/<id>.<ext> next to mockups/. A URL without /<id>~ stays remote.
  const local = name ? "../media/" + name : "";
  const src = local || remote;
  if (!src) return '<span class="shot">Nguồn có ảnh chụp màn hình.</span>';
  const fallback = local && remote ? ' data-remote="' + escapeAttr(remote) + '"' : "";
  return '<img class="shot" alt="" src="' + escapeAttr(src) + '"' + fallback + ">";
}
function renderInline(src) {
  const lines = String(src).split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) out.push(renderInlineLine(lines[i]));
  return out.join("<br>");
}
function renderInlineLine(src) {
  const tokens = [];
  let s = src;
  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function (_m, _alt, url) {
    tokens.push({ t: "img", url: url });
    return "\uE000" + (tokens.length - 1) + "\uE001";
  });
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_m, label, url) {
    tokens.push({ t: "a", label: label, url: url });
    return "\uE000" + (tokens.length - 1) + "\uE001";
  });
  s = s.replace(/<br\s*\/?>/gi, function () {
    tokens.push({ t: "br" });
    return "\uE000" + (tokens.length - 1) + "\uE001";
  });
  s = s.replace(/\\\*/g, function () {
    tokens.push({ t: "star" });
    return "\uE000" + (tokens.length - 1) + "\uE001";
  });
  s = escapeHtml(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  s = s.replace(/\uE000(\d+)\uE001/g, function (_m, n) {
    const tok = tokens[Number(n)];
    if (tok.t === "img") return shotHtml(tok.url);
    if (tok.t === "br") return "<br>";
    if (tok.t === "star") return "*";
    const label = renderInlineLine(tok.label);
    const href = safeUrl(tok.url);
    if (!href) return label;
    return '<a href="' + escapeAttr(href) + '" target="_blank" rel="noopener noreferrer">' + label + "</a>";
  });
  return s;
}
function isHeading(line) { return /^(#{1,6})\s+\S/.test(line); }
function isHr(line) { return /^\s*-{3,}\s*$/.test(line); }
function isQuote(line) { return /^>\s?/.test(line); }
function isTableLine(line) { return /^\s*\|/.test(line); }
function isImageLine(line) { return /^\s*!\[[^\]]*\]\([^)]+\)\s*$/.test(line); }
function isListLine(line) { return /^(\s*)([-*]|\d+\.)\s+\S/.test(line); }
function isListAttach(line) { return /^\s+\S/.test(line); }
function isStructural(line) {
  return isHeading(line) || isHr(line) || isQuote(line) || isTableLine(line) || isImageLine(line) || isListLine(line);
}
function splitRow(line) {
  let s = line.trim();
  if (s.charAt(0) === "|") s = s.slice(1);
  if (s.charAt(s.length - 1) === "|") s = s.slice(0, -1);
  return s.split("|").map(function (c) { return c.trim(); });
}
function isSep(line) {
  const cells = splitRow(line);
  return cells.length > 0 && cells.every(function (c) { return /^:?-{3,}:?$/.test(c.replace(/\s/g, "")); });
}
function isBand(cells) {
  if (cells.length < 2 || !searchPlain(cells[0] || "")) return false;
  for (let i = 1; i < cells.length; i++) if (searchPlain(cells[i] || "")) return false;
  return true;
}
function renderTable(lines) {
  const parsed = [];
  let sepAt = -1;
  for (let i = 0; i < lines.length; i++) {
    if (isSep(lines[i])) {
      if (sepAt < 0) sepAt = parsed.length;
      continue;
    }
    parsed.push(splitRow(lines[i]));
  }
  const headCount = sepAt < 0 ? 0 : sepAt;
  let html = '<div class="table-scroll"><table>';
  if (headCount) {
    html += "<thead>";
    for (let r = 0; r < headCount; r++) html += rowHtml(parsed[r], "th", false);
    html += "</thead>";
  }
  if (headCount < parsed.length) {
    html += "<tbody>";
    for (let r = headCount; r < parsed.length; r++) html += rowHtml(parsed[r], "td", isBand(parsed[r]));
    html += "</tbody>";
  }
  html += "</table></div>";
  const plains = [];
  for (let r = 0; r < parsed.length; r++) {
    for (let c = 0; c < parsed[r].length; c++) {
      const t = searchPlain(parsed[r][c]);
      if (t) plains.push(t);
    }
  }
  return { html: html, plain: plains.join(" ") };
}
function rowHtml(cells, tag, band) {
  let html = band ? '<tr class="band">' : "<tr>";
  for (let i = 0; i < cells.length; i++) html += "<" + tag + ">" + renderInline(cells[i]) + "</" + tag + ">";
  html += "</tr>";
  return html;
}
function takeList(lines, start) {
  const buf = [];
  let i = start;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) {
      let j = i + 1;
      while (j < lines.length && !lines[j].trim()) j++;
      if (j < lines.length && (isListLine(lines[j]) || isListAttach(lines[j]))) {
        i = j;
        continue;
      }
      break;
    }
    if (isListLine(line) || (buf.length && isListAttach(line))) {
      buf.push(line);
      i++;
      continue;
    }
    break;
  }
  return { buf: buf, next: i };
}
function parseItems(lines) {
  const root = { children: [] };
  const stack = [{ indent: -1, node: root }];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const marker = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line);
    if (marker) {
      const indent = marker[1].length;
      const kind = marker[2] === "-" || marker[2] === "*" ? "ul" : "ol";
      const num = kind === "ol" ? parseInt(marker[2], 10) : 0;
      const node = { kind: kind, num: num, text: marker[3], children: [] };
      while (stack.length > 1 && indent <= stack[stack.length - 1].indent) stack.pop();
      stack[stack.length - 1].node.children.push(node);
      stack.push({ indent: indent, node: node });
    } else if (stack.length > 1) {
      stack[stack.length - 1].node.text += "\n" + line.trim();
    }
  }
  return root.children;
}
function itemsPlain(items) {
  const parts = [];
  for (let i = 0; i < items.length; i++) {
    const t = searchPlain(items[i].text);
    if (t) parts.push(t);
    if (items[i].children.length) {
      const c = itemsPlain(items[i].children);
      if (c) parts.push(c);
    }
  }
  return parts.join(" ");
}
function renderItems(items) {
  let html = "";
  let i = 0;
  while (i < items.length) {
    const kind = items[i].kind;
    let j = i + 1;
    while (j < items.length && items[j].kind === kind) j++;
    html += kind === "ol" ? "<ol>" : "<ul>";
    for (let k = i; k < j; k++) {
      html += kind === "ol" && items[k].num ? '<li value="' + items[k].num + '">' : "<li>";
      html += renderInline(items[k].text);
      if (items[k].children.length) html += renderItems(items[k].children);
      html += "</li>";
    }
    html += kind === "ol" ? "</ol>" : "</ul>";
    i = j;
  }
  return html;
}
function estimate(block) {
  if (block.type === "gap") return 22;
  if (block.type === "hr") return 24;
  if (block.type === "img") return 240;
  if (block.type === "h") return block.lv === 1 ? 56 : 42;
  if (block.type === "table") return 160;
  const n = (block.plain || "").length;
  return Math.max(28, Math.min(900, 24 + Math.ceil(n / 60) * 26));
}
function parseDocument(md, register) {
  const lines = String(md).replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (isHeading(line)) {
      const mark = /^(#{1,6})\s+/.exec(line);
      const lv = mark[1].length;
      const text = line.slice(mark[0].length).trim();
      const record = register !== false;
      const id = record ? "h" + (headingSeq++) : "";
      const node = record ? { id: id, lv: lv, label: searchPlain(text), direct: "", blockIndex: 0, children: [] } : null;
      if (record) headings.push(node);
      out.push({
        type: "h",
        lv: lv,
        headingId: id,
        node: node,
        html: "<h" + lv + ">" + renderInline(text) + "</h" + lv + ">",
        plain: searchPlain(text)
      });
      i++;
      continue;
    }
    if (isHr(line)) {
      out.push({ type: "hr", html: "<hr>", plain: "" });
      i++;
      continue;
    }
    if (isQuote(line)) {
      const buf = [];
      while (i < lines.length && isQuote(lines[i])) {
        buf.push(lines[i].replace(/^>\s?/, ""));
        i++;
      }
      const text = buf.join(" ");
      out.push({ type: "quote", html: "<blockquote><p>" + renderInline(text) + "</p></blockquote>", plain: searchPlain(text) });
      continue;
    }

function matchSnippet(direct, q) {
